            term:
              id: MONDO:0032579
              label: warburg-cinotti syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated Fibroblast ECM Remodeling
        biological_scale: CELLULAR
        description: 'The fibroblast is the effector cell, and the output is a matrix program running
          without its normal input. DDR2''s physiological role is to sense collagen and regulate connective-tissue
          formation, so a receptor locked on produces continuous remodelling signalling in a tissue that
          is not remodelling. This single node accounts for the clinically paradoxical combination of
          proliferative lesions (keloids, corneal pannus) and destructive ones (ulcers, subcutaneous wasting,
          acro-osteolysis): both are outputs of unregulated matrix turnover, not of two separate processes.

          '
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: extracellular matrix disassembly
          modifier: INCREASED
          term:
            id: GO:0022617
            label: extracellular matrix disassembly
        - preferred_term: collagen catabolic process
          modifier: INCREASED
          term:
            id: GO:0030574
            label: collagen catabolic process
      selected_evidence:
        snippet: DDR2 encodes a collagen-responsive receptor tyrosine kinase that regulates connective-tissue
          formation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
