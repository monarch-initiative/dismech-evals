      assertion_type: Discussion
      assertion:
        discussion_id: weaver_neuroblastoma_mechanistic_bridge
        prompt: By what developmental and cell-type-specific mechanism does a germline heterozygous EZH2
          pathogenic variant increase neuroblastoma frequency in Weaver syndrome?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Neuroblastoma Predisposition
        - pathophysiology#Impaired Polycomb Repression and Gene Derepression
        rationale: The human association with neuroblastoma is recognized, but the curated molecular studies
          establish PRC2/H3K27 disruption and growth-gene derepression in stem-cell systems rather than
          a transformation mechanism in the sympathoadrenal lineage from which neuroblastoma arises. Connecting
          these observations without lineage-specific evidence would overstate the pathograph. Resolving
          the bridge matters both for biological interpretation and for determining whether surveillance
          should eventually be stratified by variant or molecular phenotype.
        proposed_experiments:
        - experiment_id: weaver-neural-crest-neuroblastoma-model
          name: Isogenic human sympathoadrenal-lineage tumor-predisposition model
          description: Differentiate isogenic human iPSCs carrying representative heterozygous Weaver
            EZH2 variants and corrected controls through neural crest into sympathoadrenal progenitors,
            then follow chromatin state, differentiation, proliferation, and transformation-associated
            phenotypes longitudinally.
          readouts:
          - name: Variant-dependent H3K27/cPRC1 state and sympathoadrenal differentiation trajectory
            target: pathophysiology#Impaired Polycomb Repression and Gene Derepression
          - name: Persistent proliferative or transformation-associated phenotype in sympathoadrenal progenitors
            target: phenotypes#Neuroblastoma Predisposition
          decision_criterion: A reproducible variant-dependent chromatin defect that precedes impaired
            sympathoadrenal differentiation and persistent proliferative behavior, and is reversed by
            isogenic correction, would support a mechanistic bridge. Normal lineage behavior despite the
            expected H3K27 defect would argue that additional developmental, somatic, or environmental
            events are required.
      selected_evidence:
        snippet: Neuroblastoma occurs at an increased frequency in individuals with a heterozygous EZH2
          pathogenic variant.
        supports: SUPPORT
