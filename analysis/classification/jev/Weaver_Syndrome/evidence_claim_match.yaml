      assertion_type: AnimalModel
      assertion:
        species: Mouse
        genotype: Ezh2 p.R684C knock-in (Ezh2R684C/+ heterozygous; Ezh2R684C/R684C homozygous)
        category: knock-in mouse model
        description: Knock-in mouse model of the most common Weaver syndrome EZH2 missense variant (p.R684C).
          Homozygous MEFs show global H3K27me3 depletion; heterozygous mice show abnormal bone parameters
          indicative of skeletal overgrowth and increased osteoblast osteogenic activity, with BMP-pathway
          and osteoblast-differentiation transcriptional dysregulation. Excess osteogenesis is reversible
          by inhibiting the opposing H3K27 demethylases KDM6A/KDM6B, demonstrating reversibility and therapeutic
          potential of epigenetic modulating agents.
        genes:
        - preferred_term: EZH2
          term:
            id: hgnc:3527
            label: EZH2
        associated_phenotypes:
        - Skeletal overgrowth
        - Excess osteogenesis
        - Global H3K27me3 depletion
      selected_evidence:
