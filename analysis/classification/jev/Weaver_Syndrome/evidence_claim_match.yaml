              germline pathogenic EZH2 variants in Weaver syndrome are predominantly missense. In vitro
              reconstitution demonstrates reduced methyltransferase activity for tested Weaver-associated
              amino-acid changes. Isogenic work on ten representative variants further supports dominant-negative
              interference with PRC2 activity, but does not establish identical behavior for every reported
              allele.
