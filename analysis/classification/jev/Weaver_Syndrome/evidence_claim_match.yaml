      assertion_type: Discussion
      assertion:
        discussion_id: weaver_r684c_skeletal_model_generalizability
        prompt: Does the skeletal mechanism observed in the Ezh2 p.R684C knock-in mouse generalize to
          the diverse heterozygous EZH2 variants and developing human bone represented in Weaver syndrome?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Dysregulated Osteoblast Differentiation and Excess Osteogenesis
        rationale: The p.R684C mouse provides coherent molecular, cellular, and bone-level evidence for
          excess osteogenesis, but it models one recurrent allele. Its H3K27me3 readout was measured in
          homozygous mouse embryonic fibroblasts, whereas its skeletal phenotype was measured in heterozygous
          mice and osteoblasts. Human disease is heterozygous and genetically heterogeneous, and no cited
          study directly measures osteoblast differentiation or advanced bone age in human variant-bearing
          skeletal cells. The model therefore supports a candidate skeletal mechanism without establishing
          pan-allelic human generality.
        proposed_experiments:
        - experiment_id: weaver-human-osteoblast-allelic-series
          name: Isogenic human osteoblast allelic-series study
          description: Generate heterozygous p.R684C and several structurally diverse Weaver-associated
            EZH2 variants in the same human iPSC background, differentiate them through mesenchymal progenitors
            into osteoblasts, and compare them with corrected isogenic controls across matched time points.
          readouts:
          - name: H3K27me2/3 abundance, BMP-pathway transcription, and osteogenic differentiation kinetics
              by allele
            target: pathophysiology#Dysregulated Osteoblast Differentiation and Excess Osteogenesis
          decision_criterion: Concordant H3K27 loss and excess osteogenesis across variant classes, with
            correction after restoration of wild-type EZH2 dosage, would support a general human skeletal
            mechanism. Absent, opposite, or allele-restricted effects would confine the mouse result to
            p.R684C or identify mechanistic subgroups.
      selected_evidence:
        snippet: We generated a mouse model for the most common Weaver syndrome missense variant, EZH2
          p.R684C. Ezh2R684C/R684C mouse embryonic fibroblasts (MEFs) showed global depletion of H3K27me3.
          Ezh2R684C/+ mice had abnormal bone parameters, indicative of skeletal overgrowth, and Ezh2R684C/+
          osteoblasts showed increased osteogenic activity.
        supports: SUPPORT
