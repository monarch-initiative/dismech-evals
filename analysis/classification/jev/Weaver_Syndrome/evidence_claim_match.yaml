  3058ad46c4896354caab289ff44feb6b4f96382e3c952d7565ff393c3d5a1344:
    claim:
      about:
        disease:
          name: Weaver Syndrome
          disease_term:
            preferred_term: Weaver syndrome
            description: EZH2-related autosomal dominant overgrowth syndrome with advanced bone age, distinctive
              facies, and variable intellectual disability.
            term:
              id: MONDO:0010193
              label: Weaver syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: weaver_ezh2_variant_mechanism_controversy
        prompt: Do Weaver-associated EZH2 missense variants act as hypomorphic loss-of-function alleles,
          so that the phenotype follows reduced PRC2 catalytic dosage, or as dominant-negative alleles
          that poison PRC2 complexes containing wild-type EZH2?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced EZH2/PRC2 Histone Methyltransferase Activity
        - mechanistic_hypotheses#loss_of_function_prc2
        - mechanistic_hypotheses#dominant_negative_prc2
        posed_by: claude-code
        posed_date: '2026-09-05T00:00:00Z'
        rationale: Both positions rest on in vitro data. The 2016 reconstitution work measured reduced
          methyltransferase activity for tested alleles and called them hypomorphic; the 2025 isogenic
          study reasoned from the absence of early truncating alleles and from the disproportionate H3K27me2/3
          loss at low mutant expression to a dominant-negative mechanism. No published experiment compares
          a heterozygous missense knock-in against a heterozygous null in the same genetic background,
          which is the comparison that separates the two. The nearest human approximation is a de novo
          whole-gene EZH2 deletion that produced a Weaver-like phenotype (PMID:28696078), which shows
          the null route can reach the same clinical picture and so argues against treating the dominant-negative
          reading as established. Until the isogenic comparison exists the variant's functional_impact_category
          is UNKNOWN rather than one side's reading.
        proposed_experiments:
        - experiment_id: exp_weaver_ezh2_knockin_vs_null_isogenic
          name: Isogenic heterozygous EZH2 knock-in versus heterozygous EZH2 null comparison
          description: Generate isogenic human iPSC lines carrying representative Weaver missense alleles
            (SET-domain and pre-SET) as heterozygous knock-ins alongside a heterozygous EZH2 null (frameshift)
            line and a corrected control. Differentiate to neural progenitors and mesenchymal/osteogenic
            lineages. Quantify global and locus-level H3K27me2/3 (mass spectrometry and CUT&RUN), H3K27ac
            at Polycomb targets, PRC2 subunit incorporation by co-immunoprecipitation, and derepression
            of canonical Polycomb targets by RNA-seq. Add a titration arm expressing mutant EZH2 at sub-endogenous
            levels in wild-type cells.
          experiment_type:
            preferred_term: Isogenic iPSC knock-in versus null allelic series with chromatin readouts
          decision_criterion: Dominant-negative interference is supported if heterozygous missense knock-ins
            reduce H3K27me3 and derepress targets more than the heterozygous null and if low-level mutant
            expression in wild-type cells reproduces the deficit; hypomorphic loss of function is supported
            if knock-in and null lines are indistinguishable and the deficit scales with dosage.
          would_support:
          - mechanistic_hypotheses#dominant_negative_prc2
          - mechanistic_hypotheses#loss_of_function_prc2
          would_refute:
          - mechanistic_hypotheses#loss_of_function_prc2
          - mechanistic_hypotheses#dominant_negative_prc2
          supporting_outcome:
          - 'Knock-in lines show a larger H3K27me3 loss than the null line, and sub-endogenous mutant
            expression poisons wild-type PRC2 output: the dominant-negative model holds and the category
            should become DOMINANT_NEGATIVE.'
          refuting_outcome:
          - 'Knock-in and null lines match on every chromatin readout and mutant titration is inert below
            half dosage: the alleles behave as hypomorphs and the category should become PARTIAL_LOSS_OF_FUNCTION.'
      selected_evidence:
        snippet: suggesting that EZH2 mutations associated with WS are loss‐of‐function (hypomorphic)
          mutations.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26694085
      reference_title: Weaver Syndrome-Associated EZH2 Protein Variants Show Impaired Histone Methyltransferase
        Function In Vitro.
      evidence_source: IN_VITRO
      explanation: In vitro reconstitution of tested alleles reads them as hypomorphic loss of function,
        the position the loss_of_function_prc2 hypothesis records.
