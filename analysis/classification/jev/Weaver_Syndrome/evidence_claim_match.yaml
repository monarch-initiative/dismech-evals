            description: EZH2-related autosomal dominant overgrowth syndrome with advanced bone age, distinctive
              facies, and variable intellectual disability.
            term:
              id: MONDO:0010193
              label: Weaver syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced EZH2/PRC2 Histone Methyltransferase Activity
        conforms_to: epigenetic_machinery_neurodevelopmental_dysregulation#Epigenetic Machinery Component
          Haploinsufficiency
        description: EZH2 is the catalytic subunit of Polycomb repressive complex 2 (PRC2), the predominant
          enzyme that mono-, di-, and trimethylates histone H3 lysine 27 (H3K27me1/2/3). Heterozygous
          germline pathogenic EZH2 variants in Weaver syndrome are predominantly missense. In vitro reconstitution
          demonstrates reduced methyltransferase activity for tested Weaver-associated amino-acid changes.
          Isogenic work on ten representative variants further supports dominant-negative interference
          with PRC2 activity, but does not establish identical behavior for every reported allele.
        biological_scale: MOLECULAR
        gene:
          preferred_term: EZH2
          term:
            id: hgnc:3527
            label: EZH2
        genetic_context:
          gene:
            preferred_term: EZH2
            term:
              id: hgnc:3527
              label: EZH2
          variant_origin: GERMLINE
          allelic_events:
          - PATHOGENIC_VARIANT
          zygosity: HETEROZYGOUS
          functional_impact_category: UNKNOWN
          description: 'Heterozygous germline EZH2 pathogenic variants are the disease trigger; most reported
            alleles are missense, but the structured context does not restrict the mechanism to one sequence-variant
            class. The functional impact is recorded as UNKNOWN because the literature is split: in vitro
            reconstitution classifies tested alleles as hypomorphic loss of function (mechanistic_hypotheses#loss_of_function_prc2),
            while isogenic co-expression work argues for dominant-negative poisoning of PRC2 (mechanistic_hypotheses#dominant_negative_prc2).
            See the weaver_ezh2_variant_mechanism_controversy discussion for the discriminating experiment.'
        biological_processes:
        - preferred_term: peptidyl-lysine (H3K27) methylation
          term:
            id: GO:0018022
            label: peptidyl-lysine methylation
          modifier: DECREASED
        molecular_functions:
        - preferred_term: histone H3K27 methyltransferase activity
          term:
            id: GO:0046976
            label: histone H3K27 methyltransferase activity
          modifier: DECREASED
        protein_complexes:
        - preferred_term: PRC2 (PcG protein complex)
          term:
            id: GO:0031519
            label: PcG protein complex
      selected_evidence:
        snippet: Heterozygous missense mutations in EZH2 cause Weaver syndrome (WS), a developmental disorder
          characterized by intellectual disability and overgrowth. EZH2 encodes the enzymatic subunit
          of Polycomb repressive complex 2 (PRC2), which mediates monomethylation, dimethylation, and
          trimethylation of histone H3 lysine 27 (H3K27me1/2/3).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40846643
      reference_title: Dominant-negative effects of Weaver syndrome-associated EZH2 variants.
      evidence_source: IN_VITRO
      explanation: Supports the causal heterozygous EZH2 context and the PRC2 H3K27 catalytic function
