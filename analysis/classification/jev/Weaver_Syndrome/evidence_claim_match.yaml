              description: 'Heterozygous germline EZH2 pathogenic variants are the disease trigger; most
                reported alleles are missense, but the structured context does not restrict the mechanism
                to one sequence-variant class. The functional impact is recorded as UNKNOWN because the
                literature is split: in vitro reconstitution classifies tested alleles as hypomorphic
