      reference_title: The phenotype of EZH2 haploinsufficiency-1.2-Mb deletion at 7q36.1 in a child with
        tall stature and intellectual disability.
      evidence_source: HUMAN_CLINICAL
      explanation: A de novo deletion removing the whole EZH2 gene produced tall stature and intellectual
        disability, so true haploinsufficiency can reproduce the clinical picture without a mutant protein.
        This is the nearest human approximation to the null arm of the discriminating experiment, and
        it argues that a poison protein is not required for the phenotype.
