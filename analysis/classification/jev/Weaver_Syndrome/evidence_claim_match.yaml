          severity.
      selected_evidence:
        snippet: Emerging evidence in the literature indicates that Weaver syndrome EZH2 mutations may
          result in loss of function of the gene and our report suggests that haploinsufficiency of EZH2
          may replicate the clinical phenotype of Weaver syndrome.
        supports: SUPPORT
