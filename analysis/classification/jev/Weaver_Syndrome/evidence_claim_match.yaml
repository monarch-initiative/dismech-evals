              facies, and variable intellectual disability.
            term:
              id: MONDO:0010193
              label: Weaver syndrome
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: dominant_negative_prc2
        hypothesis_label: Dominant-negative interference with PRC2
        status: EMERGING
        description: 'The scarcity of early truncating EZH2 variants and structural analysis support a
          dominant-negative mechanism, in which mutant EZH2 interferes with PRC2 activity (lowering H3K27me2/3
          and increasing H3K27ac) rather than acting purely by haploinsufficiency. This contrasts with
          gain-of-function EZH2 variants that cause growth restriction, producing reciprocal chromatin/transcriptional
          changes. That reciprocal arm is single-source: it rests on the same study, and a targeted search
          found no independent primary report of a germline gain-of-function EZH2 growth-restriction syndrome.
          Somatic Y641 gain-of-function alleles raise H3K27me3 but cause lymphoma rather than a growth
          syndrome.'
      selected_evidence:
        snippet: the lack of early truncating mutations in EZH2 led us to hypothesize a dominant-negative
          mechanism for WS, which was supported by our structural analysis of all known WS-associated
          EZH2 variants.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40846643
      reference_title: Dominant-negative effects of Weaver syndrome-associated EZH2 variants.
      evidence_source: IN_VITRO
      explanation: Directly states the dominant-negative hypothesis and its structural support.
