      assertion_type: Treatment
      assertion:
        name: Risk-Factor Avoidance
        description: 'Avoidance recommendations in WS are not generic lifestyle advice: they are targeted
          at the specific acquired diseases that kill WS patients or cause the signature morbidity. Smoking
          and obesity are avoided for atherosclerosis (myocardial infarction being one of the two leading
          causes of death); smoking and alcohol for osteoporosis and cataracts, both of which arrive decades
          early; and falls, extremity trauma and excessive sun exposure because extremity trauma can worsen
          vulnerable skin and chronic ulcers.

          '
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: behavioral counseling
          term:
            id: NCIT:C181743
            label: Behavioral Counseling
      selected_evidence:
        snippet: Avoid smoking and obesity, which increase the risk for atherosclerosis. Avoid smoking
          and alcohol, which increase the risk of osteoporosis and cataracts. Avoid falls, trauma to the
          extremities, and excessive sun exposure.
        supports: SUPPORT
