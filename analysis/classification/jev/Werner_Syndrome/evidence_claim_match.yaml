              label: Werner syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Segmental Progeroid Tissue Failure
        biological_scale: ORGANISM
        conforms_to: genomic_instability_aging#DNA-Damage-Driven Cellular Dysfunction and Aging
        description: 'The organismal phenotype is segmental rather than global: some age-related changes
          are strikingly accelerated (cataract, hair graying and loss, skin atrophy, osteoporosis, atherosclerosis,
          type 2 diabetes) while others characteristic of normal aging are absent — Alzheimer-type dementia
          and increased amyloid deposition are not features, and the osteoporosis is worse in distal limb
          bones than in the vertebral column, the reverse of ordinary aging. The segmental pattern is
          a substantive constraint on the "accelerated aging" framing and should not be smoothed over:
          WS is not normal aging run fast.

          '
      selected_evidence:
        snippet: telomere dysfunction elicits a classical Werner-like premature aging syndrome typified
          by premature death, hair graying, alopecia, osteoporosis, type II diabetes and cataracts
        supports: SUPPORT
