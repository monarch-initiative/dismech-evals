        biological_scale: MOLECULAR
        conforms_to: antisense_oligonucleotide_therapy#Pathogenic Pre-mRNA Missplicing
        description: In the genotype-specific subgroup homozygous for WRN c.3139-1G>C, disruption of the
          intron-25 splice acceptor causes exon 26 skipping, a frameshift, and a premature stop in exon
          27. This therapeutic vulnerability is not asserted for other WRN genotypes or for Werner syndrome
          generally.
        genes:
        - preferred_term: WRN
          term:
            id: hgnc:12791
            label: WRN
        biological_processes:
        - preferred_term: RNA splicing
          term:
            id: GO:0008380
            label: RNA splicing
          modifier: ABNORMAL
      selected_evidence:
