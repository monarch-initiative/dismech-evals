    evidence_metadata:
      reference: PMID:35534204
      reference_title: Targeted long-read sequencing identifies missing pathogenic variants in unsolved
        Werner syndrome cases.
      evidence_source: HUMAN_CLINICAL
      explanation: Directly supports long-read escalation and shows why both noncoding splice variation
        and structural variation must be considered.
