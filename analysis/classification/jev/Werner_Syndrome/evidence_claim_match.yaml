      assertion_type: Treatment
      assertion:
        name: Nicotinamide Riboside (EMPOWER Early-Phase Trial)
        description: Oral nicotinamide riboside (NR) 1000 mg daily was evaluated in a phase I/II double-blind
          randomized crossover study (26 weeks per arm). Eleven patients enrolled, nine were randomized,
          and six completed. No serious adverse events were reported during NR treatment; CAVI and ulcer-area
          signals favored NR. Interpretation is limited by the single-center sample, dropouts, no washout,
          and ulcer analysis in only three patients (all received NR first). Right ABI worsened statistically,
          and blood pressure, sarcopenia, lipid, glucose, and kidney-function markers did not differ significantly.
          NR is therefore an investigational option with early human evidence, not established disease-modifying
          care.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
        target_phenotypes:
        - preferred_term: Skin ulcer
          term:
            id: HP:0200042
            label: Skin ulcer
        - preferred_term: Atherosclerosis
          term:
            id: HP:0002621
            label: Atherosclerosis
      selected_evidence:
        snippet: No serious adverse events were observed during NR treatment. Importantly, CAVI improved,
          the skin ulcer area decreased, and heel pad thinning showed a declining trend.
        supports: SUPPORT
