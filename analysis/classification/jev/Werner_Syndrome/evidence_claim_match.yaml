  10038e49bad2812fb8b665b0dd5e926bbe7f41cc90f44e665174d04cda2496ee:
    claim:
      about:
        disease:
          name: Werner Syndrome
          disease_term:
            preferred_term: Werner syndrome
            term:
              id: MONDO:0010196
              label: Werner syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: WRN Helicase-Exonuclease Loss of Function
        biological_scale: MOLECULAR
        description: 'Biallelic null variants in WRN abolish a 1,432-amino-acid nuclear protein that combines
          an ATP-dependent 3''->5'' DNA helicase with an N-terminal 3''->5'' exonuclease domain. The combination
          of the two catalytic activities in one polypeptide is unique among the five human RecQ helicases.
          Most disease alleles are stop codons, small indels or splice variants that truncate the protein
          and remove its C-terminal nuclear localization signal, so the residual product is excluded from
          the nucleus or degraded; the effect is loss of WRN function rather than a variant protein with
          altered activity.

          '
        genes:
        - preferred_term: WRN
          term:
            id: hgnc:12791
            label: WRN
        molecular_functions:
        - preferred_term: WRN 3'->5' DNA helicase activity
          term:
            id: GO:0003678
            label: DNA helicase activity
          modifier: LOSS_OF_FUNCTION
        - preferred_term: WRN 3'->5' exonuclease activity
          term:
            id: GO:0008408
            label: 3'-5' exonuclease activity
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: The predicted protein is 1432 amino acids in length and shows significant similarity
          to DNA helicases.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:8602509
      reference_title: Positional cloning of the Werner's syndrome gene.
      evidence_source: HUMAN_CLINICAL
      explanation: The original positional cloning study identifies the WS gene product as a putative
        DNA helicase of 1,432 residues.
