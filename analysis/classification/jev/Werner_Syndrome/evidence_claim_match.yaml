          value:
            name: Telomere-limited Wrn-null mouse (mTerc-/- Wrn-/-)
            species: Mouse
            genotype: Wrn-/- Terc-/- (late generation)
            publication: PMID:15235603
            description: 'Wrn-null mice on a telomerase-proficient background are essentially unaffected,
              which for years made WS look untranslatable to the mouse. Crossing Wrn deficiency onto a
              Terc-null background and breeding to late generations exhausts the mouse''s long telomere
              reserve and unmasks a Werner-like syndrome. The model demonstrates that telomere reserve
              is rate-limiting in this engineered mouse background; it does not by itself establish telomere
              attrition as the primary human organismal trigger.

              '
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Telomere Maintenance Failure
        relationship: RECAPITULATES
        fidelity: HIGH
        description: 'Late-generation double-null mice demonstrate that telomere exhaustion can precipitate
          a Werner-like phenotype from Wrn loss in this engineered model.

          '
        limitations: 'The requirement for an engineered telomerase-null background is itself a species
          difference: laboratory mice have telomeres far longer than humans, so the model reconstructs
          a human baseline rather than reproducing one. Conclusions about the ordering of events transfer
          better than conclusions about rates.'
      selected_evidence:
        snippet: the lack of a disease phenotype in Wrn-deficient mice with long telomeres implicate telomere
          attrition in the pathogenesis of Werner syndrome
        supports: SUPPORT
