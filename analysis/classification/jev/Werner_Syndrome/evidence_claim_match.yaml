      assertion:
        name: Cancer Predisposition with Mesenchymal Weighting
        biological_scale: ORGANISM
        description: 'WS confers a strong, type-specific predisposition to a narrow set of neoplasms rather
          than a general increase in cancer. Six tumor types — thyroid neoplasms, malignant melanoma,
          meningioma, soft tissue sarcoma, leukemia and pre-leukemic marrow conditions, and primary bone
          neoplasms — account for about two-thirds of all reported neoplasms in WS patients, and the standardized
          incidence ratios in Japan-resident patients are elevated for all of these except leukemia. The
          mesenchymal and neural-crest weighting is the mechanistically informative part: it is the opposite
          of the epithelial-dominated spectrum of ordinary aging. The lineage bias remains mechanistically
          unresolved and should not be attributed to a specific telomere-maintenance pathway without direct
          evidence.

          '
      selected_evidence:
        snippet: The most frequent neoplasms in WS patients, representing 2/3 of all reports, were thyroid
          neoplasms, malignant melanoma, meningioma, soft tissue sarcomas, leukemia and pre-leukemic conditions
          of the bone marrow, and primary bone neoplasms.
        supports: SUPPORT
