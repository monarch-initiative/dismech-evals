      assertion_type: Pathophysiology
      assertion:
        name: Telomere Maintenance Failure
        biological_scale: MOLECULAR
        conforms_to: telomere_attrition#Progressive Telomere Attrition
        description: 'Telomeric TTAGGG repeats form G-quadruplex structures that are preferred WRN substrates,
          and telomere replication requires resolution of four-way junctions at D- and T-loops. In the
          absence of WRN these structures can persist and telomere replication is impaired. Telomerase
          rescue in patient fibroblasts and the phenotype of late-generation Wrn-/- Terc-/- mice support
          telomere reserve as a rate-limiting model. They do not establish telomere attrition as the unique
          proximate trigger of the human multisystem phenotype.

          '
        biological_processes:
        - preferred_term: telomere maintenance
          term:
            id: GO:0000723
            label: telomere maintenance
          modifier: DECREASED
      selected_evidence:
        snippet: The capacity of enforced telomerase expression to rescue premature senescence of cultured
          cells from individuals with Werner syndrome
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15235603
      reference_title: Essential role of limiting telomeres in the pathogenesis of Werner syndrome.
      evidence_source: IN_VITRO
      explanation: Telomerase rescue places telomere reserve upstream of premature senescence in cultured
        WS fibroblasts, not necessarily upstream of every human feature.
