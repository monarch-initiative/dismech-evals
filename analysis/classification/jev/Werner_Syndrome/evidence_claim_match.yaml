          Premature exhaustion of the proliferative reserve of mesenchymal and other renewable cell populations
          is the cellular event most directly connected to the progeroid tissue phenotypes. Enforced telomerase
          expression rescues premature senescence in cultured WS fibroblasts, while adipose and iPSC-derived
          models also implicate non-telomeric inflammatory programs; the relative contribution in patients
          is unresolved.

          '
