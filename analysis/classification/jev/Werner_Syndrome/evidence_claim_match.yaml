          rather than a subtype of classic Werner syndrome. Dominant LMNA and POLD1 variants are established
          causes within this residual clinical category.
        distinguishing_features:
        - Absence of biallelic pathogenic WRN variants argues against classic Werner syndrome.
        - LMNA- and POLD1-associated atypical presentations are generally dominant, unlike autosomal recessive
          WRN disease.
        - POLD1-related MDPL may include mandibular hypoplasia, deafness, progeroid features, and lipodystrophy.
        disease_term:
          preferred_term: atypical Werner syndrome
          term:
            id: MONDO:0019321
            label: atypical Werner syndrome
      selected_evidence:
        snippet: These patients were suspected to have WS on clinical grounds, but were found on subsequent
          analysis to lack WRN mutations.
