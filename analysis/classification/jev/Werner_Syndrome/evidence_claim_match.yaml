      assertion_type: Treatment
      assertion:
        name: Cancer Surveillance and Complication-Directed Management
        description: 'There is no curative or disease-modifying therapy. Management consists of treating
          manifestations, preventing secondary complications, and screening for the acquired diseases
          common in WS — in practice, surveillance weighted toward the six neoplasms that dominate the
          WS spectrum. Cancer treatment should be individualized with close hematologic and renal monitoring
          rather than a categorical, unsupported claim that every cytotoxic regimen requires modification.
          Creatinine-based kidney indices can be biased by small body size and sarcopenia, so BSA-uncorrected
          eGFR or cystatin-C estimates may be important for drug dosing.

          '
        treatment_term:
          preferred_term: supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: Patients should have a thorough clinical and laboratory work-up, keeping in mind their
          elevated risk for neoplasms.
        supports: SUPPORT
