      assertion_type: Treatment
      assertion:
        name: Genetic Counseling
        description: 'WS is autosomal recessive, so counseling of an affected proband''s family turns
          on sib recurrence risk and on the testing options that molecular confirmation unlocks. Because
          sibs of a proband are themselves at 25% risk and WS is diagnosed late, GeneReviews additionally
          recommends evaluating apparently asymptomatic older and younger sibs, so that surveillance and
          preventive measures start before manifestations accumulate.

          '
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: Evaluate apparently asymptomatic older and younger sibs of an affected individual in
          order to identify as early as possible those who would benefit from prompt initiation of treatment
          and preventive measures.
        supports: SUPPORT
