              id: MONDO:0010196
              label: Werner syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: WRN Molecular Genetic Testing
        description: 'Identification of biallelic WRN pathogenic variants establishes the diagnosis independently
          of the clinical criteria. This matters more than a confirmatory test usually does in WS, because
          the clinical criteria are conjunctive and late-completing: a proband who has not yet developed
          cataracts cannot meet them, while the genotype is available from birth. It is also what makes
          the atypical, non-WRN progeroid presentations separable from WS proper. Sequence analysis should
          be followed by deletion/duplication or genome-scale analysis when needed. Biallelic variants
          of uncertain significance, or one pathogenic/likely pathogenic variant plus a VUS, do not establish
          the diagnosis.

          '
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        markers: Biallelic WRN pathogenic variants
        results: Biallelic WRN pathogenic variants establish the diagnosis; identification in the proband
          also enables carrier testing of relatives and prenatal or preimplantation genetic testing. If
          a compelling phenotype yields only one pathogenic coding allele, targeted long-read or genome
          sequencing can detect deep-intronic and structural second alleles missed by routine analysis.
      selected_evidence:
        snippet: We identified a second pathogenic variant in eight of nine unsolved WS cases. In five
          cases, T-LRS identified intronic splice variants that were confirmed by either RT-PCR or exon
          trapping to affect splicing; in one case, T-LRS identified a 339 kbp deletion, and in two cases,
          pathogenic missense variants.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/1
      evidence_path: /diagnosis/1/evidence/3
      context_paths:
