      assertion_type: Genetic
      assertion:
        name: WRN
        gene_term:
          preferred_term: WRN
          term:
            id: hgnc:12791
            label: WRN
        association: Causative
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        notes: 'WRN (chromosome 8p12, 34 coding exons over 140 kb) encodes the 1,432-amino acid, 160 kDa
          WRN protein. It is the only gene in which mutations cause classical WS, and WS is the only disorder
          caused by WRN null mutations. Nearly 100 pathogenic variants have been reported; most are nonsense,
          small indel or splicing variants that truncate the protein and remove the C-terminal nuclear
          localization signal, and two exonuclease-domain missense variants (p.Lys125Asn, p.Lys135Glu)
          destabilize the protein and are functionally null. Two helicase-domain missense alleles (p.Gly574Arg,
          p.Arg637Trp) abolish or are predicted to abolish helicase activity and produce a phenotype indistinguishable
          from null, which is the human genetic evidence that helicase activity is the critical WRN function.

          '
      selected_evidence:
        snippet: The gene responsible for WS (known as WRN) was identified by positional cloning.
        supports: SUPPORT
