          of the French cohort argue that children with learning disabilities may benefit from next-generation
          sequencing rather than being excluded from testing. In one diagnostic laboratory, POGZ variants
          accounted for approximately 0.14% of clinical exomes referred for neurological indications;
          this is a referral yield, not a population prevalence estimate.
        presence: Positive in affected individuals
