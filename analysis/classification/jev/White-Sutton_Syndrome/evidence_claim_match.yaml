        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: whsus_extraneural_phenotype_mechanisms
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: By what organ-specific mechanisms does heterozygous POGZ dysfunction produce the recurrent
          extra-neurodevelopmental manifestations of White-Sutton syndrome - strabismus and refractive
          error, sensorineural hearing loss, obstructive sleep apnoea, the specific feeding, swallowing,
          bowel and vomiting symptoms, increased body weight, genitourinary and male genital anomalies,
          the craniofacial pattern, and congenital heart disease?
        attaches_to:
        - phenotypes#Strabismus
        - phenotypes#Refractive Error
        - phenotypes#Sensorineural Hearing Loss
        - phenotypes#Obstructive Sleep Apnea
        - phenotypes#Feeding Difficulties
        - phenotypes#Dysphagia
        - phenotypes#Constipation
        - phenotypes#Episodic Vomiting
        - phenotypes#Increased Body Weight
        - phenotypes#Genitourinary Anomalies
        - phenotypes#Male Genital Abnormalities
        - phenotypes#Broad Forehead
        - phenotypes#Midface Retrusion
        - phenotypes#Congenital Heart Disease
        rationale: 'These manifestations are clinically established, but no organ-specific mechanism has
          been demonstrated for any of them. The only mechanistic proposal in the clinical literature
          is a generic organogenesis-pleiotropy hypothesis - that POGZ''s roles in kinetochore assembly
          and mitotic chromosome segregation compromise the development of multiple organs - carried over
          from a congenital-diaphragmatic-hernia cohort, and the cardiac literature is explicit that the
          role of POGZ in heart development has not been functionally verified even though homozygous
          Q1038R mouse embryos show a ventricular septal defect (a state more severe than the human heterozygous
          condition). Deliberately, no causal edges are drawn to these phenotypes: wiring them to the
          neurodevelopmental chain would assert a substrate the literature does not support, and wiring
          them all directly to the variant node would restate the diagnosis rather than explain anything.
          The gastrointestinal umbrella phenotype is the one exception, carrying an edge anchored to the
          cohort authors'' explicit suggestion of POGZ involvement in intestinal-tract pathogenesis; its
          component symptoms remain listed here because their individual mediation (oromotor, dysmotility,
          central) is unresolved. An airway-hypotonia route to obstructive sleep apnoea was also considered,
          but the reviewed WHSUS sources document hypotonia and sleep apnoea without demonstrating that
          airway hypotonia mediates the obstruction. That route remains unwired pending syndrome-specific
          mechanistic evidence.'
        proposed_experiments:
        - experiment_id: whsus_extraneural_pogz_requirement
          name: Organ-specific Pogz requirement mapping outside the nervous system
          description: Map Pogz expression and the consequence of Pogz inactivation at disease-relevant
            heterozygous dosage in non-neural lineages - cardiac, craniofacial mesenchyme, gut, inner
            ear, eye, genitourinary - in mouse or comparable developmental systems, scoring organogenesis
            outcomes against the human anomaly spectrum.
          decision_criterion: Reproducible organ-intrinsic developmental defects at heterozygous dosage
            would substantiate the organogenesis-pleiotropy hypothesis for the corresponding human anomalies;
            their absence would redirect attention to secondary or functional explanations (for example
            oromotor dysfunction or airway hypotonia) for the non-anatomical manifestations.
      selected_evidence:
        snippet: The authors hypothesized that the pathogenesis of CDH in these subjects may be the pleiotropic
          effects of POGZ on the development of organs during embryogenesis due to its role in kinetochore
          assembly and mitotic chromosome segregation.
        supports: SUPPORT
