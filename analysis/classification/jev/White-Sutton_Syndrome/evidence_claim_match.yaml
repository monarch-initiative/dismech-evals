  c9bed0dd0659076c70d6d41e2b2a527c699a814640e73e0936f65e174d1d478a:
    claim:
      about:
        disease:
          name: White-Sutton Syndrome
          disease_term:
            preferred_term: White-Sutton syndrome
            term:
              id: MONDO:0014606
              label: intellectual disability-microcephaly-strabismus-behavioral abnormalities syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: whsus_excitability_reversibility
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the reversibility of social deficits by compensatory inhibition of elevated neuronal
          excitability in the Pogz mouse translate to any tractable intervention in humans with White-Sutton
          syndrome?
        attaches_to:
        - pathophysiology#Elevated Neuronal Excitability
        rationale: 'The mouse result is unusual and important: it shows that at least one behavioural
          consequence of a developmental chromatin-regulator lesion is not fixed at birth but depends
          on an ongoing, pharmacologically addressable circuit state. If that held in humans it would
          change the therapeutic framing of the disorder from purely supportive to potentially modifiable.
          But there are no human data at all - no measurement of cortical excitability in individuals
          with POGZ variants, and no trial of any excitability-reducing agent for the social or cognitive
          phenotype. The mismatch is mechanistically meaningful because the human phenotype includes established
          structural brain malformations that the excitability model does not address, so even a true
          excitability contribution would explain only part of the picture. It is further complicated
          by direct disagreement between the two published Pogz mouse models: the knock-in model shows
          social DEFICITS rescued by inhibiting excitability, whereas the brain-specific conditional knockout
          reports INCREASED sociability alongside a cerebellar Purkinje cell defect. Any translational
          claim must account for that contradiction rather than generalising from one model.'
        proposed_experiments:
        - experiment_id: whsus_human_excitability_measurement
          name: Cortical excitability measurement in POGZ variant carriers
          description: Use transcranial magnetic stimulation measures of cortical excitability and quantitative
            EEG in individuals with pathogenic POGZ variants versus matched neurodevelopmental controls.
          decision_criterion: Demonstrating elevated cortical excitability in humans would justify a trial
            of an excitability-reducing agent; normal excitability would confine the mouse finding to
            that model.
        - experiment_id: whsus_patient_ipsc_excitability
          experiment_design: TARGETED_PERTURBATION
          name: Excitability phenotyping and rescue in patient-derived neurons
          description: Extend the existing patient iPSC work to mature cortical neurons and test whether
            elevated excitability is present and whether the same compensatory inhibition used in the
            mouse normalises network activity.
          decision_criterion: Reproduction and rescue in human neurons would bridge the model-to-human
            gap without requiring a clinical trial first.
      selected_evidence:
        snippet: Importantly, social deficits can be treated by compensatory inhibition of elevated cell
          excitability in the mice.
        supports: SUPPORT
