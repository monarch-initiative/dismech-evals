        context: []
      assertion_type: Genetic
      assertion:
        name: POGZ
        gene_term:
          preferred_term: POGZ
          term:
            id: hgnc:18801
            label: POGZ
        association: Causal - heterozygous pathogenic variants
        relationship_type: CAUSATIVE
        presence: Positive
        notes: 'POGZ is at 1q21.3. Most pathogenic variants are heterozygous and de novo, and are nonsense,
          frameshift or splice alleles; missense variants also occur and are associated with milder phenotypes.
          The severity gradient does not follow a simple loss-of-function dosage model: truncating variants
          predicted to escape nonsense-mediated decay give the most severe phenotypes, and among those,
          variants in the proline-rich region are the most severe, suggesting a gain-of-function or dominant-negative
          contribution from a stable truncated protein. Familial transmission from a mildly affected heterozygous
          parent is documented, so both parents should be tested. Note that the two published Pogz mouse
          models disagree on the direction of the social phenotype; that is recorded in `discussions`.'
      selected_evidence:
        snippet: Here we report the clinical features of 22 individuals with 21 unique loss of function
          POGZ variants.
        supports: SUPPORT
