  69582ef6a815d725206ec2fd95a8263d3abe6d0759f5179a3fca81c1faeefac3:
    claim:
      about:
        disease:
          name: White-Sutton Syndrome
          disease_term:
            preferred_term: White-Sutton syndrome
            term:
              id: MONDO:0014606
              label: intellectual disability-microcephaly-strabismus-behavioral abnormalities syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Pathogenic POGZ Variant Dysfunction
        biological_scale: MOLECULAR
        description: 'Heterozygous nonsense, frameshift and splice variants, and a minority of missense
          variants, in POGZ reduce or alter the function of a multidomain nuclear protein. The genotype-phenotype
          relationship is not a simple dosage gradient: missense variants are associated with milder phenotypes,
          while truncating variants predicted to ESCAPE nonsense-mediated decay produce the most severe
          phenotypes, and within that group variants in the proline-rich region are the most severe of
          all. The authors infer that a gain-of-function or dominant-negative effect from a stable truncated
          protein may contribute to the severe end of the spectrum, but this allelic mechanism has not
          been demonstrated experimentally.'
        genes:
        - preferred_term: POGZ
          term:
            id: hgnc:18801
            label: POGZ
        molecular_functions:
        - preferred_term: chromatin binding
          term:
            id: GO:0003682
            label: chromatin binding
          modifier: ABNORMAL
        genetic_context:
          gene:
            preferred_term: POGZ
            term:
              id: hgnc:18801
              label: POGZ
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: De novo heterozygous POGZ alleles, the vast majority truncating. Recorded as LOSS_OF_FUNCTION
            (haploinsufficiency); a dominant-negative or gain-of-function contribution from truncated
            protein escaping nonsense-mediated decay has been raised but not established.
      selected_evidence:
        snippet: Missense variants were more often associated with mild phenotypes (p = 0.0421) and truncating
          variants predicted to escape NMD presented with more severe phenotypes (p < 0.0001). Within
          this group, variants in the prolin-rich region of the POGZ protein were associated with the
          most severe phenotypes (p = 0.0004).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35052493
      reference_title: Genotype-Phenotype Comparison in POGZ-Related Neurodevelopmental Disorders by Using
        Clinical Scoring.
      evidence_source: HUMAN_CLINICAL
      explanation: Provides the quantitative genotype-phenotype correlation underlying the non-simple-dosage
        claim in this node.
