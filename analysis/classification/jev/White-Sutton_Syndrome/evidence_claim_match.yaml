                id: GO:0021846
                label: cell proliferation in forebrain
              modifier: DECREASED
            - preferred_term: mitotic cell cycle
              term:
                id: GO:0000278
                label: mitotic cell cycle
              modifier: ABNORMAL
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Microcephaly
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: Reduced progenitor mitosis and premature differentiative exit limit the neuronal
          output of the developing brain, and the same Pogz-deficient mice have significantly lower brain
          weight. The mouse small-brain phenotype is explicitly related by the authors to human microcephaly,
          but the progenitor-to-head-size chain has not been traced step by step, so the edge carries
          unknown intermediates. Brain weight relative to body weight was higher in homozygous conditional
          knockouts, indicating a larger effect on body growth; reduced absolute brain weight therefore
          does not establish a brain-specific growth defect.
      selected_evidence:
        snippet: For example, the growth delay and small brain in mice may be related to the short stature
          and microcephaly seen in patients.
        supports: SUPPORT
        directness: INDIRECT
