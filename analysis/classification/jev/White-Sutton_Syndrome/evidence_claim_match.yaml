            name: Premature Cell-Cycle Exit in Cortical Progenitors
            biological_scale: CELLULAR
            description: In the embryonic (E15.5) cerebral cortex of Pogz-deficient mice the number of
              pHH3-positive mitotic cells is significantly reduced and the Tbr2-positive intermediate-progenitor
              layer is correspondingly expanded, while the Pax6-positive apical-progenitor layer is unchanged.
              The authors interpret this as accelerated exit from the cell cycle - a shift from symmetric
              proliferative to asymmetric differentiative division - which depletes the progenitor pool
              available to generate cortical neurons. The finding is mouse-only, so this node is curated
              at provisional confidence.
            mechanism_confidence: PROVISIONAL
            cell_types:
            - preferred_term: neural progenitor cell
              term:
                id: CL:0011020
                label: neural progenitor cell
