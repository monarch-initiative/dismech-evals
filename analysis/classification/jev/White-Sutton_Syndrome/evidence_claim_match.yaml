      assertion_type: Discussion
      assertion:
        discussion_id: whsus_allelic_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Do pathogenic POGZ alleles act uniformly through haploinsufficiency, or do stable NMD-escaping
          truncations produce additional dominant-negative or gain-of-function effects that explain their
          greater clinical severity?
        attaches_to:
        - pathophysiology#Pathogenic POGZ Variant Dysfunction
        rationale: Heterozygous loss-of-function variants establish reduced POGZ activity as a major disease
          mechanism, but the strongest genotype-phenotype study found greater severity for truncations
          predicted to escape NMD and explicitly proposed dominant-negative or gain-of-function effects.
          That proposal is an inference from variant position and clinical severity, not a direct demonstration
          of mutant-transcript stability, truncated-protein abundance or altered chromatin occupancy.
          Resolving the allelic mechanism is important for interpreting genotype-severity associations
          and for deciding whether simple restoration of POGZ dosage would address all pathogenic allele
          classes.
        proposed_experiments:
        - experiment_id: whsus_isogenic_allelic_mechanism
          experiment_design: TARGETED_PERTURBATION
          name: Isogenic comparison of NMD-triggering and NMD-escaping POGZ alleles
          description: Introduce representative NMD-triggering and NMD-escaping truncations into the same
            human iPSC background, differentiate them into neural progenitors and neurons, and compare
            allele-specific RNA, mutant-protein abundance, nuclear localisation, POGZ/HP1 chromatin occupancy,
            transcriptional output, neuronal differentiation and migration. Include correction of patient
            alleles and selective knockdown of the mutant transcript.
          decision_criterion: Phenotypes proportional to total functional POGZ dosage and rescued by wild-type
            restoration would support haploinsufficiency; effects unique to NMD-escaping alleles that
            improve after mutant-selective knockdown would support an additional dominant-negative or
            gain-of-function mechanism.
      selected_evidence:
        snippet: Our study suggests that gain-of-function or dominant negative effect through escaping
          NMD and the location of the variants in the prolin-rich domain of the protein may play an important
          role in the severity of manifestations of POGZ-associated neurodevelopmental disorders.
        supports: SUPPORT
    origin:
