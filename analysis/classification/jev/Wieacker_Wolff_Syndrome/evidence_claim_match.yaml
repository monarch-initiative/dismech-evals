            in the spectrum. Familial disease in affected males is usually associated with missense variants
            inherited from asymptomatic or variably affected heterozygous females.
      selected_evidence:
        snippet: Intellectual disability-developmental delay-contractures syndrome, formerly known as
          Wieacker-Wolff syndrome, is a severe X-linked recessive neurodevelopmental disorder characterized
          by severe contractures (arthrogryposis) and intellectual disability.
        supports: SUPPORT
