            term:
              id: MONDO:0025445
              label: Wieacker-Wolff syndrome (spectrum)
        context: []
      assertion_type: Inheritance
      assertion:
        name: X-linked inheritance
        description: 'ZC4H2 is on the X chromosome, so the entire spectrum is X-linked. The spectrum-level
          term is bound here rather than either specific mode, because the two MONDO children take different
          X-linked modes and asserting one of them at this level would assert it of the other: the classic
          MONDO:0010758 arm is X-linked recessive with mostly inherited missense alleles in affected males,
          and the MONDO:0026762 arm is female-restricted X-linked dominant with de novo loss-of-function
          alleles. Each mode is bound on its own has_subtypes row.'
        inheritance_term:
          preferred_term: X-linked inheritance
          term:
            id: HP:0001417
            label: X-linked inheritance
      selected_evidence:
        snippet: We identified disease-causing mutations in the zinc-finger gene ZC4H2 in four families
          affected by X-linked AMC plus ID and one family affected by cerebral palsy.
        supports: SUPPORT
    origin:
