        description: The classic MONDO:0010758 arm corresponds to OMIM:314580 and the Orphanet Wieacker-Wolff
          syndrome record. It is the historically described severe X-linked recessive neurodevelopmental
          disorder with congenital contractures or arthrogryposis and intellectual disability. Familial
          disease is reported predominantly in males and is commonly associated with inherited missense
          ZC4H2 variants.
        genes:
        - preferred_term: ZC4H2
          description: The gene of both arms of the spectrum, and the only gene this entry curates. MONDO
            records ZC4H2 (RO:0004003) for this arm; the variants reported in affected males are mostly
            inherited missense alleles.
