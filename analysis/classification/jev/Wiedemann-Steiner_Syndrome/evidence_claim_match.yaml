      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: centrosomal_branch
        hypothesis_label: Centrosomal microtubule-nucleation branch
        status: EMERGING
        description: 'Proposes that loss of a non-nuclear KMT2A/MLL-WDR5 function at centrosomes contributes
          to neurodevelopmental manifestations through impaired recruitment of Cep72 and gamma-tubulin
          ring-complex proteins. The cellular phenotype is reported in WSS-derived cells, but its contribution
          to individual clinical manifestations has not been quantified.

          '
      selected_evidence:
        snippet: Loss of the MLL/WDR5 complex affects microtubule nucleation and regrowth. MLL/WDR5 localize
          to the pericentriolar material and interact with centriolar satellite protein Cep72 and γ-tubulin
          ring complex proteins (γ-TuRCs).
        supports: SUPPORT
