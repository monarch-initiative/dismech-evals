          clinically suggestive cases. This assay measures DNA methylation, not histone H3K4 methylation.
          Independent evaluation found KMT2A-signature sensitivity dependent on classifier settings and
          affected by heterogeneous or intermediate profiles, so a negative result does not exclude WDSTS
          and the assay does not replace sequence-based diagnosis.

          '
