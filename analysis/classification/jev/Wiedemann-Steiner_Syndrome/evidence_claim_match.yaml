      assertion_type: Phenotype
      assertion:
        name: Hypogammaglobulinemia
        description: 'Reduced serum immunoglobulin concentrations are the central laboratory abnormality
          of the WDSTS immune phenotype and the basis of the IUIS listing. Reported individuals have shown
          panhypogammaglobulinemia, and a separate case report described congenital immunodeficiency with
          low immunoglobulins. Presentation can precede recognition of the syndromic features, so an early-onset
          CVID-like picture may be the presenting problem. The reported series are too small to support
          a frequency.

          '
        category: Immunological
        phenotype_term:
          preferred_term: Hypogammaglobulinemia
          term:
            id: HP:0004313
            label: Decreased circulating immunoglobulin concentration
      selected_evidence:
        snippet: Upon immunological evaluation, both patients II:2 and II:3 demonstrated panhypogammaglobulinemia,
          poor antibody responses to Pneumococcal polysaccharide vaccine, increased naive B cells, and
          very low memory B cells
        supports: SUPPORT
