            id: NCIT:C16723
            label: Immunology Test
        results: 'Hypogammaglobulinemia with impaired specific antibody responses and a reduced class-switched
          memory B-cell proportion is the expected pattern when the immune phenotype is present; normal
          results do not exclude WDSTS.

          '
