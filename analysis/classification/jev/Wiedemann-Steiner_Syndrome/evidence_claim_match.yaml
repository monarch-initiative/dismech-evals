        context:
        - path: /discussions/1
          value:
            discussion_id: wdts_episignature_interpretation
            kind: INTERPRETATION
            status: OPEN
            prompt: 'How should a negative or intermediate KMT2A blood DNA methylation episignature be
              interpreted when phenotype and sequence evidence suggest WDSTS?

              '
            attaches_to:
            - diagnosis#KMT2A DNA methylation episignature analysis
            rationale: 'The discovery study showed clinical utility for variant classification, but independent
              evaluation found KMT2A sensitivity ranging from 70% to 100% at best with unstable performance
              and heterogeneous methylation profiles. The assay is useful as supporting functional evidence,
              yet its negative predictive value and handling of intermediate profiles remain insufficiently
              standardized for exclusionary use.

              '
          role: ancestor
      assertion_type: Experiment
      assertion:
        experiment_id: wdts_locked_classifier_prospective_validation
        name: Prospective multi-site validation of a locked KMT2A episignature classifier
        description: 'Prospectively test a preregistered, locked classifier in sequence-defined pathogenic,
          benign, and uncertain KMT2A variants across laboratories, recording age, blood-cell composition,
          phenotype, and intermediate scores.

          '
        decision_criterion: 'Stable sensitivity, specificity, and inter-laboratory concordance with prespecified
          thresholds would justify standardized interpretation; persistent classifier- or site-dependent
          results would support retaining the assay as non-exclusionary adjunctive evidence.

          '
      selected_evidence:
        snippet: Remaining Cornelia de Lange syndrome, KMT2A, KDM5C and CHD7 signatures reached 70–100%
          sensitivity at best with unstable performances, suffering from heterogeneous methylation profiles
          among cases and rare discordant samples.
        supports: SUPPORT
