        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Terminal B-Cell Differentiation and Antibody Deficiency
        mechanism_confidence: PROVISIONAL
        biological_scale: CELLULAR
        description: 'The immunologic arm of WDSTS, and the reason IUIS lists KMT2A deficiency among the
          combined immunodeficiencies with syndromic features. Detailed immunophenotyping of a KMT2A-mutated
          kindred showed a block in terminal B-cell differentiation - relatively increased transitional
          and naive B cells with relatively decreased switched memory B cells - accompanied by reduced
          circulating follicular helper T cells, which are required for germinal-centre help. The result
          is panhypogammaglobulinemia with poor polysaccharide vaccine responses. Whether the B-cell block
          is B-cell intrinsic or secondary to the T-follicular-helper deficit is unresolved, and the observations
          rest on a small number of reported families.

          '
        cell_types:
        - preferred_term: class-switched memory B cell
          term:
            id: CL:0000972
            label: class switched memory B cell
        - preferred_term: circulating follicular helper T cell
          term:
            id: CL:0002038
            label: T follicular helper cell
        biological_processes:
        - preferred_term: B cell differentiation
          term:
            id: GO:0030183
            label: B cell differentiation
          modifier: DECREASED
        - preferred_term: immunoglobulin production
          term:
            id: GO:0002377
            label: immunoglobulin production
          modifier: DECREASED
      selected_evidence:
        snippet: the here-described WSS patients demonstrated a block in terminal B cell differentiation
          evidenced by a relative increase in transitional and naive B cells and a relative decrease in
          switched memory B cells
        supports: SUPPORT
