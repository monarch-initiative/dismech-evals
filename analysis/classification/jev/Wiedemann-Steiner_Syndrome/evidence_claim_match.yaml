            term:
              id: MONDO:0011518
              label: Wiedemann-Steiner syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: wdts_mouse_neuronal_model_fidelity
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: 'Do the dendritic-spine and H3K4/transcriptomic findings in constitutive Kmt2a-heterozygous
          adult male mice reproduce the mechanisms operating in developing human neurons with heterozygous
          pathogenic KMT2A variants?

          '
        attaches_to:
        - pathophysiology#Altered H3K4 Methylation and Transcriptional Regulation
        - pathophysiology#Reduced Dendritic Spine Density and Neuronal Dysregulation
        rationale: 'The mouse study provides the main experimental bridge from KMT2A dosage to dendritic
          morphology, but the molecular assays used adult amygdala tissue containing mixed neuronal and
          glial populations, only male mice were studied, and the constitutive genotype permits lifetime
          adaptation. Global H3K4me1-3 levels were not dramatically altered, and Kmt2a-heterozygous mice
          were normal in the two learning/memory assays used. The model therefore supports a locus-specific
          neuronal hypothesis, not a direct equivalence to human intellectual disability or a global histone-methylation-loss
          mechanism.

          '
        proposed_experiments:
        - experiment_id: wdts_isogenic_human_neuron_timecourse
          experiment_design: TARGETED_PERTURBATION
          name: Isogenic human KMT2A dosage series across neuronal development
          description: 'Generate patient-derived and CRISPR-engineered heterozygous KMT2A iPSC lines with
            matched corrected controls, differentiate them into defined excitatory and inhibitory neuronal
            lineages, and profile H3K4me states, chromatin accessibility, single-cell transcription, dendritic
            spines, and electrophysiology across developmental time points.

            '
          decision_criterion: 'A reproducible allele-dependent phenotype that is rescued by correction
            and converges across independent lines would support translation of the mouse neuronal branch;
            absence of such changes would argue that the mouse phenotype is model- or developmental-context-specific.

            '
      selected_evidence:
        snippet: First, we measured gene expression and H3K4me3 in adult brain tissues, a mixture of many
          neuron and glia types, which may mask potentially important molecular changes.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
