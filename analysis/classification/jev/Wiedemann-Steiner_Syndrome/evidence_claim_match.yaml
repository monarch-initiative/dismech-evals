      assertion_type: Phenotype
      assertion:
        name: Immune Dysfunction and Recurrent Infections
        description: 'Immune dysfunction and recurrent infections occur in some individuals with WDSTS,
          and are the reason KMT2A deficiency appears in the IUIS inborn errors of immunity classification.
          The dominant infectious pattern in the reported KMT2A kindreds is recurrent upper and lower
          respiratory tract infection from early childhood, sometimes progressing to bronchiectasis. GeneReviews
          recommends considering IVIG for low antibody levels and prophylactic antibiotics for frequent
          infections; neither the GeneReviews summary nor the reported case series supports a population
          frequency.

          '
        category: Immunological
        phenotype_term:
          preferred_term: Recurrent infections
          term:
            id: HP:0002719
            label: Recurrent infections
      selected_evidence:
        snippet: consideration of IVIG therapy in those with low antibody levels; consideration of prophylactic
          antibiotics in those with frequent infections
        supports: SUPPORT
