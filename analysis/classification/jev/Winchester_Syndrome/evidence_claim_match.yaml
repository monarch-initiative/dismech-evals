      assertion_type: Pathophysiology
      assertion:
        name: Impaired Osteogenic Commitment of Skeletal Stem Cells
        biological_scale: CELLULAR
        description: Skeletal stem cells use MT1-MMP to remodel their collagen niche, and the resulting
          change in cell shape activates beta1-integrin, RhoGTPase and YAP/TAZ signalling that commits
          them to the osteoblast lineage. Deleting Mmp14 in mesenchymal progenitors, but not in committed
          osteoblasts, diverts these cells towards adipocyte and chondrocyte fates and produces generalized
          osteopenia without a change in osteoclast number.
        cell_types:
        - preferred_term: skeletal stem cell
          term:
            id: CL:0000134
            label: mesenchymal stem cell
        biological_processes:
        - preferred_term: osteoblast differentiation
          term:
            id: GO:0001649
            label: osteoblast differentiation
          modifier: DECREASED
        - preferred_term: fat cell differentiation
          term:
            id: GO:0045444
            label: fat cell differentiation
          modifier: INCREASED
      selected_evidence:
        snippet: Here we demonstrate that conditional deletion of the membrane-anchored metalloproteinase
          MT1-MMP (Mmp14) in mesenchymal progenitors, but not in committed osteoblasts, redirects SSC
          fate decisions from osteogenesis to adipo- and chondrogenesis.
        supports: SUPPORT
