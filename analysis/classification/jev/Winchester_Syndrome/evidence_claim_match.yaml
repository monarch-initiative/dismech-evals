        context: []
      assertion_type: Genetic
      assertion:
        name: MMP14
        gene_term:
          preferred_term: MMP14
          term:
            id: hgnc:7160
            label: MMP14
        relationship_type: CAUSATIVE
        notes: 'MMP14 encodes membrane type-1 matrix metalloproteinase (MT1-MMP). Two homozygous missense
          alleles are reported: p.Thr17Arg in the signal peptide in the original family, and the hypomorphic
          p.Arg111His in the pro-domain in a milder family.'
        variants:
        - name: MMP14 p.(Thr17Arg)
          description: Homozygous signal-peptide missense variant in the original 1969 sisters, reported
            by the source as n.284C>G in codon 17 of exon 1 (NM_004995.2). It destabilises the protein
            and prevents its membrane localization, abolishing pro-MMP2 activation.
          clinical_significance: PATHOGENIC
        - name: MMP14 c.332G>A p.(Arg111His)
          description: Homozygous hypomorphic pro-domain variant in two Dutch brothers with a milder phenotype
            that did not appreciably worsen over follow-up. The protein is processed and reaches the cell
            membrane but has partially reduced proteolytic activity.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: Using cultured fibroblasts from the proband, we have now identified homozygous mutations
          in membrane type-1 metalloproteinase (MT1-MMP or MMP14).
        supports: SUPPORT
