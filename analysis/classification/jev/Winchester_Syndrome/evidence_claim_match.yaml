        biological_scale: TISSUE
        description: The carpal and tarsal "osteolysis" that defines the syndrome may reflect abnormal
          formation and modelling of these bones rather than excess resorption. Carpal and tarsal bones
          ossify from subarticular cartilage by a process distinct from growth-plate endochondral ossification,
          and osteoclast (TRAP) staining is notably absent there at the developmental stage relevant to
          the human disease. This reinterpretation rests on normal mouse developmental anatomy and has
          not been tested in MMP14-deficient carpal tissue.
        locations:
        - preferred_term: carpal bone
          term:
            id: UBERON:0001435
            label: carpal bone
        - preferred_term: tarsal bone
          term:
            id: UBERON:0001447
            label: tarsal bone
      selected_evidence:
        snippet: Thus, abnormal peri-articular skeletal development and modeling, rather than excessive
          bone resorption, may be the underlying pathophysiology of these skeletal syndromes.
        supports: SUPPORT
        directness: INDIRECT
