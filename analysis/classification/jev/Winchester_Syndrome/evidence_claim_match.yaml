      assertion:
        name: Defective Pericellular Collagen Remodeling
        biological_scale: CELLULAR
        description: MT1-MMP is the dominant pericellular collagenase of connective tissue cells. Without
          it, fibroblasts, chondrocytes, skeletal progenitors and osteocytes cannot cleave the type I
          collagen that surrounds them, so the matrix of developing bone, cartilage and soft connective
          tissue is not turned over. Reviews of the MMP14, MMP2 and SH3PXD2B disorders and their animal
          models identify defective collagen remodelling as the shared central lesion of the spectrum.
          Loss of osteocyte process formation in Mmp14-null bone has been attributed to the same failure
          of collagen cleavage.
        biological_processes:
        - preferred_term: collagen catabolic process
          term:
            id: GO:0030574
            label: collagen catabolic process
          modifier: DECREASED
        - preferred_term: extracellular matrix disassembly
          term:
            id: GO:0022617
            label: extracellular matrix disassembly
          modifier: DECREASED
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        - preferred_term: osteocyte
          term:
            id: CL:0000137
            label: osteocyte
      selected_evidence:
        snippet: Furthermore, they demonstrate that defective collagen remodeling is central in the underlying
          pathology.
        supports: SUPPORT
