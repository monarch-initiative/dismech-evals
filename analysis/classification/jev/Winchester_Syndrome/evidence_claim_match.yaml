    evidence_metadata:
      reference: PMID:22922033
      reference_title: Mutation of membrane type-1 metalloproteinase, MT1-MMP, causes the multicentric
        osteolysis and arthritis disease Winchester syndrome.
      evidence_source: IN_VITRO
      explanation: Patient fibroblasts carrying p.Thr17Arg lack active MT1-MMP at the cell surface, the
