  eaa58a8787cdc41b97dfbb02b9c96aaaec60bf0610f944e2b6f0f2b0d2270a95:
    claim:
      about:
        disease:
          name: Winchester Syndrome
          disease_term:
            preferred_term: Winchester syndrome
            term:
              id: MONDO:0010201
              label: Winchester syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MMP14 Loss of Function
        biological_scale: MOLECULAR
        description: Biallelic MMP14 missense variants reduce the amount or the activity of MT1-MMP at
          the cell surface. The signal-peptide variant p.Thr17Arg impairs processing of the nascent protein,
          so it is rapidly degraded and almost no active enzyme reaches the plasma membrane. The milder
          pro-domain variant p.Arg111His is processed and trafficked normally but has reduced proteolytic
          activity, and the milder phenotype it produces suggests that residual catalytic activity sets
          disease severity.
        genes:
        - preferred_term: MMP14
          term:
            id: hgnc:7160
            label: MMP14
        molecular_functions:
        - preferred_term: metalloendopeptidase activity
          term:
            id: GO:0004222
            label: metalloendopeptidase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: protein localization to plasma membrane
          term:
            id: GO:0072659
            label: protein localization to plasma membrane
          modifier: DECREASED
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Winchester fibroblasts had almost no detectable levels of active MT1-MMP either in the
          membrane fraction (Figure 2B) or on their surface (Figure 2C).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
