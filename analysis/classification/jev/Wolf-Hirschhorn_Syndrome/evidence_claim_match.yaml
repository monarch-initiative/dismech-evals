        name: Dravet syndrome
        disease_term:
          preferred_term: Dravet syndrome
          term:
            id: MONDO:0100135
            label: Dravet syndrome
        description: WHS epilepsy can resemble Dravet syndrome through infantile onset, fever-associated
          prolonged clonic or tonic-clonic seizures, atypical absences, and later developmental impairment.
          Children with subtle WHS dysmorphism may initially undergo SCN1A testing. Chromosomal microarray
          showing distal 4p deletion favors WHS, whereas a pathogenic SCN1A variant without the WHS deletion
          supports Dravet syndrome.
        distinguishing_features:
        - The characteristic WHS facial gestalt, congenital anomalies, and distal 4p deletion favor Wolf-Hirschhorn
          syndrome.
        - A pathogenic SCN1A variant in the appropriate electroclinical setting favors Dravet syndrome.
      selected_evidence:
        snippet: Individuals with WHS display a distinctive electroclinical pattern resembling the severe
          myoclonic epilepsy of infancy or Dravet syndrome.
        supports: SUPPORT
