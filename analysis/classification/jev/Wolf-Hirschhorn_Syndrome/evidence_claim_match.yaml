      assertion:
        name: Predominantly sporadic 4p deletion
        inheritance_term:
          preferred_term: Sporadic
          term:
            id: HP:0003745
            label: Sporadic
        description: WHS is usually sporadic. About 50%-60% of affected individuals have a de novo pure
          4p deletion, while about 40%-45% have an unbalanced translocation that may be de novo or inherited
          from a parent carrying a balanced rearrangement in the historical GeneReviews summary; cohort
          proportions vary with ascertainment. Ring chromosome 4 and other complex rearrangements account
          for the remainder.
      selected_evidence:
        snippet: About 50%-60% of individuals with WHS have a de novo pure deletion of 4p16 and about
          40%-45% have an unbalanced translocation with both a deletion of 4p and a partial trisomy of
          a different chromosome arm.
        supports: SUPPORT
