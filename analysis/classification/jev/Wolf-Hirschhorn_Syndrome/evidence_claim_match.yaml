      assertion:
        name: Rearrangement-dependent recurrence risk
        description: Recurrence risk cannot be assigned from the WHS diagnosis alone. It is low after
          a confirmed de novo deletion but can be substantially higher when an unbalanced 4p deletion
          is inherited from a parent with a balanced rearrangement. Parental chromosome studies therefore
          determine counseling and prenatal-testing options.
      selected_evidence:
        snippet: Risks to family members depend on the mechanism of origin of the deletion.
        supports: SUPPORT
