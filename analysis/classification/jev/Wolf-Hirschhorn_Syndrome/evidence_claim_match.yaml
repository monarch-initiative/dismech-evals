        description: 'LETM1 lies in WHSCR-2 and encodes an inner-mitochondrial-membrane protein that catalyses
          K+/H+ exchange and Ca2+/H+ antiport, and controls mitochondrial volume, membrane potential and
          OXPHOS protein integrity. Hemizygous loss in WHS halves LETM1 dosage, producing impaired mitochondrial
          K+ efflux and perturbed Ca2+ handling. Heterozygous mouse and knockdown-rat models show increased
          chemically induced seizure susceptibility. LETM1 has long been treated as a major candidate
          gene for WHS-associated seizures. Human deletion mapping shows seizures both when LETM1 is spared
          and absent seizures when it is deleted, indicating that LETM1 haploinsufficiency is neither
          necessary nor sufficient.

          '
