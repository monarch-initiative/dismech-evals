        description: Whsc1-deficient mice model one deleted gene rather than the full human 4p contiguous
          deletion. They show growth retardation and WHS-like midline and cardiovascular defects, with
          genetic interaction between Whsc1 and Nkx2-5. A complementary cochlear study found disorganized
          hair cells and abnormal stereocilia bundles, supporting an NSD2-dependent sensorineural-hearing
          mechanism. The single-gene model cannot assign the remaining human deletion phenotypes.
        associated_phenotypes:
