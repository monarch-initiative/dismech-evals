              label: Wolf-Hirschhorn syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Telomeric 4p Seizure-Susceptibility Region Haploinsufficiency
        description: 'High-resolution chromosomal microarray mapping (n=48) proposed an independent seizure-susceptibility
          region to a ~197 kb interval starting ~368 kb from the 4p telomere, distal to LETM1 and containing
          PIGG, ZNF721 and the pseudogene ABCA11P. Patients with interstitial deletions whose distal breakpoint
          preserves the terminal 751 kb (and thus this region) lacked seizures in the mapped cohort, while
          deletion of the interval tracked with seizures in that cohort. This is evidence for susceptibility,
          not proof of a universally deterministic interval.

          '
        genes:
        - preferred_term: PIGG
          term:
            id: hgnc:25985
            label: PIGG
      selected_evidence:
        snippet: We identify a small terminal region of chromosome 4p that represents a seizure susceptibility
          region. Deletion of this region in the context of WHS is sufficient for seizure occurrence.
        supports: SUPPORT
