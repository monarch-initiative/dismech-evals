            description: 'Most of the WHS-affected midline structures (Greek-warrior-helmet facies, palatal
              clefts, cardiac outflow tract, mandibular and auricular cartilage, dental papilla) derive
              from cranial neural crest cells. Multiple WHS-region genes (NSD2/WHSC1, LETM1, TACC3, FGFR3)
              are enriched in migratory neural crest, and their combined haploinsufficiency is proposed
              to perturb neural crest cell motility, epithelial-to-mesenchymal transition (via NSD2-Twist
              regulation) and chemotactic responses to FGF8 (via FGFR1/3). This proposed mechanism could
              reduce delivery and patterning of neural crest derivatives at the face, ear, jaw and conotruncal
              heart.

