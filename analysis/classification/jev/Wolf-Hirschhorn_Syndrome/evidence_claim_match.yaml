            term:
              id: MONDO:0008684
              label: Wolf-Hirschhorn syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_whs_human_model_translation
        prompt: How faithfully do current NSD2 developmental models and LETM1 seizure-susceptibility models
          represent a human heterozygous multigene 4p deletion?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired H3K36 Dimethylation and Developmental Gene Mis-regulation
        - pathophysiology#LETM1 Haploinsufficiency and Mitochondrial Ion Dyshomeostasis
        - pathophysiology#Candidate FGFR3-Dependent Neural-Crest Signaling Defect
        - pathophysiology#Humoral Antibody Deficiency
        rationale: Existing models establish important NSD2- and LETM1-dependent biology but perturb one
          gene; some use homozygous deficiency, transient knockdown, or pharmacologically triggered seizures.
          They cannot by themselves validate the human effects of heterozygous dosage loss across multiple
          neighboring genes or interactions with unbalanced-translocation trisomic material.
        proposed_experiments:
        - experiment_id: exp_whs_model_benchmark
          name: Cross-model benchmark against deletion-resolved human cells
          description: Compare matched molecular and developmental readouts across nested-deletion human
            iPSC lineages, stable heterozygous Nsd2 mouse cells, and stable heterozygous zebrafish mutants.
            In a parallel neuronal/seizure arm, compare human deletion-derived neurons with heterozygous
            Letm1 mice and lentiviral-mediated Letm1-knockdown rats at baseline and under matched kainic-acid
            or pilocarpine challenge. Separate conserved single-gene effects from phenotypes that require
            additional 4p dosage loss.
          decision_criterion: Translational conservation requires concordant lineage-specific NSD2 signatures
            across heterozygous human and animal models and concordant LETM1-related neuronal or seizure-threshold
            effects across human cells, heterozygous mice, and rat knockdown. Effects confined to homozygous,
            morpholino, knockdown, or provoked-seizure conditions would limit their relevance to human
            WHS haploinsufficiency.
      selected_evidence:
        snippet: New animal models will also be developed to further our understanding of the effects
          of hemizygosity as well as to serve as models for treatment development.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26239400
      reference_title: 'Wolf-Hirschhorn syndrome: A review and update.'
      evidence_source: OTHER
      explanation: The review explicitly calls for models that address hemizygosity and treatment translation.
