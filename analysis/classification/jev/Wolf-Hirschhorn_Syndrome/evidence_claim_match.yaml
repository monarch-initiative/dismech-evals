        context:
        - path: /pathophysiology/0
          value:
            name: 4p16.3 Contiguous Gene Deletion
            description: 'Wolf-Hirschhorn syndrome is a contiguous gene deletion disorder caused by hemizygous
              loss of distal chromosome 4 (4p16.3). Two adjacent "critical regions" lie ~1.8-2.0 Mb from
              the 4p telomere: WHSCR (a ~165 kb interval encompassing parts of WHSC1/NSD2 and WHSC2/NELFA)
              and WHSCR-2 (a ~300-600 kb interval that includes the 5'' end of WHSC1/NSD2 and all of LETM1).
              A separate ~197 kb terminal seizure susceptibility region (containing PIGG, ZNF721 and ABCA11P)
              lies ~368 kb from the 4p telomere. Phenotypic severity scales broadly with deletion size,
              but individual features track more tightly with which dosage-sensitive genes are removed.

              '
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Hepatic Neoplasia
        description: Rare reported hepatic neoplasms may be associated with the distal 4p deletion, but
          penetrance and gene attribution are unresolved.
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
      selected_evidence:
        snippet: We propose that, in the context of the rarity of WHS, these seven cases suggest that
          hepatocellular neoplasia may be a feature of WHS.
        supports: SUPPORT
