        prompt: Which distal 4p genes and gene combinations are necessary for each major WHS phenotype,
          and how do deletion size, breakpoint, and additional duplicated material alter penetrance?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#4p16.3 Contiguous Gene Deletion
        - pathophysiology#NSD2 (WHSC1) Haploinsufficiency
        - pathophysiology#Telomeric 4p Seizure-Susceptibility Region Haploinsufficiency
        - pathophysiology#Candidate Multigene Neuronal-Communication Dysfunction
        rationale: Human deletion mapping supports a multigene syndrome and identifies candidate intervals,
          but most individual-gene assignments remain correlational or extrapolated. Resolving this gap
          is necessary for genotype-specific prognosis and for distinguishing causal drivers from passengers
          in differently sized deletions.
        proposed_experiments:
        - experiment_id: exp_whs_isogenic_4p_dosage_series
          experiment_design: TARGETED_PERTURBATION
          name: Isogenic distal-4p deletion and gene-restoration series
          description: Engineer matched human iPSC lines carrying nested heterozygous distal-4p deletions,
            then restore NSD2, LETM1, PIGG, or defined gene combinations. Differentiate cortical, neural-crest,
            cardiac, renal, and cochlear lineages and compare chromatin, mitochondrial, electrophysiologic,
            migration, and morphogenesis readouts.
          decision_criterion: Reproducible rescue by one restored gene would assign that dosage component
            to the affected lineage; rescue only after defined multigene restoration would support a synergistic
            contiguous-deletion mechanism.
      selected_evidence:
        snippet: our focus will continue to be on the establishment of robust genotype-phenotype correlations
          and the penetrance of these phenotypes.
        supports: SUPPORT
