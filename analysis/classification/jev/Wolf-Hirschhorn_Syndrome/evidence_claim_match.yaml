  418f1836f8ee8d88bb2bfe8c3c2db0654b6ae803de7cb02622d2789a1bef4da5:
    claim:
      about:
        disease:
          name: Wolf-Hirschhorn_Syndrome
          disease_term:
            preferred_term: Wolf-Hirschhorn syndrome
            term:
              id: MONDO:0008684
              label: Wolf-Hirschhorn syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: 4p16.3 Contiguous Gene Deletion
        description: 'Wolf-Hirschhorn syndrome is a contiguous gene deletion disorder caused by hemizygous
          loss of distal chromosome 4 (4p16.3). Two adjacent "critical regions" lie ~1.8-2.0 Mb from the
          4p telomere: WHSCR (a ~165 kb interval encompassing parts of WHSC1/NSD2 and WHSC2/NELFA) and
          WHSCR-2 (a ~300-600 kb interval that includes the 5'' end of WHSC1/NSD2 and all of LETM1). A
          separate ~197 kb terminal seizure susceptibility region (containing PIGG, ZNF721 and ABCA11P)
          lies ~368 kb from the 4p telomere. Phenotypic severity scales broadly with deletion size, but
          individual features track more tightly with which dosage-sensitive genes are removed.

          '
      selected_evidence:
        snippet: The syndrome is caused by deletion of a critical region (Wolf-Hirschhorn Syndrome Critical
          region-WHSCR) on chromosome 4p16.3.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
