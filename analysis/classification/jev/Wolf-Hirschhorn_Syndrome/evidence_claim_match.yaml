            term:
              id: MONDO:0008684
              label: Wolf-Hirschhorn syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cranial Neural Crest Cell Migration Defect
        description: 'Most of the WHS-affected midline structures (Greek-warrior-helmet facies, palatal
          clefts, cardiac outflow tract, mandibular and auricular cartilage, dental papilla) derive from
          cranial neural crest cells. Multiple WHS-region genes (NSD2/WHSC1, LETM1, TACC3, FGFR3) are
          enriched in migratory neural crest, and their combined haploinsufficiency is proposed to perturb
          neural crest cell motility, epithelial-to-mesenchymal transition (via NSD2-Twist regulation)
          and chemotactic responses to FGF8 (via FGFR1/3). This proposed mechanism could reduce delivery
          and patterning of neural crest derivatives at the face, ear, jaw and conotruncal heart.

          '
        cell_types:
        - preferred_term: migratory neural crest cell
          term:
            id: CL:0000333
            label: migratory neural crest cell
        - preferred_term: migratory cardiac neural crest cell
          term:
            id: CL:2000073
            label: migratory cardiac neural crest cell
        locations:
        - preferred_term: cranial neural crest
          term:
            id: UBERON:0003099
            label: cranial neural crest
        - preferred_term: embryonic head
          term:
            id: UBERON:0008816
            label: embryonic head
        biological_processes:
        - preferred_term: neural crest cell migration
          term:
            id: GO:0001755
            label: neural crest cell migration
          modifier: DECREASED
      selected_evidence:
        snippet: the formation of structures of the face and jaw, as well as certain glial cell populations
          in the brain, depend on neural crest cell migration
        supports: SUPPORT
    origin:
