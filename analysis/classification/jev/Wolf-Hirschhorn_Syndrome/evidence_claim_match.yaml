          value:
            name: Telomeric 4p Seizure-Susceptibility Region Haploinsufficiency
            description: 'High-resolution chromosomal microarray mapping (n=48) proposed an independent
              seizure-susceptibility region to a ~197 kb interval starting ~368 kb from the 4p telomere,
              distal to LETM1 and containing PIGG, ZNF721 and the pseudogene ABCA11P. Patients with interstitial
              deletions whose distal breakpoint preserves the terminal 751 kb (and thus this region) lacked
              seizures in the mapped cohort, while deletion of the interval tracked with seizures in that
              cohort. This is evidence for susceptibility, not proof of a universally deterministic interval.

              '
            genes:
            - preferred_term: PIGG
              term:
                id: hgnc:25985
                label: PIGG
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Seizures
        description: Deletion of the mapped distal interval was associated with seizures in the high-resolution
          mapping cohort.
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
      selected_evidence:
        snippet: The deletion of this region correlates strongly with the presence of seizures, and its
          preservation, as in cases of the interstitial WHS deletions we described, correlates with the
          absence of seizures.
        supports: SUPPORT
