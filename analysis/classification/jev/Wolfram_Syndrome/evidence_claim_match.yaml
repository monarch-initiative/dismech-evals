      assertion_type: Pathophysiology
      assertion:
        name: Unrestrained ER Stress Signaling Through ATF6-alpha
        biological_scale: MOLECULAR
        subtypes:
        - WS1
        description: Wolframin's mechanism of restraint is specific and now well defined. It stabilizes
          the E3 ubiquitin ligase HRD1, brings the transcription factor ATF6-alpha to the proteasome,
          and enhances its ubiquitination and degradation. Without wolframin, ATF6-alpha accumulates,
          its target genes are derepressed, and the endoplasmic reticulum stress response element promoter
          is activated. Patient lymphocytes show the same dysregulation, with ATF6-alpha up and HRD1 down.
          A chronically engaged unfolded protein response is not a louder version of a normal signal;
          it is an alarm that never stops, and the building is eventually evacuated for good.
        biological_processes:
