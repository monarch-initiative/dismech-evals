      assertion_type: Treatment
      assertion:
        name: Dantrolene Sodium
        description: 'A ryanodine-receptor blocker trialed on the endoplasmic-reticulum-calcium stabilizer
          rationale, and the first clinical trial ever conducted in Wolfram syndrome. It was safe and
