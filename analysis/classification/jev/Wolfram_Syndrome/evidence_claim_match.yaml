      assertion_type: Biochemical
      assertion:
        name: Elevated Serum Neurofilament Light Chain
        presence: INCREASED
        context: Serum neurofilament light chain, a marker of neuroaxonal damage, is elevated in Wolfram
          syndrome relative to parents, unaffected siblings, and individuals with and without newly diagnosed
          type 1 diabetes, whereas glial fibrillary acidic protein is not. The specificity is informative
          about the biology, since it points to axonal injury rather than reactive astrogliosis. Its utility
          as a progression marker is limited, however, because levels did not change over time and did
          not correlate reliably with clinical or neuroimaging severity.
      selected_evidence:
        snippet: NfL levels were higher in the Wolfram group relative to all control groups (p < 0.001,
          η p 2  = 0.51) after adjusting for age and sex, whereas GFAP levels were not different between
          any of the groups.
        supports: SUPPORT
