      assertion_type: Discussion
      assertion:
        discussion_id: wfs_neurodevelopment_vs_neurodegeneration
        kind: OPEN_QUESTION
        prompt: How much of the brain deficit in Wolfram syndrome is failed development rather than degeneration,
          and what does that imply for when a disease-modifying therapy must start?
        attaches_to:
        - pathophysiology#Brainstem and Cerebellar Volume Loss
        rationale: Longitudinal morphometry shows both stalled white-matter growth and frank degeneration,
          and abnormalities are present in the youngest and mildest patients. If a meaningful share of
          the deficit is growth that never happened, then a neuroprotective therapy started after symptoms
          appear can at best halt decline and can never recover what was not built, which moves the therapeutic
          window earlier than a purely degenerative model implies. The relative contribution of the two
          processes has not been quantified.
      selected_evidence:
        snippet: These patterns suggest that there may be early, stalled white matter development in Wolfram
          syndrome, with additional degenerative processes in both white and gray matter.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
