          term:
            id: GO:0005789
            label: endoplasmic reticulum membrane
      selected_evidence:
        snippet: Mutations in a novel gene (WFS1) encoding a putative transmembrane protein were found
          in all affected individuals in six WFS families, and these mutations were associated with the
          disease phenotype.
        supports: SUPPORT
