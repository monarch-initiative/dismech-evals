  2142c66a0ab9da52ec8269f3d974b375cfb743bffddaea2f3b606c8c6be0e81b:
    claim:
      about:
        disease:
          name: Wolfram Syndrome
          disease_term:
            preferred_term: Wolfram Syndrome
            term:
              id: MONDO:0018105
              label: Wolfram syndrome
        context:
        - path: /treatments/5
          value:
            name: Sodium Phenylbutyrate and Taurursodiol
            description: 'An oral combination of a chemical chaperone and an endoplasmic-reticulum-stress
              and apoptosis modulator, acting on the pathway wolframin normally regulates. The HELIOS
              trial reported improved or stabilized pancreatic function, vision, and symptom burden at
              24 and 48 weeks: stimulated C-peptide (the primary endpoint) and the glycemic secondary
              endpoints improved from baseline, visual acuity trended toward stabilization, and every
              assessable participant was a responder on both global-impression scales. Tolerability was
              acceptable — adverse events in eleven of twelve participants, all mild or moderate and mostly
              gastrointestinal, with dose interruption or reduction in three each but no discontinuations,
              serious events, or deaths. The design ceiling has to travel with the result: single-center,
              single-arm, open-label, twelve participants, no placebo. Graded PARTIAL for that reason,
              and the objective endpoints are curated separately from the unblinded global-impression
              scales because the latter are the ones open-label expectancy most easily inflates.'
            therapeutic_modality: SMALL_MOLECULE
            treatment_term:
              preferred_term: Pharmacotherapy
              term:
                id: NCIT:C15986
                label: Pharmacotherapy
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Beta Cell Apoptosis
        treatment_effect: INHIBITS
        description: 'The stated purpose of acting on the ER and mitochondrial pathways is to reduce pancreatic
          beta cell death. INHIBITS is used here, unlike the two upstream nodes, because the trial''s
          primary endpoint is a direct functional readout of surviving beta cell mass — stimulated C-peptide
          — and it improved from baseline at both 24 and 48 weeks. The uncontrolled design still means
          this is a within-participant change, not a demonstrated causal effect. One caveat belongs on
          the direction itself: reduced apoptosis predicts arrested decline, whereas C-peptide *improving*
          from baseline is at least as consistent with recovered secretory function in beta cells that
          were still alive. The INHIBITS direction therefore rests on the drug''s stated mechanism, which
          names cell death explicitly, with the C-peptide result as functional corroboration rather than
          as a measurement of apoptosis.'
      selected_evidence:
        snippet: An investigational oral combination of sodium phenylbutyrate and taurursodiol (PB&TURSO)
          targets dysfunctional ER and mitochondrial pathways to reduce pancreatic β cell and neuronal
          death
        supports: SUPPORT
