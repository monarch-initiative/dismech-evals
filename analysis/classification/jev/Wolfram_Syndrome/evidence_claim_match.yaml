              label: Wolfram syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: WS2
        display_name: Wolfram syndrome 2 (CISD2-related)
        subtype_term:
          preferred_term: Wolfram syndrome 2
          term:
            id: MONDO:0011502
            label: Wolfram syndrome 2
        description: A rarer form caused by biallelic variants in CISD2, which encodes ERIS, a small protein
          of the mitochondria-associated endoplasmic reticulum membrane. ERIS localizes to the same organelle
          as wolframin but does not interact with it directly, so the two genes converge on the same compartment
          by separate routes. Clinically WS2 typically lacks diabetes insipidus and adds upper intestinal
          ulceration and a bleeding tendency.
        genes:
        - preferred_term: CISD2
          term:
            id: hgnc:24212
            label: CISD2
      selected_evidence:
        snippet: Additionally, a second gene, CISD2, located on chromosome 4q22, has been identified in
          individuals with WFS type 2 (WFS2), which leads to early onset optic atrophy, diabetes mellitus,
          deafness, bleeding tendency and upper intestinal ulcers, a shortened lifespan, but notably not
          diabetes insipidus.
        supports: SUPPORT
