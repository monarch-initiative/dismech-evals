          models. In the largest human evaluation, 30 of 84 registry participants had received a GLP-1
          receptor agonist, but paired retrospective analyses found no glycemic or visual benefit over
          one to two years and gastrointestinal adverse effects were common. The uncontrolled, clinically
          selected sample makes that result preliminary rather than a definitive efficacy test.
