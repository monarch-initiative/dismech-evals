        prompt: Can serum neurofilament light chain serve as a treatment-response marker in Wolfram syndrome,
          given that it is elevated but does not track progression?
        attaches_to:
        - biochemical#Elevated Serum Neurofilament Light Chain
        rationale: Neurofilament light chain is clearly elevated and glial fibrillary acidic protein is
          not, which is a clean biological signal about axonal injury. But within the Wolfram group it
          did not change over time and did not correlate with clinical severity or neuroimaging measures,
          so it fails as a monitoring biomarker on the evidence available. Whether it moves under an effective
          therapy is a different question and remains untested, and the field needs a progression marker
          badly because every trial so far has had to rely on slow clinical endpoints.
      selected_evidence:
        snippet: Future studies may be warranted to determine if NfL could be a treatment-response marker
          in Wolfram syndrome clinical trials.
        supports: SUPPORT
