      assertion_type: Discussion
      assertion:
        discussion_id: wfs_genotype_phenotype_tension
        kind: CONTROVERSY
        prompt: Are there established genotype-phenotype correlations in Wolfram syndrome, or only emerging
          ones?
        attaches_to:
        - genetic#WFS1 Biallelic Loss of Function
        rationale: GeneReviews takes the conservative position that no correlations are established, and
          that remains defensible. A meta-analysis of 412 published patients reported genotypic-class
          correlations, and a 2026 registry analysis found a six-level WFS1 severity score informative
          for diabetes onset and more modestly for optic atrophy, but not for hearing loss or central
          diabetes insipidus. The newer analysis lacked time-to-event censoring and derived its three-tier
          simplification in the same dataset, so the score is a research instrument rather than a validated
          individual prognostic test.
      selected_evidence:
        snippet: New genotype-phenotype correlations were established, disease progression rate for the
          general population and for the genotypic classes has been calculated, and new diagnostic criteria
          have been proposed.
        supports: SUPPORT
