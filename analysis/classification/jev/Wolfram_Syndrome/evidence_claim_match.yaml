  ad316f4416ad43a5156ae541331216cb7fc6d73ae6b99ea112e6eda929f89384:
    claim:
      about:
        disease:
          name: Wolfram Syndrome
          disease_term:
            preferred_term: Wolfram Syndrome
            term:
              id: MONDO:0018105
              label: Wolfram syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: wfs_cisd2_treatment_generalization
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does the PB&TURSO result in WFS1-related Wolfram syndrome generalize to the CISD2-related
          subtype, which this entry models as reaching the same organelle-contact and calcium-transfer
          compartment by an independent route?
        attaches_to:
        - pathophysiology#Loss of CISD2 at Organelle Contact Membranes
        - pathophysiology#ER-Mitochondria Contact and Calcium Transfer Dysregulation
        - pathophysiology#Mitochondrial Dysfunction
        rationale: 'The HELIOS trial restricted enrollment to WFS1 Wolfram syndrome deliberately, to reduce
          heterogeneity, and the authors state that CISD2 Wolfram syndrome shares similar pathophysiology
          and may benefit. That is a hypothesis, not a result: no CISD2 participant was treated. The question
          matters here more than it would in most entries, because this entry already models CISD2 as
          an independent route into the shared ER-mitochondria contact compartment rather than as a WFS1
          phenocopy — so convergence at that node is exactly the premise the generalization rests on,
          and exactly what an untested extrapolation would be assuming. Note also that the two subtypes
          diverge clinically (CISD2 disease notably lacks diabetes insipidus and adds bleeding tendency),
          so shared upstream mechanism does not by itself predict a shared treatment response profile
          across endpoints.

          The contact-site direction sharpens this further, and cuts against a simple read-across. WFS1-null
          patient fibroblasts show *reduced* ER-mitochondria interactions and calcium exchange; a CISD2
          missense variant causing classical Wolfram phenotype instead shows *increased* ER-mitochondria
          contact with a hyperfused mitochondrial network and no overt ER stress, while complete CISD2
          loss in human cortical neurons shows loss of contact sites again. So the direction of the contact-site
          abnormality is not uniform even within CISD2, let alone shared with WFS1 — which is exactly
          why this entry models the convergence node as direction-neutral dysregulation. A chemical chaperone
          and ER-stress modulator tuned to the WFS1 arm has no guaranteed effect on a lesion that perturbs
          the same compartment in the opposite direction, and the CISD2 missense finding explicitly reports
          the absence of overt ER stress that PB&TURSO is meant to relieve.'
        proposed_experiments:
        - experiment_id: exp_wfs_cisd2_pbturso_response
          name: PB&TURSO response in CISD2-related Wolfram syndrome
          description: Extend an open-label PB&TURSO cohort to genetically confirmed CISD2 Wolfram syndrome
            with residual beta cell function, using the same stimulated C-peptide primary endpoint, and
            compare the response trajectory against the WFS1 cohort. Given the rarity, an n-of-1 series
            with pre-treatment natural-history run-in is more realistic than a parallel-group design.
          decision_criterion: Whether a stimulated C-peptide response in CISD2 participants falls within
            the range observed in the WFS1 cohort discriminates convergence at the shared contact-site
            node from a WFS1-specific chaperone effect.
          supporting_outcome:
          - A comparable stimulated C-peptide and glycemic response in CISD2 participants, supporting
            the shared-compartment premise and licensing subtype-agnostic treatment claims.
          refuting_outcome:
          - Absent or markedly attenuated response in CISD2 participants, which would indicate the benefit
            depends on something specific to wolframin loss rather than on the shared ER-mitochondria
            contact defect.
        notes: 'Recorded as a gap, not as a treatment claim: PB&TURSO is deliberately not curated onto
          the CISD2 subtype anywhere in this entry, and should not be until a CISD2 participant has actually
          been treated.'
      selected_evidence:
        snippet: The trial focused on WFS1 WS to reduce heterogeneity, though CISD2 WS shares similar
          pathophysiology and may benefit.
        supports: SUPPORT
