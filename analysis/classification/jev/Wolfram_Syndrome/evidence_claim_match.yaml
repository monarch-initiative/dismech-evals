      assertion_type: Diagnosis
      assertion:
        name: Clinical Diagnostic Criteria
        description: 'Insulin-requiring diabetes mellitus plus optic atrophy, both with onset before age
          16 and no alternative explanation, is the operative clinical rule. The diabetes workup is what
          separates this from type 1 diabetes: islet autoantibodies are negative, there is no HLA-DR3
          or DR4 risk association, and C-peptide is preserved longer.'
      selected_evidence:
        snippet: Juvenile-onset diabetes mellitus and optic atrophy are the best available diagnostic
          criteria for Wolfram syndrome, the differential diagnosis of which includes other causes of
          neurodegeneration.
        supports: SUPPORT
