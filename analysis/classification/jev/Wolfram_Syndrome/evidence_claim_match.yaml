          term:
            id: GO:0044233
            label: mitochondria-associated endoplasmic reticulum membrane contact site
      selected_evidence:
        snippet: β-cell specific Cisd2KO in mice disrupts systemic glucose homeostasis via impairing β-granules
          synthesis and insulin secretion; hypertrophy of the β-islets and the presence of a loss of identity
          that affects certain β-cells.
        supports: SUPPORT
