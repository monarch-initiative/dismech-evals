  a712b68a8d7fbb2c2e7b680b3a20c89aab6716e0919e87413ceae4b2fd44127e:
    claim:
      about:
        disease:
          name: Wolfram Syndrome
          disease_term:
            preferred_term: Wolfram Syndrome
            term:
              id: MONDO:0018105
              label: Wolfram syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Brainstem and Cerebellar Volume Loss
        biological_scale: TISSUE
        description: 'Volume loss centers on the brainstem, ventral pons, and cerebellum, and it is already
          measurable at the earliest clinical presentation, in the youngest patients with the mildest
          symptoms. Longitudinal morphometry separates two processes that clinical intuition tends to
          blur: controls gained white matter volume where the Wolfram group was flat in the optic radiations
          or shrinking in the brainstem and ventral pons, so there is failed developmental growth as well
          as frank degeneration. That distinction is not academic. Because part of the deficit is growth
          that never happened, a disease-modifying therapy plausibly has to start before or around the
          time diabetes is diagnosed to capture the full benefit. Progressive bulbar dysfunction and central
          apnea from this territory are what ultimately kill.'
        locations:
        - preferred_term: brainstem
          term:
            id: UBERON:0002298
            label: brainstem
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: Compared to healthy and type 1 diabetic control groups, the WFS group had smaller intracranial
          volume and preferentially affected gray matter volume and white matter microstructural integrity
          in the brainstem, cerebellum and optic radiations.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/13
      evidence_path: /pathophysiology/13/evidence/0
