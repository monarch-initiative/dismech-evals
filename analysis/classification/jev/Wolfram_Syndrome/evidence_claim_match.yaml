        description: 'Biallelic loss-of-function variants in WFS1 remove wolframin, a multipass transmembrane
          glycoprotein of the endoplasmic reticulum. Wolframin holds three jobs at once: it negatively
          regulates the unfolded protein response, it maintains endoplasmic reticulum calcium stores,
          and it supports the contact sites where the endoplasmic reticulum meets mitochondria. Nothing
          downstream in this entry is a separate insult; every later node is one of those three jobs going
          unattended.'
        genes:
        - preferred_term: WFS1
          term:
            id: hgnc:12762
            label: WFS1
        cellular_components:
