      assertion_type: DifferentialDiagnosis
      assertion:
        name: Nonclassic (Dominant) WFS1 Spectrum Disorder
        description: 'Heterozygous WFS1 variants cause a distinct, dominantly inherited spectrum: DFNA6/14/38
          low-frequency sensorineural hearing loss, Wolfram-like syndrome with adult-onset diabetes plus
          hearing loss and juvenile optic atrophy, and a de novo neonatal diabetes with congenital deafness
          and cataracts. The inheritance, the audiogram shape (low-frequency dominant versus high-frequency
          recessive), and the molecular mechanism (dominant-negative versus null) all differ. This entry
          deliberately covers only the recessive disease; the dominant spectrum belongs in separate entries.'
        distinguishing_features:
        - Single heterozygous WFS1 variant with dominant transmission
        - Low-frequency rather than high-frequency sensorineural hearing loss
        - Milder or partial phenotype without the full DIDMOAD sequence
      selected_evidence:
        snippet: Nonclassic WFS1-SD. The diagnosis is established in a proband with suggestive findings
          and a heterozygous pathogenic (or likely pathogenic) variant identified by molecular genetic
          testing.
        supports: SUPPORT
