      assertion_type: Pathophysiology
      assertion:
        name: ER-Mitochondria Contact and Calcium Transfer Dysregulation
        biological_scale: CELLULAR
        subtypes:
        - WS1
        - WS2
        description: 'Wolframin forms a complex with neuronal calcium sensor 1 (NCS1) and the inositol
          1,4,5-trisphosphate receptor to move calcium from the endoplasmic reticulum into mitochondria
          at mitochondria-associated membranes. In WFS1-null patient fibroblasts, NCS1 abundance falls,
          endoplasmic reticulum to mitochondria contacts and calcium exchange fall. CISD2 deficiency converges
          on the same compartment: isogenic CISD2-knockout human cortical neurons lose contact sites and
          calcium transfer, whereas one patient CISD2 missense variant increased both in fibroblasts.
          The node therefore records dysregulation, not a universal direction of effect across both molecular
          subtypes.'
        biological_processes:
        - preferred_term: endoplasmic reticulum calcium ion homeostasis
          term:
            id: GO:0032469
            label: endoplasmic reticulum calcium ion homeostasis
          modifier: DYSREGULATED
        cellular_components:
        - preferred_term: mitochondria-associated endoplasmic reticulum membrane
          term:
            id: GO:0044233
            label: mitochondria-associated endoplasmic reticulum membrane contact site
      selected_evidence:
        snippet: This Ca2+ dysregulation was associated with increased ER-mitochondria contact, a swollen
          ER lumen and a hyperfused mitochondrial network in the absence of overt ER stress.
        supports: SUPPORT
