      assertion_type: Treatment
      assertion:
        name: Genetic Counseling and Cascade Testing
        description: Autosomal recessive counseling with a 25% recurrence risk per pregnancy for carrier
          couples, plus cascade testing of siblings, which is the population in whom early diagnosis is
          actually achievable. Prenatal and preimplantation testing are possible once the familial variants
          are known. Counseling arithmetic differs completely if the family variant belongs to the dominant
          WFS1 allelic series, and misclassifying which series a family is in is a real counseling error.
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Genetic Counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: 'Evaluation of relatives at risk: It is appropriate to clarify the genetic status of
          apparently asymptomatic at-risk relatives in order to identify as early as possible those who
          would benefit from prompt initiation of treatment for the earliest manifestations of WFS1-SD:
          diabetes mellitus, optic atrophy, and sensorineural hearing loss.'
        supports: SUPPORT
