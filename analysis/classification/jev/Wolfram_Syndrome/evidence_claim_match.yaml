        biological_scale: MOLECULAR
        subtypes:
        - WS2
        description: Biallelic loss-of-function variants remove CISD2, an integral membrane protein present
          at the endoplasmic reticulum, mitochondrial outer membrane, and mitochondria-associated endoplasmic-reticulum
          membranes. Unlike wolframin, CISD2 does not interact with WFS1 directly. Its loss independently
          disrupts intracellular calcium handling, organelle contacts, mitochondrial function, and beta-cell
          insulin secretion.
