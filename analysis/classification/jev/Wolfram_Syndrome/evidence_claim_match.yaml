            label: protein ubiquitination
          modifier: DECREASED
      selected_evidence:
        snippet: Moreover, WFS1 stabilized the E3 ubiquitin ligase HRD1, brought ATF6alpha to the proteasome,
          and enhanced its ubiquitination and proteasome-mediated degradation, leading to suppression
          of ER stress signaling.
