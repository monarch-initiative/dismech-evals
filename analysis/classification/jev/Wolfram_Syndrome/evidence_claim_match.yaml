        context: []
      assertion_type: Diagnosis
      assertion:
        name: Molecular Genetic Testing
        description: Sequencing of WFS1 is the diagnostic gold standard when the picture is classic, with
          multigene panels for partial presentations and exome or genome sequencing for atypical cases,
          which is also how CISD2 cases are found. Chromosomal microarray, karyotype, and repeat-expansion
          testing have no role; mitochondrial DNA testing is indicated only to exclude mimics. The current
          Italian expert consensus explicitly recommends folding genetic testing into the diagnostic protocol
          rather than treating it as confirmatory afterthought.
      selected_evidence:
        snippet: The consensus recommends the revision of diagnostic protocols to include genetic testing
          and comprehensive multidisciplinary evaluations to ensure accurate diagnosis of WFS, advocates
          for personalized management plans tailored to the unique needs of each patient, with an emphasis
          on exploring new potential drug therapies.
        supports: SUPPORT
