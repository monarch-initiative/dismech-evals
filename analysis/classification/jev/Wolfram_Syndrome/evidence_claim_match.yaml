        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Type 1 Diabetes Mellitus
        description: 'The commonest misdiagnosis, and the reason Wolfram syndrome is typically identified
          years late. Distinguished by autoimmunity: islet autoantibodies are positive in type 1 diabetes
          and negative here, HLA risk haplotypes are present there and absent here, and C-peptide falls
          faster. Genetic testing of every child with autoantibody-negative, non-HLA-associated insulin-dependent
          diabetes is the highest-yield case-finding intervention available.'
        distinguishing_features:
        - Islet autoantibodies positive in type 1 diabetes, negative in Wolfram syndrome
        - HLA-DR3 and DR4 risk haplotypes present in type 1 diabetes only
        - Optic atrophy, diabetes insipidus, and deafness do not occur in isolated type 1 diabetes
      selected_evidence:
        snippet: Wolfram syndrome is an autosomal-recessive disorder characterized by insulin-dependent
          diabetes mellitus, caused by nonautoimmune loss of beta cells, and neurological dysfunctions.
        supports: SUPPORT
