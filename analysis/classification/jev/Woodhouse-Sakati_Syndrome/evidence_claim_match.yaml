      assertion_type: Treatment
      assertion:
        name: Deep brain stimulation
        description: Bilateral globus pallidus internus deep brain stimulation is an advanced symptomatic
          option for severe, progressive generalized dystonia. In a 2026 retrospective series of five
          genetically confirmed patients, all improved at 12 months and mean BFMDRS score improved by
          approximately 39%; the uncontrolled small series does not establish comparative efficacy or
          universal response.
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: deep brain stimulation
          term:
            id: NCIT:C21024
            label: Deep Brain Stimulation
      selected_evidence:
        snippet: Five patients with severe progressive generalized dystonia secondary to clinically and
          genetically confirmed WSS underwent bilateral GPi DBS from February 2011 through September 2023.
          The mean age at disease onset and at the time of DBS was 11.3 and 18.6, respectively. All patients'
          BFMDRS total scores improved from baseline to 12 months post-DBS. The mean pre-DBS BFMDRS score
          was 71.1, and the mean post-DBS BFMDRS score was 43.6. The percentage improvement in the BFMDRS
          mean score from pre- to post-DBS was approximately 39%.
        supports: SUPPORT
