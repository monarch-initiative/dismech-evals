      assertion_type: Discussion
      assertion:
        discussion_id: wss_systemic_mechanism_gap
        prompt: Which nucleolar or CRL4-dependent molecular consequences of DCAF17 loss cause the human
          neurologic, endocrine, auditory, ectodermal, and imaging manifestations of Woodhouse-Sakati
          syndrome?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Biallelic DCAF17 loss and nucleolar involvement
        - pathophysiology#Unresolved multisystem tissue dysfunction
        rationale: Biallelic DCAF17 loss and nucleolar localization are established, but the intervening
          human molecular pathway is not. Assigning every manifestation to impaired CRL4 proteostasis
          would exceed the current organ-limited animal evidence and could misdirect biomarker or therapeutic
          development.
        proposed_experiments:
        - experiment_id: exp_wss_isogenic_multilineage_human_models
          name: Isogenic DCAF17 human multilineage functional comparison
          description: Compare DCAF17-null and isogenic-corrected human iPSC-derived neurons, pancreatic
            beta cells, pituitary endocrine cells, and hair-follicle cells using nucleolar morphology,
            ribosome-biogenesis, ubiquitin-proteomics, protein-turnover, and lineage-specific functional
            readouts. Concordant rescue by DCAF17 correction would identify which abnormalities bridge
            the genotype to multiple human tissues.
      selected_evidence:
        snippet: The gene encodes a nucleolar protein of unknown function, and the cellular phenotype
          observed in patient lymphoblasts implicates a role for the nucleolus in the pathogenesis of
          this disease.
        supports: SUPPORT
