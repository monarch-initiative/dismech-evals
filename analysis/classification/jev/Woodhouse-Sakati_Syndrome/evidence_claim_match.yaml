      assertion_type: ProgressionInfo
      assertion:
        age_range: Childhood through adulthood
        notes: 'Hair thinning begins in childhood and can progress to alopecia totalis; hypogonadism becomes
          evident at puberty. Neurologic disease usually begins in adolescence but is heterogeneous: a
          rapidly progressive subgroup develops severe disability over a mean of 7.4 years, whereas another
          subgroup has absent or mild neurologic involvement with preserved daily function. Dystonia and
          diabetes become more prevalent with age, so an initially mild examination does not exclude later
          complications.'
      selected_evidence:
        snippet: Virtually all individuals with Woodhouse-Sakati syndrome (WSS) have the endocrine findings
          of hypogonadism (evident at puberty) and progressive childhood-onset hair thinning that often
          progresses to alopecia totalis in adulthood
        supports: SUPPORT
