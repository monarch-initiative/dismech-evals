      assertion_type: Treatment
      assertion:
        name: Multidisciplinary Surveillance
        action_category: MONITORING
        description: Follow-up should be coordinated by a metabolic-bone team and include growth, lower-limb
          alignment, pain, mobility and dental review; serum phosphate, calcium, creatinine, ALP, PTH
          and vitamin D measures; and treatment-specific monitoring. Conventional therapy requires urinary
          calcium and renal ultrasonography for hypercalciuria/nephrocalcinosis. Burosumab dosing uses
          timed phosphate and TmP/GFR rather than FGF23 assays. Imaging is driven by rickets response,
          deformity, focal pain or neurological concern, and dental evaluation is recommended every six
          months.
      selected_evidence:
        snippet: For individuals on burosumab therapy, regular monitoring of serum concentrations of phosphate,
          calcium, creatinine, alkaline phosphatase, and intact parathyroid hormone.
        supports: SUPPORT
