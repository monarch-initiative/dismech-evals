        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Calcipenic or Nutritional Rickets
        description: Vitamin D or calcium deficiency can produce rickets and elevated alkaline phosphatase
          without the isolated FGF23-mediated renal phosphate-wasting pattern of XLH.
        distinguishing_features:
        - Vitamin D or calcium deficiency and high PTH activity favor calcipenic rickets.
        - Renal phosphate loss is secondary to PTH rather than inappropriately non-suppressed FGF23.
        - Correction of the nutritional or mineral deficiency separates it from inherited XLH.
      selected_evidence:
        snippet: The differential diagnosis of XLH is based on the mechanisms leading to hypophosphataemia
          ... high parathyroid hormone (PTH) activity (leading to calcipenic rickets)
        supports: SUPPORT
