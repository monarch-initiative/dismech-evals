      assertion_type: Discussion
      assertion:
        discussion_id: gap_xlh_phex_to_fgf23_coupling
        prompt: What molecular intermediates connect PHEX loss in mineralizing cells to increased FGF23
          synthesis and secretion?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#PHEX Loss of Function in Mineralizing Cells
        - pathophysiology#Excess Bone-Derived FGF23 Signaling
        rationale: The causal PHEX gene and downstream FGF23 excess are well established, but treating
          PHEX as though it directly degrades FGF23 would overstate current evidence. Resolving the intervening
          osteocyte pathways could expose upstream targets that complement systemic FGF23 neutralization.
      selected_evidence:
        snippet: The pathogenesis of XLH is complex and incompletely understood. Many features of the
          disease can be explained by increased secretion of the phosphaturic hormone fibroblast growth
          factor 23 (FGF23) from bone.
        supports: SUPPORT
