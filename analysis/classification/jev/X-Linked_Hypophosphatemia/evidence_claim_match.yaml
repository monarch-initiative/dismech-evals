  b303cc9cf6c17bc899658a0e66212bfef67dd6aebaf01d20370a2b6d5a620b69:
    claim:
      about:
        disease:
          name: X-Linked Hypophosphatemia
          disease_term:
            preferred_term: X-linked dominant hypophosphatemic rickets
            term:
              id: MONDO:0010619
              label: X-linked dominant hypophosphatemic rickets
        context: []
      assertion_type: Treatment
      assertion:
        name: Burosumab
        action_category: THERAPEUTIC
        therapeutic_modality: MONOCLONAL_ANTIBODY
        description: Burosumab is a fully human monoclonal antibody that neutralizes FGF23. The comparative
          pediatric phase 3 evidence enrolled children aged 1-12 years with persistent rickets (RSS at
          least 2), hypophosphatemia and substantial prior conventional therapy; it did not directly establish
          superiority in mild rickets or adolescents. Updated recommendations support use in children
          and adolescents aged 1-17 years with signs of rickets. The adult placebo trial enrolled symptomatic
          adults with hypophosphatemia and pain and showed phosphate correction, greater fracture healing
          and reduced stiffness, while pain and physical-function comparisons did not survive multiplicity
          adjustment. A 2026 study in 16 infants younger than 12 months provides small, open-label, non-randomized
          safety evidence, not comparative efficacy or a universal authorization boundary; eligibility
          and labeling remain jurisdiction-specific. Burosumab is not co-administered with oral phosphate
          or active vitamin D and is avoided when baseline phosphate is normal or renal impairment is
          severe. Guidance recommends contraception during treatment for patients who could become pregnant
          and stopping burosumab when pregnancy is planned or identified. During lactation, the updated
          guideline does not treat burosumab as categorically contraindicated, but limits consideration
          to severe manifestations after individualized counselling.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: burosumab
            term:
              id: NCIT:C119744
              label: Burosumab
      selected_evidence:
        snippet: we enrolled children with X-linked hypophosphataemia aged 1-12 years. Key eligibility
          criteria were a total Thacher rickets severity score of at least 2.0, fasting serum phosphorus
          lower than 0.97 mmol/L (3.0 mg/dL), confirmed PHEX (phosphate-regulating endopeptidase homolog,
          X-linked) mutation or variant of unknown significance in the patient or a family member with
          appropriate X-linked dominant inheritance, and receipt of conventional therapy for at least
          6 consecutive months for children younger than 3 years or at least 12 consecutive months for
          children older than 3 years.
        supports: SUPPORT
