    claim:
      about:
        disease:
          name: X-Linked Hypophosphatemia
          disease_term:
            preferred_term: X-linked dominant hypophosphatemic rickets
            term:
              id: MONDO:0010619
              label: X-linked dominant hypophosphatemic rickets
        context: []
      assertion_type: Biochemical
      assertion:
        name: Reduced TmP/GFR and Renal Phosphate Wasting
        presence: Decreased tubular phosphate reabsorption
        notes: 'No loinc_term is bound. TmP/GFR, the renal phosphate threshold, has no LOINC code: neither
          the full LOINC 2.83 table nor the Monarch KG, which is where Part codes are readable, returns
          any record for it or for a tubular reabsorption of phosphate. The release''s nearest codes must
          not be substituted. Its two fractional excretion of phosphate codes, LOINC:50057-9 and LOINC:56925-1,
          measure the *excreted* fraction, which moves in the opposite direction from the reabsorption
          this record reports, so the same patient reads high on one scale and low on the other. Its two
          phosphate renal clearance codes, LOINC:2776-3 and LOINC:50058-7, are a volume rate, a third
          quantity again. The same substitution was considered and declined in Hyperphosphatemic_Familial_Tumoral_Calcinosis,
          where the direction runs the other way and the worked figure makes the error concrete; this
          record is the second instance of the same gap. No reference range is bound: the row notes that
          interpretation needs age-adjusted reference values, and in any case there is no code to key
          an interval to.'
        context: Calculate TmP/GFR from paired serum and urine phosphate and creatinine; interpret with
          age-adjusted reference values, especially in children.
      selected_evidence:
        snippet: urinary levels of calcium, phosphate and creatinine for calculation of the tubular maximum
          reabsorption of phosphate per glomerular filtration rate (TmP/GFR) and urinary calcium to creatinine
          ratio
        supports: SUPPORT
