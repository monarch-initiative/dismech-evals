  d672af84eccad901247e6126affd571b4e58b48d01756bd8ec6925b2154d1957:
    claim:
      about:
        disease:
          name: X-Linked Nephrogenic Diabetes Insipidus
          disease_term:
            preferred_term: X-linked nephrogenic diabetes insipidus
            term:
              id: MONDO:0010581
              label: diabetes insipidus, nephrogenic, X-linked
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: Polarized MDCK cells stably expressing V2 receptor mutants
        experimental_model_type: CELL_LINE
        description: 'The system in which the pharmacochaperone idea was tested properly. Nine different
          disease-causing V2 receptor mutants were stably expressed in polarized MDCK cells - which matters,
          because a receptor''s destination is the basolateral membrane and an unpolarized cell cannot
          report on that. Four cell-permeable non-peptide antagonists rescued maturation and basolateral
          expression of eight of the nine mutants. The study''s real contribution is the constraint it
          found: rescue at concentrations a patient could actually receive required high-affinity antagonists,
          because the low-affinity one needed concentrations that were not clinically feasible even though
          it was easier for vasopressin to displace.'
        publication: PMID:16926443
        notes: No cell_types binding. MDCK is a canine kidney epithelial line, and binding it to the human
          collecting-duct principal cell term would overstate what the system is; CL does not represent
          cell lines, and no CLO binding is available in this schema. The polarization of the line, which
          is the property that makes it informative about basolateral delivery, is described above instead.
        modeled_mechanisms:
        - target: Endoplasmic Reticulum Retention of Misfolded V2 Receptor
          relationship: RESCUES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Cell-permeable non-peptide antagonists restored membrane expression and function
            of ER-retained mutants, which is the experimental demonstration that retention, not intrinsic
            receptor failure, is the rate-limiting lesion.
          limitations: A canine kidney cell line overexpressing a transfected human receptor, not a human
            principal cell in situ; rescue was shown for eight of nine mutants tested, so it is allele-dependent;
            and no clinical benefit in patients is demonstrated by this work.
          readouts:
          - name: Basolateral membrane expression of mutant V2 receptor after antagonist exposure
            target: Endoplasmic Reticulum Retention of Misfolded V2 Receptor
            direction: RESTORED
            interpretation: Restored surface delivery of a receptor that ER quality control had been holding
              back.
      selected_evidence:
        snippet: At clinically feasible antagonist concentrations, however, only the high-affinity antagonists
          OPC31260 and OPC41061 induced functional rescue, as at these concentrations the extent of BM
          expression became limited.
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/0
      evidence_path: /experimental_models/0/evidence/0
