  4b8f9d50ed197d5952a8e6d2128ef3d03a12dfba2e5c3005d81506b6b35c384e:
    claim:
      about:
        disease:
          name: X-Linked Nephrogenic Diabetes Insipidus
          disease_term:
            preferred_term: X-linked nephrogenic diabetes insipidus
            term:
              id: MONDO:0010581
              label: diabetes insipidus, nephrogenic, X-linked
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Absent or Truncated V2 Receptor Protein
        description: 'The third mechanistic class of AVPR2 loss of function, and the one that cannot be
          addressed by rescuing a receptor, because there is no receptor to rescue. Nonsense, frameshift,
          large-deletion and complex-rearrangement alleles yield absent, truncated or otherwise undetectable
          receptor protein. The step that fails is after transcription rather than at it: in the study
          cited here mRNA was produced for every mutant construct tested, yet the 804delG frameshift allele
          gave no receptor protein on Western blot. This node exists because the entry''s own flagship
          animal model - the Glu242stop knock-in mouse - carries an allele of exactly this class, so without
          it the model''s variant class had no route through the graph.'
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: renal collecting duct principal cell
          term:
            id: CL:1001431
            label: kidney collecting duct principal cell
        molecular_functions:
        - preferred_term: arginine vasopressin V2 receptor activity
          modifier: ABSENT
          term:
            id: GO:0005000
            label: vasopressin receptor activity
      selected_evidence:
        snippet: The mechanisms underlying a V2R loss-of-function can be theoretically classified as either
          protein expression, localization (ER retention) or functional disorders.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32138955
      reference_title: V2 vasopressin receptor mutations.
      evidence_source: OTHER
      explanation: Names protein expression as the first of the three recognised loss-of-function classes.
        This entry models all three, one node each, because the review names three.
