              label: diabetes insipidus, nephrogenic, X-linked
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Water deprivation test
        presence: PRESENT
        measurements:
        - preferred_term: water deprivation test
          term:
            id: LOINC:94129-4
            label: Water deprivation challenge panel - Urine and Serum or Plasma
        notes: 'LOINC 2.83 codes the test as a single orderable panel spanning both specimens, which is
          the level bound here. No reference range is bound: the two numbers this row carries are the
          thresholds at which the test must not be performed - serum sodium above 145 mmol/L and plasma
          osmolality above 295 mOsm/kg - and both are strict inequalities on continuous quantities, which
          an interval whose lower bound is inclusive cannot state without moving the boundary. They are
          safety limits on whether to test rather than decision limits read off a result, so they are
          left in the description where the contraindication is explained.'
        description: 'The classical confirmatory test, and the one this entry has to carry a safety caveat
          about rather than simply list. Water deprivation testing is contraindicated in the presence
          of hypernatraemia - serum sodium above 145 mmol/L - because of the risk of severe dehydration,
          and in practice the threshold used also includes plasma osmolality above 295 mOsm/kg. In that
          situation the desmopressin challenge is performed alone, without prior restriction. This matters
          more in this disease than the general caveat suggests: the median serum sodium at diagnosis
          in one cohort was 160.5 mmol/L, so the typical patient presents already past the threshold at
          which the test is unsafe. Where serum sodium is high or high-normal and the urine is inappropriately
          dilute, the diagnosis can be made without water restriction at all.'
      selected_evidence:
        snippet: Water deprivation testing is contraindicated in the presence of hypernatremia (serum
          sodium > 145 mmol/L) due to the risk of severe dehydration.
        supports: SUPPORT
