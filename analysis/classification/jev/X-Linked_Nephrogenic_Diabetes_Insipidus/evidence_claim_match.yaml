          water - including the routine nil-by-mouth before a procedure - converts a manageable chronic
          condition into acute hypernatraemia. GeneReviews lists water restriction explicitly under agents
          and circumstances to avoid, and specifies that a patient who must be nil by mouth receives their
          usual oral water intake intravenously as 5 per cent dextrose rather than saline.
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: free access to drinking water and toilet facilities
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: Water intake must not be restricted.
        supports: SUPPORT
