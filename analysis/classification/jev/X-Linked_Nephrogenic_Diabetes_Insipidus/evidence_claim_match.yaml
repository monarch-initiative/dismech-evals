            description: Hypernatraemia is the dangerous consequence, not the polyuria itself. It appears
              whenever intake cannot keep pace with the obligatory loss, which in practice means during
              any intercurrent illness, in hot weather, when water is withheld, or when an infant is nil
              by mouth for a procedure. Repeated episodes are the reason treatment of this disease is
              urgent rather than merely symptomatic.
            phenotype_term:
              preferred_term: Hypernatremia
              term:
                id: HP:0003228
                label: Hypernatremia
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Intellectual disability
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: The neurodevelopmental consequence is attributed to the electrolyte disturbance itself.
          The intermediate steps between a hypernatraemic episode and permanent cognitive deficit are
          not established in this disease, and the cited review asserts the attribution without demonstrating
          the mechanism or quantifying the exposure needed.
      selected_evidence:
        snippet: Irreversible brain damage and cognitive deficit secondary to electrolyte imbalances may
          be present.
        supports: SUPPORT
