  dfe895d80ab964a06da9ffef513f6a8fa1557fe79e5d2b6afabfc3165607b772:
    claim:
      about:
        disease:
          name: X-Linked Nephrogenic Diabetes Insipidus
          disease_term:
            preferred_term: X-linked nephrogenic diabetes insipidus
            term:
              id: MONDO:0010581
              label: diabetes insipidus, nephrogenic, X-linked
        context: []
      assertion_type: Treatment
      assertion:
        name: Low-Solute, Sodium-Restricted Diet
        description: 'A dietary rather than pharmacological intervention, and a necessary partner to the
          thiazide: because the obligatory urine volume is set by the solute load that has to be excreted,
          reducing dietary solute - principally sodium - reduces the volume directly. This is the correct
          slot for the diet, not a drug with an agent binding. The accompanying nutritional problem pulls
          the other way, since an infant with failure to thrive needs calories, which is why dietitian
          involvement is standard and why a gastrostomy is often how both requirements are met at once.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: low-solute, sodium-restricted diet
          term:
            id: NCIT:C15447
            label: Dietary Intervention
          dietary_modifications:
          - action: RESTRICT
            description: Dietary restriction of sodium, to reduce the osmolar load that must be excreted
              and so the obligatory urine volume.
          - action: RESTRICT
            description: Reduction of total dietary solute load, the broader version of the same principle.
      selected_evidence:
        snippet: often used in combination with either amiloride (a potassium-sparing diuretic) or indomethacin;
          dietary restriction of sodium
        supports: SUPPORT
    origin:
