          the problem becomes chronic: polyuria, polydipsia, nocturia and bed-wetting, weight that eventually
          catches up, and height that largely does not. Growth and electrolyte surveillance is recommended
          three-monthly in infants and six-monthly in older children, with annual renal ultrasound for
          the urinary tract.'
      selected_evidence:
        snippet: Monitor growth and development at least every three months in infants and at least every
          six months in older children; measurement of serum sodium concentration to identify unrecognized
          hyperosmolality and early dehydration at least every three months in infants, at least every
          six months in older children, and annually in adults or only as needed; annual kidney ultrasound
          examination to monitor for hydronephrosis and megacystis.
        supports: SUPPORT
