  4fb5b1cdb3574e9cbfd15762064813770cec48ff2c6d40e07cf4f73e0eccf071:
    claim:
      about:
        disease:
          name: X-Linked Nephrogenic Diabetes Insipidus
          disease_term:
            preferred_term: X-linked nephrogenic diabetes insipidus
            term:
              id: MONDO:0010581
              label: diabetes insipidus, nephrogenic, X-linked
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Failure to concentrate urine after desmopressin
        presence: PRESENT
        measurements:
        - preferred_term: urine osmolality one hour after desmopressin
          term:
            id: LOINC:94005-6
            label: Osmolality of Urine--1 hour post dose vasopressin
        - preferred_term: urine osmolality two hours after desmopressin
          term:
            id: LOINC:94014-8
            label: Osmolality of Urine--2 hours post dose vasopressin
        notes: 'The bound codes name the stimulus vasopressin rather than desmopressin because LOINC 2.83
          does not use the analogue''s name: the strings desmopressin, DDAVP and dDAVP match no code name,
          short name or component anywhere in the release, which names this challenge vasopressin throughout,
          so these are the codes for a DDAVP challenge as well. Both post-dose urine osmolality codes
          are bound because LOINC 2.83 has exactly these two and no time-agnostic equivalent: the release''s
          only urine osmolality codes qualified by vasopressin are at one and two hours. The release''s
          one vasopressin-challenge panel, LOINC:94128-6, is deliberately not bound - it is scoped to
          a challenge given after water deprivation, and this row''s point is that in this disease the
          challenge is routinely given alone because water restriction is unsafe. No reference range is
          bound: the 200 mosmol/kg figure this row cites is a measured ceiling in three symptomatic heterozygous
          females, not a decision limit, and the source states it as a value not exceeded, which an interval
          whose upper bound is exclusive cannot express without moving the boundary.'
        description: 'The physiological discriminator between nephrogenic and central diabetes insipidus.
          A nephrogenic kidney does not concentrate urine when given exogenous vasopressin or desmopressin,
          because the defect is downstream of the hormone. Note that in the AVPR2 form the absence of
          response is not confined to the kidney: extrarenal V2 receptor responses to desmopressin, such
          as the rise in coagulation factors, are also absent, and that was used as confirmatory evidence
          in symptomatic female heterozygotes.'
      selected_evidence:
        snippet: Maximal urine osmolality in three female patients did not exceed 200 mosmol/kg and the
          absence of extra-renal responses to 1-desamino-8-D-arginine vasopressin was demonstrated in
          two of them.
        supports: SUPPORT
