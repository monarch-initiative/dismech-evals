        notes: This is where the disease is dangerous and where it is missed. The presentation is not
          polyuria and thirst; it is a vomiting, anorexic, poorly growing infant with unexplained fever
          who dehydrates rapidly with any intercurrent illness, hot weather, or withholding of water.
          Most patients - 87 per cent in the largest series - are diagnosed within the first two and a
          half years, which is another way of saying that a substantial minority are not. Because the
          infant cannot drink to thirst unaided, carer-dependent water supply is the only thing preventing
          hypernatraemia, and being nil by mouth for a procedure is a specific hazard.
      selected_evidence:
