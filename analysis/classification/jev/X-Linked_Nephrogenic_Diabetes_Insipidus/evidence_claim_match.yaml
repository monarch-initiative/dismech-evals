  34f6e01454a76036a8f3216bcf8bbbc5268c77684bf6e174ceb3254621fd3083:
    claim:
      about:
        disease:
          name: X-Linked Nephrogenic Diabetes Insipidus
          disease_term:
            preferred_term: X-linked nephrogenic diabetes insipidus
            term:
              id: MONDO:0010581
              label: diabetes insipidus, nephrogenic, X-linked
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: xndi_neurocognitive_attribution
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is the cognitive impairment reported in untreated X-linked nephrogenic diabetes insipidus
          caused by repeated hypernatraemic episodes, and if so what exposure is required?
        attaches_to:
        - phenotypes#Intellectual disability
        - phenotypes#Hypernatremia
        rationale: 'There is a live contradiction here, not just a gap. GeneReviews holds that intelligence
          is usually normal with early diagnosis and treatment; a 2025 cohort followed for a median of
          16.9 years found neurodevelopmental disorders in six of eight patients who were all on hydrochlorothiazide
          and amiloride with normalised serum sodium. Treatment status therefore does not reconcile the
          two. Three explanations are open and the cited literature does not choose between them: ascertainment
          in a small referral series, residual subclinical hypernatraemic episodes that a normalised steady-state
          sodium does not capture, or a contribution from something other than sodium - chronic undernutrition
          severe enough to leave a permanent height deficit is the obvious candidate. The attribution
          to electrolyte disturbance is stated in review form and hedged there, and no cited source anchors
          it to a measured exposure-response relationship. Note also that the 66-child multicentre cohort,
          which is the largest series here and reported growth, urological and renal outcomes in detail,
          did not report cognitive outcome at all - so the best-powered study is silent on precisely this
          question. This matters practically: if the relationship is dose-dependent in episodes, the value
          of early diagnosis becomes quantifiable and the sodium surveillance interval becomes an evidence
          question rather than a convention.'
      selected_evidence:
        snippet: Neurodevelopmental disorders were identified in six patients, including intellectual
          disability, autism spectrum disorder, language delay, and learning difficulties.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40922895
      reference_title: 'Nephrogenic Diabetes Insipidus: Three Decades of Clinical Reality.'
      evidence_source: HUMAN_CLINICAL
      explanation: The observation that creates the contradiction, in patients who were treated.
