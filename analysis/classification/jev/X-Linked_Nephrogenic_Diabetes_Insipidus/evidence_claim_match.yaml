  29d5b9acc0bd388aa97c98e440648d18e2261dda2fb883045d54c99e65e94edf:
    claim:
      about:
        disease:
          name: X-Linked Nephrogenic Diabetes Insipidus
          disease_term:
            preferred_term: X-linked nephrogenic diabetes insipidus
            term:
              id: MONDO:0010581
              label: diabetes insipidus, nephrogenic, X-linked
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Basal plasma copeptin
        presence: PRESENT
        measurements:
        - preferred_term: basal plasma copeptin
          term:
            id: LOINC:LP200145-3
            label: Provasopressin.C-terminal
        notes: 'LOINC does not use the word copeptin: the string matches no code name, short name or component
          in release 2.83, and nothing in the Monarch KG. The analyte is coded under its formal name,
          the C-terminal fragment of provasopressin. The common laboratory abbreviation CT-proAVP does
          reach it, through a short name rather than a code name - in release 2.83 CT-proAVP is the short
          name of exactly one code, LOINC:78987-5 - so the abbreviation is not absent from LOINC, only
          from its code names. Searched for that formal name, the KG holds exactly two records: this Part,
          which carries no method or specimen qualifier, and LOINC:78987-5, which adds serum or plasma
          and an immunoassay method. The Part is bound because this slot names the test''s identity, and
          a row describing a basal plasma measurement should not be pinned to one assay method. No reference
          range is bound; the entry records that the one cutoff found for this disease could not be verified.'
        description: 'Copeptin is the stable C-terminal fragment of the vasopressin prohormone and stands
          in for a hormone that is itself unstable and largely platelet-bound. It is unusually well suited
          to this disease: because the lesion is downstream of normal or raised vasopressin secretion,
          an unstimulated basal copeptin measurement is sufficient to diagnose nephrogenic diabetes insipidus,
          where separating central diabetes insipidus from primary polydipsia needs a stimulation test.
          That asymmetry is the point - the test that is hard for the other two entities in the differential
          is easy for this one, and it avoids a water deprivation test that is contraindicated in most
          patients here. No numeric cutoff is curated: see the note on the unverified 21.4 pmol/L figure.'
      selected_evidence:
        snippet: Whereas unstimulated basal copeptin measurement reliably diagnoses nephrogenic diabetes
          insipidus, two new tests using stimulated copeptin cutoff levels showed a high diagnostic accuracy
          in differentiating central diabetes insipidus from primary polydipsia.
        supports: SUPPORT
    origin:
