  8332078c9accdb7373b4238c685594951ee6eaa66a5aca29b321dc3c763be898:
    claim:
      about:
        disease:
          name: X-Linked Nephrogenic Diabetes Insipidus
          disease_term:
            preferred_term: X-linked nephrogenic diabetes insipidus
            term:
              id: MONDO:0010581
              label: diabetes insipidus, nephrogenic, X-linked
        context:
        - path: /treatments/1
          value:
            name: Thiazide Diuretic
            description: 'The counterintuitive mainstay: a diuretic given to reduce urine output. Used
              with a low-sodium diet it reduces polyuria by up to 50 per cent without causing hypernatraemia,
              and it is the one drug on which paediatric nephrologists agree - 93 per cent of surveyed
              providers prescribe a thiazide. The mechanism is indirect and does not involve the collecting
              duct at all: the thiazide causes natriuresis, sodium depletion follows, and the resulting
              fall in effective renal plasma flow and glomerular filtration rate reduces distal delivery.
              Work in Brattleboro rats showed the antidiuresis disappears when sodium depletion is prevented,
              and that under those conditions urine volume actually rises - evidence that the antidiuretic
              effect is entirely secondary to volume contraction, with an additional suggestion of reduced
              proximal fluid reabsorption. Note the model caveat: those experiments used the hypothalamic
              (central) form of the disease, not a receptor-level one. On efficacy: serum sodium normalised
              in every patient of one long-term cohort on hydrochlorothiazide plus amiloride, but polyuria
              and polydipsia persisted in all of them throughout a median of 16.9 years - which is the
              honest summary of what this regimen achieves. It protects against hypernatraemia; it does
              not fix the water loss.'
            therapeutic_modality: SMALL_MOLECULE
            treatment_term:
              preferred_term: Pharmacotherapy
              term:
                id: NCIT:C15986
                label: Pharmacotherapy
              therapeutic_agent:
              - preferred_term: hydrochlorothiazide
                term:
                  id: CHEBI:5778
                  label: hydrochlorothiazide
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Obligatory Hypotonic Free Water Loss
        treatment_effect: MODULATES
        description: Reduces the volume of the obligatory loss by reducing distal delivery, through volume
          contraction. It does not restore collecting duct water permeability and does not touch the receptor
          defect.
      selected_evidence:
        snippet: The results indicate that the antidiuresis caused by hydrochlorothiazide in diabetes
          insipidus results, at least in part, from falls in effective renal plasma flow and glomerular
          filtration rate. These in turn seem to be entirely secondary to the drug-induced sodium depletion.
        supports: SUPPORT
        directness: INDIRECT
