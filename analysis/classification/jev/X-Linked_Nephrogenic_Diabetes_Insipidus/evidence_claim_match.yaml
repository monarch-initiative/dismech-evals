  757c3456fd9c2ae0d0ebfc034629a2cbcb0469a292fd0fb6b879c235fca3794b:
    claim:
      about:
        disease:
          name: X-Linked Nephrogenic Diabetes Insipidus
          disease_term:
            preferred_term: X-linked nephrogenic diabetes insipidus
            term:
              id: MONDO:0010581
              label: diabetes insipidus, nephrogenic, X-linked
        context: []
      assertion_type: Inheritance
      assertion:
        name: X-linked recessive
        description: 'Affected males are hemizygous. The inheritance is conventionally called recessive
          because hemizygous males carry the full phenotype and most heterozygous females do not, but
          the female side is more interesting than "carrier" suggests: a heterozygous female can be as
          severely affected as a male, and the explanation offered for that is skewed X-inactivation against
          the normal allele. In a review of 23 families with at least one affected female, every female
          in whom X-inactivation was studied showed extreme or slight skewing, and all six with severe
          disease carried complete loss-of-function alleles. In a Chinese family, skewing of the normal
          allele was present in four symptomatic heterozygotes and absent in an asymptomatic one. Two
          limits on that claim are worth stating rather than glossing. The inactivation pattern in all
          of these studies was measured in accessible somatic tissue, not in the collecting duct where
          the receptor has to work, so the inference to the relevant tissue is an inference. And the association
          is consistent rather than demonstrated sufficient: no cited study shows that skewing alone produces
          the phenotype. The practical consequence stands regardless - an AVPR2 heterozygote cannot be
          reassured on the basis of her sex, and a female with nephrogenic diabetes insipidus needs AVPR2
          considered alongside AQP2.'
        inheritance_term:
          preferred_term: X-linked recessive inheritance
          term:
            id: HP:0001419
            label: X-linked recessive inheritance
        de_novo_rate: about 20 per cent of isolated cases, arising during maternal oogenesis
      selected_evidence:
        snippet: Hereditary NDI is most commonly inherited in an X-linked manner (~90% of individuals).
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
