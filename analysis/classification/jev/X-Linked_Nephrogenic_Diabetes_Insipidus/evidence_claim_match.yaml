  9e015d52585d0896688dee360508cddd8a128c1685a1547363125e300cb4ac31:
    claim:
      about:
        disease:
          name: X-Linked Nephrogenic Diabetes Insipidus
          disease_term:
            preferred_term: X-linked nephrogenic diabetes insipidus
            term:
              id: MONDO:0010581
              label: diabetes insipidus, nephrogenic, X-linked
        context: []
      assertion_type: Treatment
      assertion:
        name: Indomethacin or Other NSAID
        description: 'A prostaglandin synthesis inhibitor used as the alternative third agent. It works
          - and is prescribed by 55 per cent of surveyed providers - but it is the contested part of the
          regimen: 43 per cent of providers who avoid it cite gastrointestinal and renal side effects,
          which in a child with an already compromised urinary tract is not a trivial concern. The usual
          rationale is that renal prostaglandin E2 opposes the concentrating mechanism, so removing it
          helps, and that step is now cited here: PGE2 reverses vasopressin-induced translocation of aquaporin-2
          to the plasma membrane in rat inner medulla, acting by activating retrieval of the channel.
          Two caveats keep this from being a clean explanation of the drug''s benefit in this disease,
          and they are the reason the mechanism link below is still only MODULATES. First, what PGE2 was
          shown to reverse was vasopressin-induced translocation - a process that does not occur in a
          V2 receptor-null kidney, so the demonstrated mechanism presupposes the very signalling this
          disease lacks. Second, in the same experiments PGE2 on its own did not alter aquaporin-2 phosphorylation
          or distribution at all, which argues against a standing PGE2 brake that an NSAID could release
          in the absence of vasopressin action. The benefit is real and well attested clinically; the
          route by which it is obtained in a receptor-null kidney is not established by anything cited
          here.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: indomethacin
            term:
              id: CHEBI:49662
              label: indometacin
      selected_evidence:
        snippet: Our data indicate that 1) recruitment of AQP2 to the plasma membrane and its retrieval
          to a pool of intracellular vesicles may be regulated independently, 2) PGE(2) may counteract
          AVP action by activation of AQP2 retrieval, 3) dephosphorylation of AQP2 is not a prerequisite
          for its internalization.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/3
      evidence_path: /treatments/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:10710543
      reference_title: 'Prostaglandin E(2) interaction with AVP: effects on AQP2 phosphorylation and distribution.'
      evidence_source: IN_VITRO
      explanation: The authors' own three conclusions. The second is the prostaglandin rationale for using
        an NSAID; the first and third matter separately for this entry, because they show aquaporin-2
