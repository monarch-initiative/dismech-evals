              label: diabetes insipidus, nephrogenic, X-linked
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: AVPR2 Loss-of-Function Variant
        description: 'A hemizygous pathogenic variant in AVPR2 on Xq28, the gene encoding the arginine
          vasopressin V2 receptor. The allelic spectrum is wide and largely private: 82 different putative
          disease-causing variants were found among 117 families, and haplotype analysis indicates that
          recurrences of the same variant in apparently unrelated families arose independently rather
          than from a shared founder. Roughly a fifth of isolated cases are de novo, arising during oogenesis
          in the mother.'
        biological_scale: MOLECULAR
        genetic_context:
          gene:
            preferred_term: AVPR2
            term:
              id: hgnc:897
              label: AVPR2
          variant_origin: GERMLINE
          zygosity: HEMIZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Hemizygous in affected males. Heterozygous females are affected only when X-inactivation
            is skewed against the normal allele.
        molecular_functions:
        - preferred_term: arginine vasopressin V2 receptor activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0005000
            label: vasopressin receptor activity
      selected_evidence:
        snippet: Among 117 families, there were 82 different putative disease-causing mutations. Based
          on haplotype analysis, it can be inferred that when the same AVPR2 mutation is identified in
          different families that were not known to be related, the mutations most likely arose independently.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
