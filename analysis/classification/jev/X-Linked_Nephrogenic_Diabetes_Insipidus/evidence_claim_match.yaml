          with dilatation of pelvis, ureter and bladder. One review also notes an apparent loss of efficacy
          of medical treatment during school age, which if real is a reason not to assume a stable regimen
          lasts.
      selected_evidence:
        snippet: Urodynamics have shown the bladder itself to be compliant, but drainage is poor leading
          to further renal impairment and overflow incontinence.
        supports: SUPPORT
