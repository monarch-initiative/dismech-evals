        context: []
      assertion_type: Phenotype
      assertion:
        category: Neurologic
        name: Intellectual disability
        frequency: OCCASIONAL
        description: This is where the literature contradicts itself, and the contradiction matters clinically.
          GeneReviews and the older teaching hold that intelligence is usually normal when the disease
          is diagnosed and treated early. A 2025 single-centre cohort followed for a median of 16.9 years
          found neurodevelopmental disorders - intellectual disability, autism spectrum disorder, language
          delay, learning difficulties - in six of its eight patients, all of whom were on hydrochlorothiazide
          and amiloride and all of whom had normalised serum sodium. Eight patients is a small and probably
          referral-selected denominator, so this is not a population risk estimate. But it is not reconcilable
          with "usually normal" by appeal to treatment status either, because these patients were treated.
          The attribution to electrolyte disturbance is stated in review form and hedged there; nothing
          cited here establishes the intermediate steps, quantifies the exposure, or separates repeated
          hypernatraemia from chronic undernutrition. See the attached knowledge gap.
        phenotype_term:
          preferred_term: Intellectual disability
          term:
            id: HP:0001249
            label: Intellectual disability
      selected_evidence:
        snippet: Neurodevelopmental disorders were identified in six patients, including intellectual
          disability, autism spectrum disorder, language delay, and learning difficulties.
        supports: SUPPORT
