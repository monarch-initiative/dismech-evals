          modifier: DECREASED
          term:
            id: GO:0072659
            label: protein localization to plasma membrane
        - preferred_term: regulation of aquaporin-2 water channel activity
          modifier: DECREASED
          term:
            id: GO:1902427
            label: regulation of water channel activity
      selected_evidence:
        snippet: These patients have functional AQP2, and thus the challenge is to achieve AQP2 membrane
          insertion independently of V2R.
        supports: SUPPORT
