            description: 'Vasopressin normally acts on the principal cell through a single linear cascade:
              V2 receptor occupancy activates the stimulatory G protein Gs, Gs activates adenylyl cyclase,
              cAMP rises, and cAMP activates protein kinase A. With no functional receptor at the membrane
              the cascade has no input. Note what is intact: the hormone, the G protein, the cyclase and
              PKA itself are all normal, which is the reason every experimental strategy for XNDI has
              aimed at re-entering the cascade below the receptor.'
            biological_scale: CELLULAR
