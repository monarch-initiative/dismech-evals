      - /disease_term
    evidence_metadata:
      reference: PMID:31928727
      reference_title: 'Misfolding of vasopressin receptors: biased agonist pharmacochaperones as potential
        therapeutics.'
      evidence_source: OTHER
      explanation: The current form of the proposal - a biased agonist that chaperones and signals through
        Gs without recruiting arrestin, so the desensitization problem above does not arise. Note the
        verb is "represent a potential", so this is a proposal and not a result.
