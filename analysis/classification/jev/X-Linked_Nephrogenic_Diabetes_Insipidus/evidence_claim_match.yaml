  48eb6553e942208a4c58f700fc10b94fbed7149778f8f458110c237e4be70bda:
    claim:
      about:
        disease:
          name: X-Linked Nephrogenic Diabetes Insipidus
          disease_term:
            preferred_term: X-linked nephrogenic diabetes insipidus
            term:
              id: MONDO:0010581
              label: diabetes insipidus, nephrogenic, X-linked
        context: []
      assertion_type: AnimalModel
      assertion:
        name: V2R Glu242stop knock-in mouse
        species: Mouse
        genotype: Avpr2 Glu242stop (nonsense allele knocked in by targeted mutagenesis in ES cells)
        description: 'The defining animal model, and deliberately constructed as a disease model rather
          than a convenience knockout: the allele introduced is a nonsense variant known to cause XNDI
          in humans. Hemizygous males reproduce the severe human infantile phenotype closely - low basal
          urine osmolality, inability to concentrate, enlargement of the renal pelvic space, failure to
          thrive, and death in the first postnatal week from hypernatraemic dehydration - which is what
          an untreated human infant is at risk of. Heterozygous females are the second useful result:
          they grow normally but have reduced concentrating ability with polyuria and polydipsia, the
          murine counterpart of the symptomatic human heterozygote. The model also provides the cleanest
          available evidence that aquaporin-2 is not the problem in this disease: basal AQP2 expression
          was unaffected by loss of functional V2 receptors.'
        publication: PMID:11104789
        modeled_mechanisms:
        - target: Absent or Truncated V2 Receptor Protein
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: MOLECULAR
          description: Glu242stop is a nonsense allele, so this model belongs to the protein-expression
            class and this is the node it enters the pathograph at. Linked explicitly because the alternative
            - entering at the cascade node - would leave the model's own variant class unrepresented,
            which is the gap this link closes.
          limitations: The study reports the allele and the resulting whole-animal phenotype; it does
            not show absence of receptor protein in these mice directly, so the class assignment rests
            on the nature of the allele rather than on a Western blot in this model.
        - target: Loss of Vasopressin-Stimulated cAMP and PKA Signalling
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: ORGANISM
          description: A human XNDI nonsense allele at the orthologous position, producing the expected
            receptor-level loss of function in the intact animal.
          limitations: The model observes the whole organism, so the receptor-level signalling failure
            itself is inferred from the physiology rather than measured in this report; cAMP and PKA were
            not assayed here.
          readouts:
          - name: Basal urine osmolality
            target: Loss of Vasopressin-Stimulated cAMP and PKA Signalling
            direction: DECREASED
            interpretation: The functional consequence of the absent receptor signal, measured at the
              level of the organism's urine.
        - target: Failure of Aquaporin-2 Phosphorylation and Apical Insertion
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Supports the node in its important negative sense - that AQP2 abundance is not
            reduced, so the lesion is regulatory - without demonstrating the positive claim about phosphorylation
            and apical trafficking.
          limitations: Only basal AQP2 expression levels were assessed. Phosphorylation state and subcellular
            redistribution after a vasopressin stimulus, which are the actual content of this node, were
            not measured, so the model speaks to abundance rather than to trafficking.
          readouts:
          - name: Basal aquaporin-2 protein abundance
            target: Failure of Aquaporin-2 Phosphorylation and Apical Insertion
            direction: UNCHANGED
            interpretation: 'A genuine negative result, and the one that matters: the water channel is
              present in normal amounts, so the defect is in its regulation.'
        - target: Obligatory Hypotonic Free Water Loss
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: ORGANISM
          description: Hemizygous males died of hypernatraemic dehydration within the first postnatal
            week, and heterozygous females showed polyuria and polydipsia with reduced concentrating ability.
          limitations: The hemizygous phenotype is more severe than treated human disease and lethal within
            a week, so it models the untreated infantile extreme rather than the clinical course of a
            managed patient.
          readouts:
          - name: Polyuria and polydipsia in heterozygous females
            target: Obligatory Hypotonic Free Water Loss
            direction: INCREASED
            interpretation: The murine counterpart of the symptomatic human female heterozygote, with
              the same partial phenotype.
      selected_evidence:
        snippet: These pups also exhibited an enlargement of renal pelvic space, failed to thrive, and
          died within the first week after birth due to hypernatremic dehydration.
        supports: SUPPORT
