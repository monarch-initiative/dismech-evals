      assertion_type: Treatment
      assertion:
        name: Urinary Tract Management and Bladder Drainage
        description: 'Management of the mechanical complication rather than the metabolic one. The principles
          are to reduce urine output with drug and dietary therapy, void on a schedule - two-hourly is
          the interval recommended - and catheterise when post-void residuals become significant. In severe
          cases cystostomy button drainage has been used. The point of the scheduled voiding is prevention:
          it is offered as a way of preventing or reducing the tract dilatation rather than treating it
          once established.'
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: bladder catheterisation and timed voiding
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: Reduction of urine production by drug therapy and voiding at two-hour intervals may prevent
          or reduce serious renal, ureteral, or bladder dilatation.
        supports: SUPPORT
