        rate_per_100000: 0.88
        rate_denominator: LIVE_BIRTHS
        notes: '8.8 per million male live births. The denominator is male live births, not all live births,
          which matters for an X-linked disease: the rate among all newborns is about half this. The same
          report notes a regional rate more than six times higher in Nova Scotia and New Brunswick, a
          founder effect rather than a different population estimate, so the Quebec figure is the one
          quoted here.'
      selected_evidence:
        snippet: The estimate of about 8.8 per million male live births of the incidence of X-linked NDI
          in the province of Quebec, Canada may be representative of the general population except in
          Nova Scotia and New Brunswick, where the incidence is more than six times higher.
        supports: SUPPORT
