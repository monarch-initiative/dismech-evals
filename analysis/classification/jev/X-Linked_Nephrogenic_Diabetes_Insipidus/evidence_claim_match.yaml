  a03917f7b441b8700865aa1591dfec0cc83fcfe243eb09b119b6508c8ea4ab27:
    claim:
      about:
        disease:
          name: X-Linked Nephrogenic Diabetes Insipidus
          disease_term:
            preferred_term: X-linked nephrogenic diabetes insipidus
            term:
              id: MONDO:0010581
              label: diabetes insipidus, nephrogenic, X-linked
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: xndi_pharmacochaperone_translation
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why has pharmacochaperone rescue of ER-retained V2 receptor mutants not translated into
          a human treatment, two decades after the cell-based proof of principle?
        attaches_to:
        - pathophysiology#Endoplasmic Reticulum Retention of Misfolded V2 Receptor
        - treatments#Thiazide Diuretic
        rationale: 'The mechanistic argument is unusually clean: most pathogenic AVPR2 variants retain
          a functional receptor in the wrong compartment, cell-permeable non-peptide ligands restore its
          membrane delivery in polarized cells, and the pharmacology even discriminates which ligands
          could work at achievable concentrations. Two distinct obstacles appear in the cited work rather
          than one. First, a pharmacochaperone that is an antagonist must be displaced by vasopressin
          to be useful, so affinity has to be high enough to chaperone and low enough to release - a narrow
          window. The non-peptide agonist route was proposed to escape that, but the same ligand also
          desensitizes the rescued receptor, and whether the chaperone effect outlasts the desensitization
          is a speculation in the source, not a result. The current proposal is a biased agonist that
          chaperones the receptor and then signals only through Gs without recruiting arrestin, which
          would sidestep the desensitization problem - but that too is offered as a potential treatment
          rather than a demonstrated one. Second, and more simply, the review of pharmacological strategies
          concludes that nothing has yet been established as causally improving symptoms or quality of
          life in patients, which is a statement about the whole field including these agents. The entry
          therefore records the thiazide regimen as the treatment and pharmacochaperones as mechanism,
          not therapy.'
      selected_evidence:
        snippet: These compounds, particularly small-molecule biased agonists which elicit the V2-induced
          Gs protein-dependent signaling pathway, but not V2-related arrestin-dependent cell responses,
          represent a potential therapeutic treatment of this X-linked genetic pathology.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/2
      context_paths:
