            term:
              id: MONDO:0010581
              label: diabetes insipidus, nephrogenic, X-linked
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Sustained High Urinary Tract Flow
        description: 'A mechanical consequence of the urine output, and the one most specific to long-standing
          untreated disease. Decades of very high flow through an anatomically normal urinary tract dilate
          it: the bladder becomes large and trabeculated, the ureters dilate, and the renal pelvis follows,
          all without any obstruction at the bladder outlet. The dilatation is not harmless - poor drainage
          of a huge compliant bladder raises residual volume, predisposes to infection, and can itself
          impair renal function.'
        biological_scale: ORGANISM
      selected_evidence:
        snippet: The high flow states caused the bladder to become trabeculated in the absence of infravesical
          obstruction. Urodynamics have shown the bladder itself to be compliant, but drainage is poor
          leading to further renal impairment and overflow incontinence.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/9
      evidence_path: /pathophysiology/9/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22498392
      reference_title: Nonobstructive urinary tract dilatation in children with diabetes insipidus.
      evidence_source: HUMAN_CLINICAL
      explanation: States the causal attribution to flow rather than obstruction, and the consequence
        for renal function, in the series that made the point.
