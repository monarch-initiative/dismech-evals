  07ea04efe79a019f03e311dc5458baab66e088dfc2ab89deef05aebc48ed10ba:
    claim:
      about:
        disease:
          name: X-Linked Nephrogenic Diabetes Insipidus
          disease_term:
            preferred_term: X-linked nephrogenic diabetes insipidus
            term:
              id: MONDO:0010581
              label: diabetes insipidus, nephrogenic, X-linked
        context: []
      assertion_type: Genetic
      assertion:
        name: AVPR2
        gene_term:
          preferred_term: AVPR2
          term:
            id: hgnc:897
            label: AVPR2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        frequency: accounts for about 90 per cent of hereditary nephrogenic diabetes insipidus
        notes: 'AVPR2 at Xq28 is the sole gene for this entry, and it accounts for the large majority
          of hereditary nephrogenic diabetes insipidus overall: about 90 per cent, against roughly 9 per
          cent autosomal recessive and 1 per cent autosomal dominant AQP2 disease. The allelic spectrum
          is broad and mostly private - 82 distinct variants across 117 families - and the recurrences
          are independent events rather than a founder effect, so a new family generally means a new variant.
          Genotype does not predict phenotype usefully: the 30-patient clinical series found no clear
          clinical-genetic relationship beyond a possibly milder course with one variant. More than 200
          AVPR2 variants have been linked to this disease and to the gain-of-function counterpart, nephrogenic
          syndrome of inappropriate antidiuresis. On variant class: the types represented are missense,
          nonsense, small insertions and deletions, large deletions and complex rearrangements, and functionally
          they sort into the three mechanistic classes modelled as the three routes out of the lesion
          node - absent or truncated protein, ER retention of a misfolded receptor, and a surface receptor
          that cannot signal. Two things are deliberately not asserted. No proportion is given for which
          class is commonest: the figure of roughly 70 per cent for the ER-retention class circulates
          widely and appears in the deep-research report for this entry, but no source cited here measures
          it, and the strongest citable statement is the weaker one that the function of most mutant receptors
          is not itself disturbed. Nor is a proportion given for each sequence-variant type, for the same
          reason.'
      selected_evidence:
        snippet: Hereditary NDI is most commonly inherited in an X-linked manner (~90% of individuals).
          Hereditary NDI can also be inherited in an autosomal recessive manner (~9% of individuals) or
          in an autosomal dominant manner (~1% of individuals).
        supports: SUPPORT
