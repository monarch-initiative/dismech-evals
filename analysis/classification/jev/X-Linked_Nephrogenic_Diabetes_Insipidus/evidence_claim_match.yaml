  be63fb2ef66caaf57f5fbfa2c70a0498428ce5d50e22258a59ffe377d943473c:
    claim:
      about:
        disease:
          name: X-Linked Nephrogenic Diabetes Insipidus
          disease_term:
            preferred_term: X-linked nephrogenic diabetes insipidus
            term:
              id: MONDO:0010581
              label: diabetes insipidus, nephrogenic, X-linked
        context: []
      assertion_type: Treatment
      assertion:
        name: Thiazide Diuretic
        description: 'The counterintuitive mainstay: a diuretic given to reduce urine output. Used with
          a low-sodium diet it reduces polyuria by up to 50 per cent without causing hypernatraemia, and
          it is the one drug on which paediatric nephrologists agree - 93 per cent of surveyed providers
          prescribe a thiazide. The mechanism is indirect and does not involve the collecting duct at
          all: the thiazide causes natriuresis, sodium depletion follows, and the resulting fall in effective
          renal plasma flow and glomerular filtration rate reduces distal delivery. Work in Brattleboro
          rats showed the antidiuresis disappears when sodium depletion is prevented, and that under those
          conditions urine volume actually rises - evidence that the antidiuretic effect is entirely secondary
          to volume contraction, with an additional suggestion of reduced proximal fluid reabsorption.
          Note the model caveat: those experiments used the hypothalamic (central) form of the disease,
          not a receptor-level one. On efficacy: serum sodium normalised in every patient of one long-term
          cohort on hydrochlorothiazide plus amiloride, but polyuria and polydipsia persisted in all of
          them throughout a median of 16.9 years - which is the honest summary of what this regimen achieves.
          It protects against hypernatraemia; it does not fix the water loss.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: hydrochlorothiazide
            term:
              id: CHEBI:5778
              label: hydrochlorothiazide
      selected_evidence:
        snippet: reduction of polyuria (and thus polydipsia) up to 50% without inducing hypernatremia
          by use of a thiazide diuretic (e.g., hydrochlorothiazide, chlorothiazide) often used in combination
          with either amiloride (a potassium-sparing diuretic) or indomethacin; dietary restriction of
          sodium
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20301356
      reference_title: Hereditary Nephrogenic Diabetes Insipidus.
      evidence_source: OTHER
      explanation: Quantifies the achievable benefit, names the agents, and records that the thiazide
        is normally combined with amiloride or indomethacin and paired with sodium restriction.
