  153229ded87ba04b41fd4a1ad44f677f229652a44d25dd5b5b49b33857952533:
    claim:
      about:
        disease:
          name: X-Linked Nephrogenic Diabetes Insipidus
          disease_term:
            preferred_term: X-linked nephrogenic diabetes insipidus
            term:
              id: MONDO:0010581
              label: diabetes insipidus, nephrogenic, X-linked
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Avpr2-deficient rat (rGONAD)
        species: Rat
        genotype: Avpr2 knockout, generated by rat Genome-editing via Oviductal Nucleic Acid Delivery
        description: 'The model that supplies what the mouse could not. Unlike the constitutive Avpr2-null
          mouse, these rats survive weaning under normal rearing, so the chronic consequences are observable:
          polydipsia, polyuria, growth retardation, and hydronephrosis-like kidneys. Two of its findings
          bear directly on this entry''s pathograph. First, aquaporin-2 was retained in the cytoplasm
          of collecting duct cells with its phosphorylation suppressed - a direct measurement of the node
          about trafficking and phosphorylation, which the mouse study could only address as preserved
          abundance. Second, the hydronephrosis-like kidneys showed no glomerular or tubular damage, which
          is the experimental version of the clinical claim that the tract dilatation is mechanical rather
          than a primary nephropathy. Hydrochlorothiazide reduced urine volume and improved urine osmolality
          in the model, so it also reproduces the therapeutic response.'
        publication: PMID:40102322
        modeled_mechanisms:
        - target: Failure of Aquaporin-2 Phosphorylation and Apical Insertion
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: CELLULAR
          description: Directly measures both halves of this node in collecting duct cells - aquaporin-2
            held in the cytoplasm, and its phosphorylation suppressed.
          limitations: A whole-gene knockout rather than a human misfolding allele, so it models the consequence
            of absent receptor function and not the ER-retention route that produces it in most patients.
            Phosphorylation was reported as suppressed without the site-level detail that would tie it
            to Ser256 specifically.
          readouts:
          - name: Subcellular localization and phosphorylation of aquaporin-2 in collecting duct cells
            target: Failure of Aquaporin-2 Phosphorylation and Apical Insertion
            direction: DECREASED
            interpretation: Apical delivery and phosphorylation both reduced, with the channel held in
              the cytoplasm - the node's claim, measured.
        - target: Sustained High Urinary Tract Flow
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Hydronephrosis-like kidneys developed with no glomerular or tubular damage, which
            is the mechanical-not-nephropathic claim this node makes.
          limitations: Rodent urinary tract anatomy and lifespan differ from the human course, where the
            dilatation accumulates over decades; and the absence of glomerular or tubular damage is reported
            at the timepoint examined rather than across the animal's life.
          readouts:
          - name: Renal pelvic dilatation with preserved glomerular and tubular histology
            target: Sustained High Urinary Tract Flow
            direction: INCREASED
            interpretation: Dilatation present, parenchymal injury absent - the combination that distinguishes
              a flow effect from a nephropathy.
      selected_evidence:
        snippet: Avpr2-deficient rats were born and weaned under normal rearing conditions and exhibited
          symptoms similar to those of human congenital NDI, such as polydipsia, polyuria, and growth
          retardation.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/1
      evidence_path: /animal_models/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40102322
      reference_title: Construction of arginine vasopressin receptor 2-deficient rats by the rGONAD method.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes survival past weaning and phenotypic similarity, which together are what
        make this model usable for the chronic consequences.
