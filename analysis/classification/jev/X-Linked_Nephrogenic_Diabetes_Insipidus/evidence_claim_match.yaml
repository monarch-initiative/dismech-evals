      assertion_type: Biochemical
      assertion:
        name: Urine osmolality
        presence: Decreased
        context: 'The measurement that defines the disease and the one that does not move when desmopressin
          is given. In symptomatic AVPR2 heterozygous females maximal urine osmolality did not exceed
          200 mosmol/kg, against a normal maximum several times that, and the same non-response was demonstrable
          outside the kidney in two of them. No reference interval is curated here: no citable record
          in this round gave one, and the 200 mosmol/kg figure is a reported ceiling in three patients,
          not an interval.'
        biomarker_term:
          preferred_term: urine osmolality
          term:
            id: NCIT:C74801
            label: Osmolality Measurement
        loinc_term:
          id: LOINC:2695-5
          label: Osmolality of Urine
        notes: 'The bound code is the plain quantitative urine osmolality, which is the marker as this
          entry uses it. The LOINC Part that looks like the specimen-level identity, LOINC:LP69215-9 Osmolality.urine,
          is not it: that Part is the numerator component of the urine-to-serum osmolality ratio, and
          in release 2.83 it appears in exactly one code, LOINC:48149-9 Osmolality.urine/Osmolality.serum.
          The release''s other urine osmolality codes are qualified by collection period, calculation
          method, a water-deprivation or vasopressin challenge, or specimen order, none of which this
          marker fixes.'
        readouts:
        - target: Failure of Medullary Countercurrent Urine Concentration
          relationship: READOUT_OF
          direction: THRESHOLD_DEPENDENT
          endpoint_context: DIAGNOSTIC
          interpretation: Directly reports the concentrating failure this node describes, and is threshold-dependent
            rather than simply low because the diagnostic question is the maximum achievable after water
            deprivation or desmopressin, not a single value.
      selected_evidence:
        snippet: Nephrogenic diabetes insipidus (NDI) is characterized by impaired urinary concentrating
          ability, despite normal or elevated plasma concentrations of the antidiuretic hormone, arginine
          vasopressin (AVP).
        supports: SUPPORT
