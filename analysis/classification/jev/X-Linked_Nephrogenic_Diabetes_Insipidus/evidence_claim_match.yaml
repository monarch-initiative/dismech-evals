        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Aquaporin-2 Phosphorylation and Apical Insertion
        description: Aquaporin-2 is the vasopressin-regulated water channel of the principal cell, and
          it is regulated by being moved. PKA phosphorylates AQP2 at Ser256 and the channel is redistributed
          from intracellular vesicles into the apical membrane, where it makes the luminal surface water-permeable.
          In XNDI the AQP2 protein itself is normal - that is the defining feature separating this disease
          from the autosomal AQP2-mutation form - and the failure is purely one of regulation. It is also
          the reason the whole therapeutic literature is framed as "reach AQP2 without the receptor".
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: renal collecting duct principal cell
          term:
            id: CL:1001431
            label: kidney collecting duct principal cell
        cellular_components:
        - preferred_term: apical plasma membrane of the principal cell
          term:
            id: GO:0016324
            label: apical plasma membrane
        biological_processes:
        - preferred_term: aquaporin-2 delivery to the apical plasma membrane
          modifier: DECREASED
          term:
            id: GO:0072659
            label: protein localization to plasma membrane
        - preferred_term: regulation of aquaporin-2 water channel activity
          modifier: DECREASED
          term:
            id: GO:1902427
            label: regulation of water channel activity
      selected_evidence:
        snippet: Our data suggest that cAMP stimulates water permeability of AQP-CD by phosphorylation.
