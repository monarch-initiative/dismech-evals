        frequency: OCCASIONAL
        description: 'A late, largely preventable complication, and the strongest argument for treating
          this disease early rather than symptomatically. In a 66-child multicentre cohort, 23 per cent
          had reached CKD stage 2 or higher by a median age of six years. The clearest illustration is
          a single family reported in 2024: the 6-month-old proband started on hydrochlorothiazide did
          well, while his maternal grandfather, who carried the same M272R variant and was never diagnosed
          or treated, had chronic kidney disease, severe bilateral hydronephrosis, hypertension and severe
          bladder dysfunction. Note that the one long-term cohort with nearly 17 years of follow-up on
          treatment reported renal function stable throughout, so this is an outcome of undertreated disease
          rather than an inevitability.'
        phenotype_term:
          preferred_term: Chronic kidney disease
