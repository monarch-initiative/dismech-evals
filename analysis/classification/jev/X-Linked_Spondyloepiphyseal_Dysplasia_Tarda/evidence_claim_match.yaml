            term:
              id: MONDO:0010737
              label: spondyloepiphyseal dysplasia tarda, X-linked
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Absent or Misfolded Sedlin
        biological_scale: MOLECULAR
        description: 'Two distinct routes to the same endpoint. Truncating and splice alleles produce
          no protein. The missense substitutions S73L, F83S and V130D misfold and are degraded by the
          proteasome, which is why proteasome inhibition restores their expression. D47Y is the exception
          that proves the rule: it folds normally and is expressed, but binds the TRAPP subunit Bet3 with
          altered affinity, so it disrupts TRAPP dynamics rather than protein abundance.'
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
      selected_evidence:
        snippet: The D47Y mutant was expressed similarly to the wild-type, but the S73L, F83S and V130D
          mutants showed particularly low levels of expression that were rescued in the presence of the
          proteasome inhibitor MG132 (benzyloxycarbonyl-leucylleucylleucinal).
        supports: SUPPORT
