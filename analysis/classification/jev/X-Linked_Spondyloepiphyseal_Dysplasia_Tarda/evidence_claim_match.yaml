        prompt: Does the D47Y allele cause SEDT by the same route as the null alleles?
        rationale: Every other characterised allele removes sedlin, by truncation, splicing or proteasomal
          degradation. D47Y is expressed at wild-type levels and folds normally; what changes is its affinity
          for Bet3. If it causes the same disease, then altered TRAPP dynamics is sufficient, and the
          entry's single loss-of-function chain is an oversimplification for at least one allele. The
          pathophysiology nodes here are written for the loss-of-function majority and this allele is
          flagged rather than modelled separately, since no D47Y-specific procollagen-export experiment
          has been reported.
      selected_evidence:
        snippet: Two independent assays showed that the D47Y mutation resulted in an increased affinity
          for the transport protein particle component Bet3 compared with the wild-type sedlin.
        supports: SUPPORT
