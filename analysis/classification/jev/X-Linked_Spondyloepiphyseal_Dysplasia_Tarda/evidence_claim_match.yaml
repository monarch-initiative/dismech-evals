            preferred_term: spondyloepiphyseal dysplasia tarda, X-linked
            term:
              id: MONDO:0010737
              label: spondyloepiphyseal dysplasia tarda, X-linked
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sedt_tissue_restriction_of_a_housekeeping_defect
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Impaired Sar1 Cycling and COPII Megacarrier Formation
        - pathophysiology#Defective Growth Plate Chondrogenesis
        prompt: Why is a defect in a ubiquitous TRAPP subunit confined to the skeleton?
        rationale: 'Sedlin is the Trs20 adaptor required for assembly of TRAPP II and TRAPP III, and TRAPP
          serves general secretion and autophagy in every cell. A complete loss of that function should
          not produce a skeleton-restricted, late-onset, otherwise-normal phenotype. The standard explanation
          is cargo-specific: only procollagen needs megacarriers, so only cells with an exceptional procollagen
          export load fail. That explanation is plausible and fits the data, but it has not been tested
          against the alternative that residual TRAPP function suffices elsewhere, and no tissue-specific
          conditional model has been reported. Whether autophagy is measurably affected in SEDT patient
          cells is, as far as the sources here go, unasked.'
        proposed_experiments:
        - experiment_id: sedt_autophagy_in_patient_cells
          name: Autophagic flux in TRAPPC2-null patient cells
          description: Measure autophagic flux in patient fibroblasts or chondrocytes against controls,
            to test whether the TRAPP III arm is functionally spared or merely clinically silent.
          readouts:
          - name: Autophagic flux
            target: pathophysiology#Absent or Misfolded Sedlin
            direction: UNCHANGED
            interpretation: Unchanged flux would support cargo-specific vulnerability; reduced flux would
              mean the tissue restriction needs a different explanation.
      selected_evidence:
        snippet: Another small subunit, Trs20/Sedlin, is an adaptor required for the association of core
          TRAPP with larger subunits to form TRAPP II and TRAPP III.
        supports: SUPPORT
