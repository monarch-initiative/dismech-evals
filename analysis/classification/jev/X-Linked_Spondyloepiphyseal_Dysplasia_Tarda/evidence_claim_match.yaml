          modifier: DECREASED
      selected_evidence:
        snippet: Sedlin bound and promoted efficient cycling of Sar1, a guanosine triphosphatase that
          can constrict membranes, and thus allowed nascent carriers to grow and incorporate PC prefibrils.
        supports: SUPPORT
