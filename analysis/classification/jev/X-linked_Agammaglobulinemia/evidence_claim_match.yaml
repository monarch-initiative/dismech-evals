        description: BTK (Bruton tyrosine kinase) is a cytoplasmic tyrosine kinase expressed throughout
          the B lineage that transduces signals from the pre-B-cell and mature B-cell receptors. Loss-of-function
          BTK variants reduce or abolish kinase expression and activity, disabling the signaling pathways
          required for B-cell expansion and maturation.
        cell_types:
        - preferred_term: Precursor B cell
          term:
            id: CL:0000817
            label: precursor B cell
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
        biological_processes:
        - preferred_term: B Cell Receptor Signaling
          term:
            id: GO:0050853
            label: B cell receptor signaling pathway
      selected_evidence:
        snippet: Loss of kinase activity results in the human immunodeficiency, X-linked agammaglobulinemia,
          characterized by a failure to produce B cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
