        description: Diagnosis is usually prompted by recurrent infection. In the US registry, a positive
          family history lowered the mean age at diagnosis from 5.37 to 2.59 years, yet only about a third
          of boys with a family history known at birth were diagnosed before symptoms — a persistent missed
          opportunity for pre-symptomatic diagnosis. Emerging screening measurements (KREC levels, serum
          BCMA) may allow earlier identification.
