      assertion_type: DifferentialDiagnosis
      assertion:
        name: Autosomal agammaglobulinemia
        description: The autosomal recessive and dominant forms of congenital agammaglobulinemia (IGHM,
          IGLL1, CD79A, CD79B, BLNK and other loci) reproduce the same pre-B developmental block, absent
          B cells and panhypogammaglobulinemia without involving BTK; they account for the roughly 15%
          of congenital agammaglobulinemia that is not XLA. Curated separately in dismech as Autosomal_Agammaglobulinemia.
        disease_term:
          preferred_term: autosomal agammaglobulinemia
          term:
            id: MONDO:0011096
            label: autosomal agammaglobulinemia
        distinguishing_features:
        - Affects females as well as males; consanguinity is common in the recessive forms
        - No BTK pathogenic variant; biallelic (or de novo dominant) variants in pre-BCR or B-lymphopoiesis
          genes instead
        - Earlier onset and typically more severe clinical features than XLA
      selected_evidence:
        snippet: While the most common cause of congenital agammaglobulinemia is X-linked agammaglobulinemia
          (XLA), accounting for approximately 85% of cases, other genetic forms of agammaglobulinemia
          have been identified.
        supports: SUPPORT
