        name: Unidentified Sulfated Substrate Accumulates or Fails to Be Processed
        biological_scale: MOLECULAR
        description: 'An explicitly unresolved node. ARSL''s physiological substrate has not been identified,
          so the step between the enzyme deficiency and the cartilage phenotype is empty. It is modelled
          rather than omitted because the shape of the gap matters: the warfarin sensitivity of the enzyme
          and the vitamin-K-deficiency phenocopies both point towards a vitamin-K-dependent process, and
          that is the leading hypothesis for what should occupy this node.'
      selected_evidence:
        snippet: This study supports heterogeneity for CDPX1-like phenotypes and sorting these out will
          help to define the biological pathway and genetic contributors.
        supports: SUPPORT
