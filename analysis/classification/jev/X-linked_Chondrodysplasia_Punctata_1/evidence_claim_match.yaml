      assertion_type: Discussion
      assertion:
        discussion_id: bcdp_entity_status
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - disease#X-linked Chondrodysplasia Punctata 1
        - differential_diagnoses#Vitamin K deficiency and maternal autoimmune phenocopies of brachytelephalangic
          CDP
        prompt: Is "brachytelephalangic chondrodysplasia punctata" a disease, or a radiographic convergence
          point reached by an inherited sulfatase deficiency and by several unrelated maternal-fetal insults?
        rationale: This is a nosological question with practical teeth. The ISDS nosology lists the ARSL-related
          entity as a single row, and this dismech entry follows it - but the clinical literature reports
          that most patients meeting the clinical criteria have no ARSL variant, that examination cannot
          separate the genetic from the acquired cases, and in one report that the pattern "is most probably
          not a diagnostic entity". If that view is right, the useful dismech object might eventually
          be a grouping over the convergent causes rather than a disease entry per cause. dismech keeps
          the gene-defined entry because that is what the nosology lists and what MONDO:0010555 denotes,
          and records the acquired routes as differentials rather than as subtypes, but the boundary is
          not settled.
      selected_evidence:
        snippet: This study supports heterogeneity for CDPX1-like phenotypes and sorting these out will
          help to define the biological pathway and genetic contributors.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
