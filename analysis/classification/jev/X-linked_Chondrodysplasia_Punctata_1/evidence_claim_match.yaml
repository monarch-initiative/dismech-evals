        biological_scale: MOLECULAR
        description: 'Recombinant ARSL expressed in COS cells yields an arylsulfatase activity that is
          inhibited by warfarin. This is not a feature of the disease so much as the bridge between the
          genetic disorder and its most important phenocopy: a coumarin taken by the mother during a critical
          window can pharmacologically produce the same enzyme deficiency the mutation produces genetically.
          It is modelled as its own node because it is the mechanistic claim that unifies CDPX1 with warfarin
          embryopathy and, more speculatively, with the vitamin-K-deficiency phenocopies.'
      selected_evidence:
        snippet: Expression of this gene in COS cells resulted in a heat-labile arylsulfatase activity
          that is inhibited by warfarin.
