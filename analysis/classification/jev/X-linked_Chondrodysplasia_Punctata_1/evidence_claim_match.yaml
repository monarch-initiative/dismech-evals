              It is modelled rather than omitted because the shape of the gap matters: the warfarin sensitivity
              of the enzyme and the vitamin-K-deficiency phenocopies both point towards a vitamin-K-dependent
              process, and that is the leading hypothesis for what should occupy this node.'
