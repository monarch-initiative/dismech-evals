      assertion_type: ProgressionInfo
      assertion:
        phase: Childhood - radiographic improvement with persisting cervical spine risk
        notes: The skeletal findings improve by adulthood in most affected males, which is why the diagnosis
          is often missed or made late. Cervical spine instability runs against that trend and is the
          reason for interval flexion-extension imaging until growth is complete.
      selected_evidence:
        snippet: Although most affected males have minimal morbidity and skeletal findings that improve
          by adulthood, some have significant medical problems including respiratory involvement, cervical
          spine stenosis and instability, mixed conductive and sensorineural hearing loss, and intellectual
          disability.
        supports: SUPPORT
