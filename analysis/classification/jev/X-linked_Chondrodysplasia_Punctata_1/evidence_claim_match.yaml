      assertion_type: Discussion
      assertion:
        discussion_id: arsl_substrate_unknown
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Unidentified Sulfated Substrate Accumulates or Fails to Be Processed
        - pathophysiology#ARSL Arylsulfatase Deficiency
        prompt: What is the physiological substrate of ARSL, and what sulfated species links its loss
          to abnormal cartilage mineralization?
        rationale: 'The gene has been known since 1995 and the enzyme deficiency has been demonstrated
          directly in patients, yet neither the substrate nor the function of the enzyme has been identified.
          Every consequence follows from that: there is no biochemical diagnostic test, no metabolite
          to monitor, no target for therapy, and a pathophysiology node in this entry that can only be
          named negatively. The gap is unusual among the chondrodysplasia punctata group, where the peroxisomal
          and sterol-pathway members all have solved biochemistry and quantitative diagnostic assays.
          Two clues constrain the answer - the enzyme''s warfarin sensitivity, and the fact that early-gestation
          vitamin K deficiency phenocopies the disorder - which together point towards a vitamin-K-dependent
          process, but no candidate substrate has been confirmed.'
        proposed_experiments:
        - experiment_id: arsl_substrate_identification
          name: Substrate identification for ARSL
          description: Untargeted sulfatomic profiling of ARSL-deficient versus control chondrocytes or
            cartilage, with the warfarin-inhibited enzyme as a pharmacological comparator, to identify
            sulfated species that accumulate on loss of activity; candidates then tested as direct substrates
            of recombinant enzyme.
      selected_evidence:
        snippet: Neither the substrate nor function of the encoded warfarin-sensitive arylsulfatase has
          been identified and molecular analysis remains the only confirmatory diagnostic test.
        supports: SUPPORT
