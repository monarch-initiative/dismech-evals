      assertion:
        name: Vitamin K deficiency and maternal autoimmune phenocopies of brachytelephalangic CDP
        description: Early-gestation vitamin K deficiency and maternal autoimmune disease, notably systemic
          lupus erythematosus, produce the same brachytelephalangic picture. In the largest systematic
          series these accounted for most of the variant-negative patients, and the authors report few
          distinguishing features on examination. One report of a newborn with brachytelephalangic CDP,
          maternal SLE, and two unrelated de novo variants goes further and argues the radiographic pattern
          is not a diagnostic entity at all.
        distinguishing_features:
        - A maternal history of autoimmune disease or of a condition causing vitamin K deficiency
        - No ARSL variant is identifiable
        - Affected infants of either sex
      selected_evidence:
        snippet: The major clinical features in these patients are also present in a group now recognized
          as phenocopies, due to vitamin K deficiency in early gestation or maternal autoimmune disease.
        supports: SUPPORT
