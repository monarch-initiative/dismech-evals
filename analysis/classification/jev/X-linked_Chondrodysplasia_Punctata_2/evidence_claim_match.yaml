      assertion_type: ProgressionInfo
      assertion:
        phase: Infancy and childhood - scaling resolves into follicular atrophoderma
        notes: The ichthyotic scaling of the newborn gives way to linear and whorled atrophic patches
          centred on hair follicles, with coarse hair and scarring alopecia in the same distribution.
          The skin findings change character but keep the same clonal geometry, because the underlying
          mosaic is fixed.
      selected_evidence:
        snippet: linear or blotchy scaling ichthyosis in the newborn; later appearance of linear or whorled
          atrophic patches involving hair follicles (follicular atrophoderma); coarse hair with scarring
          alopecia; and cataracts.
        supports: SUPPORT
