              id: MONDO:0020603
              label: X-linked chondrodysplasia punctata 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sterol_to_stippling_route
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Accumulation of 8(9)-Cholestenol and 8-Dehydrocholesterol
        - pathophysiology#Cellular Cholesterol Deficiency
        prompt: Which arm of the dual lesion - cholesterol starvation or accumulation of the upstream
          sterols - actually produces the punctate cartilage calcification, and by what route?
        rationale: 'The enzymology of CDPX2 is settled and the sterol profile is diagnostic, but the step
          from either sterol abnormality to abnormal calcification of cartilage is not. The gene-discovery
          paper put it no more strongly than that the results "suggest a role for sterols in bone development",
          and that remains the state of the argument. The question is answerable in principle, because
          CHILD syndrome supplies a precedent: there, a topical trial separating cholesterol replacement
          from suppression of precursor flux showed that neither arm alone accounted for the skin phenotype.
          No equivalent dissection has been done for the CDPX2 skeleton, and the two mechanism edges in
          this entry are annotated as having unknown intermediates for that reason.'
      selected_evidence:
        snippet: Our results indicate that defects in sterol-delta8-isomerase cause CDPX2 and suggest
          a role for sterols in bone development.
        supports: SUPPORT
