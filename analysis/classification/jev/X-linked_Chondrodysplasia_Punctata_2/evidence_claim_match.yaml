      assertion_type: ProgressionInfo
      assertion:
        phase: Whole-lifespan severity range
        notes: CDPX2 has no single natural history. The same gene, and sometimes the same variant within
          one family, produces outcomes from fetal demise to an adult with no recognizable abnormality,
          because the phenotype is a function of the mosaic proportion rather than of the allele alone.
      selected_evidence:
        snippet: The findings in EBP-related X-linked chondrodysplasia punctata (EBP-CDPX) range from
          fetal demise with multiple malformations and severe growth deficiency to much milder manifestations,
          including females with no recognizable physical abnormalities.
        supports: SUPPORT
