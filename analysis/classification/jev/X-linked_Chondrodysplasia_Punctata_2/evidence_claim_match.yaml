        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Male Hemizygous Lethality
        biological_scale: ORGANISM
        description: 'A male carrying a null EBP allele on his single X has no enzyme-competent tissue
          and is typically lost in early gestation. The rule is not absolute, and the two documented escape
          routes are informative about the mechanism: post-zygotic mosaicism (or a supernumerary X) restores
          a competent clone population, while a hypomorphic allele leaves residual isomerase activity
          in every cell.'
      selected_evidence:
        snippet: Alternatively, affected males may exhibit a distinct phenotype if they are hemizygous
          for a hypomorphic allele of EBP.
        supports: SUPPORT
