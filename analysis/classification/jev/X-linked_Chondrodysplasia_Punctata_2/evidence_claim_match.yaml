        context:
        - path: /pathophysiology/0
          value:
            name: EBP Sterol-Delta8-Isomerase Deficiency
            biological_scale: MOLECULAR
            description: 'Loss-of-function variants in EBP abolish or reduce 3-beta-hydroxysteroid-delta8,delta7-isomerase
              activity, the step that moves the sterol double bond from position 8 to position 7 in the
              conversion of lanosterol to cholesterol. The enzymatic assignment was made in the reverse
              of the usual direction: the sterol profile of patients was characterized first and pointed
              at the isomerase, and the candidate gene was then found mutated in every proband tested.'
            genetic_context:
              functional_impact_category: LOSS_OF_FUNCTION
              variant_origin: GERMLINE
              zygosity: HETEROZYGOUS
              gene:
                preferred_term: EBP
                term:
                  id: hgnc:3133
                  label: EBP
              description: Heterozygous germline (or, in the surviving affected male, post-zygotic mosaic)
                loss-of-function variants. Missense alleles were shown to be functionally deficient by
                complementation in an isomerase-deficient yeast strain. Zygosity is recorded as heterozygous
                because that is the state in the affected female who constitutes at least 95% of live
                births; a hemizygous male with a null allele is generally not viable.
            molecular_functions:
            - preferred_term: sterol delta8-delta7 isomerase activity
              modifier: LOSS_OF_FUNCTION
              term:
                id: GO:0000247
                label: C-8 sterol isomerase activity
            biological_processes:
            - preferred_term: cholesterol biosynthesis
              modifier: DECREASED
              term:
                id: GO:0006695
                label: cholesterol biosynthetic process
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Cellular Cholesterol Deficiency
        description: The same block starves the cell of the pathway end product. Both arms of the lesion
          operate together, which is the general pattern of the post-squalene cholesterol-synthesis disorders.
        causal_link_type: DIRECT
      selected_evidence:
        snippet: Generally, inborn errors of cholesterol synthesis lead to both a deficiency of cholesterol
          and increased levels of potentially bioactive or toxic precursor sterols.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0/downstream/1
      evidence_path: /pathophysiology/0/downstream/1/evidence/0
      context_paths:
      - /name
      - /disease_term
      - /pathophysiology/0
    evidence_metadata:
      reference: PMID:20929975
      reference_title: Malformation syndromes caused by disorders of cholesterol synthesis.
      evidence_source: OTHER
      explanation: States the dual lesion that applies to this class of disorders, of which CDPX2 is one
        of the reviewed members.
