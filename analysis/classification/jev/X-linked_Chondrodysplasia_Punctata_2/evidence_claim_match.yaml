  2f953bf78a646cc77f8fa7e3a1079ffc2e9d09c0bf1ae40970f2b9cdb1822174:
    claim:
      about:
        disease:
          name: X-linked Chondrodysplasia Punctata 2
          disease_term:
            preferred_term: X-linked chondrodysplasia punctata 2
            term:
              id: MONDO:0020603
              label: X-linked chondrodysplasia punctata 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hypomorphic_male_entity
        kind: KNOWLEDGE_GAP
        status: RESOLVED
        attaches_to:
        - pathophysiology#Male Hemizygous Lethality
        - genetic#EBP
        prompt: Is the phenotype of a male hemizygous for a hypomorphic EBP allele a mild variant of CDPX2,
          or a separate X-linked recessive disorder that happens to share the gene?
        rationale: 'Resolved in favour of a separate entity. The male hypomorphic phenotype is now curated
          as MEND syndrome (Male EBP Disorder with Neurologic defects) at kb/disorders/MEND_Syndrome.yaml,
          bound to MONDO:0010498.

          Two distinct routes let a male with an EBP variant survive, and they predict different phenotypes.
          A mosaic male, or one with a null allele plus a supernumerary X, has enzyme-competent clones
          and presents like a female CDPX2 patient - and that male stays inside this entry. A male hemizygous
          for a constitutional hypomorphic allele has no competent clones anywhere but retains partial
          activity in all of them, giving a symmetrical, neurologically weighted phenotype rather than
          the Blaschko-linear, asymmetric one this entry describes. That is the split.

          What changed since this question was first recorded, and both premises it rested on were wrong.
          This rationale previously stated that "MONDO carries only MONDO:0020603": MONDO:0010498 (MEND
          syndrome) exists and is the term the separate entry uses. It also treated the evidence as "a
          single reported family": a 2025 review tabulates seven distinct EBP alleles across four unrelated
          families and eight sporadic patients. Either premise alone would have been enough to reopen
          the question.

          One factual correction to what this discussion previously asserted, because it now contradicts
          the MEND entry. The earlier text described the male hypomorphic phenotype as presenting "without
          the ichthyosis and stippling of CDPX2". That generalised from the single 2014 family, whose
          reported features were digital abnormalities, intellectual disability and short stature. Mild
          ichthyosis is documented in later MEND patients, and the MEND entry curates it. The distinction
          between the two disorders is the *pattern* of the skin and skeletal findings - symmetrical and
          often transient in MEND, Blaschko-linear with follicular atrophoderma and scarring alopecia
          in CDPX2 - not their presence or absence.

          What remains open is not the nosology but the biology: whether the two disorders sit on one
          activity continuum or differ in kind. That question belongs to the sterol-to-phenotype gap recorded
          separately, not here.'
        resolution_note: 'Resolved as a separate entity: the male hypomorphic phenotype is curated as
          MEND syndrome (kb/disorders/MEND_Syndrome.yaml, MONDO:0010498), while a mosaic male or one with
          a null allele plus a supernumerary X stays in this entry. The two disorders are distinguished
          by the pattern of skin and skeletal findings, not by their presence or absence. Whether they
          sit on one activity continuum remains open and is recorded in the sterol-to-phenotype gap instead.'
      selected_evidence:
        snippet: The molecular and biochemical evidence convincingly supports the pathogenicity and association
          of the p.I75N mutation with this newly described phenotype.
        supports: SUPPORT
