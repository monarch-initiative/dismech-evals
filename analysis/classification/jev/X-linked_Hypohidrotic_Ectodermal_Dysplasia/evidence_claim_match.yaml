      assertion_type: Treatment
      assertion:
        name: Genetic Counseling
        description: Explain X-linked transmission after identifying the familial EDA variant. A heterozygous
          mother has a 50% chance of transmitting the variant in each pregnancy; sons who inherit it are
          affected, while daughters who inherit it are heterozygous and may manifest features. An affected
          father transmits the variant to all daughters and no sons. Prenatal and preimplantation testing
          are possible once the familial variant is known.
        treatment_term:
          preferred_term: Genetic Counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: If the mother of a proband is heterozygous for an EDA pathogenic variant, the chance
          of the mother transmitting it in each pregnancy is 50%. If the father of the proband has an
          EDA pathogenic variant, he will transmit it to all his daughters and none of his sons. Males
          who inherit the pathogenic variant will be affected; females who inherit the pathogenic variant
          will be heterozygous and may show manifestations of ectodermal dysplasia.
        supports: SUPPORT
