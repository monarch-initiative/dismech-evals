      assertion_type: Inheritance
      assertion:
        name: X-linked
        description: EDA-related HED is inherited in an X-linked manner. Hemizygous males who inherit
          the familial pathogenic variant are affected; heterozygous females may manifest ectodermal-dysplasia
          features.
        inheritance_term:
          preferred_term: X-linked inheritance
          term:
            id: HP:0001417
            label: X-linked inheritance
      selected_evidence:
        snippet: If the mother of a proband is heterozygous for an EDA pathogenic variant, the chance
          of the mother transmitting it in each pregnancy is 50%. If the father of the proband has an
          EDA pathogenic variant, he will transmit it to all his daughters and none of his sons. Males
          who inherit the pathogenic variant will be affected; females who inherit the pathogenic variant
          will be heterozygous and may show manifestations of ectodermal dysplasia.
        supports: SUPPORT
