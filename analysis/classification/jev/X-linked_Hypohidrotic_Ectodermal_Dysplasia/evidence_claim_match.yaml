      assertion:
        phase: Lifelong complications
        age_range: Childhood through adulthood
        notes: Dental and appendage abnormalities persist, while respiratory, nasal, skin, and voice complications
          can require continuing supportive care across life.
      selected_evidence:
        snippet: the registry dataset confirmed a spectrum of life-long XLHED clinical complications including
          recurrent sinus infections (49% males, 52% females), nasal congestion often foul smelling and
          interfering with feeding (73% males, 27% females), eczema (66% males, 40% females), wheezing
          (66% males, 45% females), and a hoarse, raspy voice (67% males, 23% females).
        supports: SUPPORT
