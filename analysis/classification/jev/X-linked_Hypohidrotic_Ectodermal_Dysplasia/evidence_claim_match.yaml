      assertion_type: Treatment
      assertion:
        name: Prenatal EDA1 Replacement Therapy
        description: Investigational intra-amniotic recombinant EDA1 replacement has restored sweat gland
          development and inducible sweating in a small compassionate-use series. Six prenatally treated
          boys have been reported, with normal perspiration persisting for six years in the two oldest
          repeatedly treated participants; this remains an investigational approach under prospective
          study, not routine standard care.
        therapeutic_modality: PROTEIN_REPLACEMENT
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
        notes: Evidence is limited to small nonrandomized treated cohorts. The 2023 follow-up reports
          patent holdings and research funding related to the intervention.
      selected_evidence:
        snippet: We administered this protein intraamniotically to two affected human twins at gestational
          weeks 26 and 31 and to a single affected human fetus at gestational week 26; the infants, born
          in week 33 (twins) and week 39 (singleton), were able to sweat normally, and XLHED-related illness
          had not developed by 14 to 22 months of age.
        supports: SUPPORT
