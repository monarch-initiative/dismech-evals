              label: X-linked inheritance
        notes: 'Identification of a hemizygous pathogenic EDA variant confirms XLHED in an affected male.
          Heterozygous females can have manifestations. EDA alleles differ functionally: some genotypes
          are consistently associated with anhidrosis, whereas others retain enough EDA activity to permit
          measurable sweating. The entry does not assign variant-class frequencies because broad HED cohorts
          include genetically distinct EDAR- and EDARADD-related disease.'
        variants:
        - name: EDA alleles with absent versus residual activity
          description: Genotype-phenotype mapping in molecularly confirmed XLHED distinguishes EDA mutations
            consistently associated with anhidrosis from mutations that allow residual EDA-product activity
            and reduced, but detectable, sweating.
      selected_evidence:
        snippet: This XL-HED phenotype is associated with mutations in the gene encoding the transmembrane
          protein ectodysplasin-1 (EDA1), a member of the TNFα-related signaling pathway. The proteins
          from this pathway are involved in signal transduction from ectoderm to mesenchyme leading to
          the development of ectoderm-derived structures in the fetus such as hair, teeth, skin, nails,
          and eccrine sweat glands.
        supports: SUPPORT
