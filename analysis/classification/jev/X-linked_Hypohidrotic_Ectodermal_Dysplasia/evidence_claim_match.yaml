          were absent. Copy-number variations occurred in 23.1% (3/13) of EDA-positive cases, showing
          that the reported EDA-positive molecular findings were not limited to sequence variants. This
          cohort-specific proportion is not an XLHED population prevalence estimate.
        diagnosis_term:
          preferred_term: Molecular Analysis
          term:
            id: NCIT:C19770
            label: Molecular Analysis
      selected_evidence:
        snippet: When conducting molecular diagnostics for ED, opting for targeted sequencing of EDA/EDAR
          mutations is advisable for cases with classical symptoms, while WES is deemed an effective strategy
          for cases in which these symptoms are absent.
