      assertion_type: ProgressionInfo
      assertion:
        phase: Infancy to childhood recognition
        age_range: Infancy through childhood
        notes: The ectodermal defects are congenital, but the cardinal triad often becomes clinically
          obvious during childhood. Before families learn temperature-control measures, markedly deficient
          sweating can cause episodes of hyperthermia.
      selected_evidence:
        snippet: The cardinal features of classic HED become obvious during childhood. The scalp hair
          is thin, lightly pigmented, and slow growing. Sweating, although present, is greatly deficient,
          leading to episodes of hyperthermia until the affected individual or family acquires experience
          with environmental modifications to control temperature.
        supports: SUPPORT
