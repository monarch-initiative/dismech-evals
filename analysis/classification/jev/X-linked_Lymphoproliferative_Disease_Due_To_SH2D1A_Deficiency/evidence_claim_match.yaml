  f32ecf4f66ab8e7272949c0369a637b7e5ce53f79df86dac0b4c6a2f044e5fc9:
    claim:
      about:
        disease:
          name: X-linked Lymphoproliferative Disease Due To SH2D1A Deficiency
          disease_term:
            preferred_term: X-linked lymphoproliferative disease type 1 (SAP deficiency)
            term:
              id: MONDO:0024551
              label: X-linked lymphoproliferative disease due to SH2D1A deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective EBV-Specific CD8+ T Cell Cytotoxicity
        biological_scale: CELLULAR
        description: XLP1 patients who survive primary EBV infection mount numerically normal EBV-specific
          CD8+ T-cell responses, but those T cells are selectively unable to recognize SLAM-ligand-positive
          targets. CD8+ clones kill EBV-antigen-expressing targets that lack SLAM ligands, yet fail against
          EBV-transformed lymphoblastoid cell lines; blocking CD244 and NTB-A restores recognition. This
          selectivity is the best available explanation for why XLP1 confers susceptibility to EBV specifically
          rather than to viruses in general — EBV's tropism is for the very B lymphocytes that carry the
          inhibitory ligands.
        cell_types:
        - preferred_term: EBV-specific CD8+ cytotoxic T cell
          term:
            id: CL:0000625
            label: CD8-positive, alpha-beta T cell
        biological_processes:
        - preferred_term: CD8+ T-cell killing of EBV-transformed B cells
          term:
            id: GO:0001913
            label: T cell mediated cytotoxicity
          modifier: DECREASED
      selected_evidence:
        snippet: However, further investigation of in vitro-derived CD8(+) T-cell clones established from
          2 of these donors showed they efficiently recognized SLAM ligand-negative target cells expressing
          EBV antigens, but showed impaired recognition of EBV-transformed, SLAM ligand-positive, lymphoblastoid
          cell lines (LCLs).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
