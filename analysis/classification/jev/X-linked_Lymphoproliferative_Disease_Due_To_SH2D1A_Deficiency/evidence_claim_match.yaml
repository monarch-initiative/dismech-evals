        biological_scale: ORGANISM
        description: The humoral endpoint of XLP1. Serum immunoglobulins are abnormal, most often as hypogammaglobulinemia
          but historically spanning agammaglobulinemia to polyclonal hypergammaglobulinemia — hence "dysgammaglobulinemia"
          rather than a purely quantitative deficit. Untreated, it causes recurrent respiratory infection
          and bronchiectasis and can itself be fatal. It may be the presenting feature in a boy with no
          EBV history, and can be indistinguishable from common variable immunodeficiency.
        biological_processes:
        - preferred_term: immunoglobulin class switch recombination
          term:
            id: GO:0045190
            label: isotype switching
          modifier: DECREASED
        - preferred_term: immunoglobulin production
