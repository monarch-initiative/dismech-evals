  a84a2e6baf663113c33641f7f12e119f4bb6ec74ded2f91fb5a3a7aad93039e0:
    claim:
      about:
        disease:
          name: X-linked Lymphoproliferative Disease Due To SH2D1A Deficiency
          disease_term:
            preferred_term: X-linked lymphoproliferative disease type 1 (SAP deficiency)
            term:
              id: MONDO:0024551
              label: X-linked lymphoproliferative disease due to SH2D1A deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective T-B Cell Help and Germinal Center Formation
        biological_scale: CELLULAR
        description: 'SAP-dependent SLAM-family signaling sustains stable cognate interactions between
          follicular helper T cells and antigen-engaged B cells, and is required for germinal-center development.
          XLP1 patients have normal B-cell development but markedly reduced memory B cells, and the few
          present are IgM-positive, indicating failed in vivo isotype switching. The block is B-cell extrinsic:
          XLP1 B cells proliferate and differentiate normally in vitro, while XLP1 CD4+ T cells fail to
          differentiate into IL-10-producing effectors, fail to upregulate ICOS, and provide poor B-cell
          help — a defect partially corrected by exogenous IL-10 or restored SAP expression.'
        cell_types:
        - preferred_term: T follicular helper cell
          term:
            id: CL:0002038
            label: T follicular helper cell
        - preferred_term: memory B cell
          term:
            id: CL:0000787
            label: memory B cell
        biological_processes:
        - preferred_term: germinal center formation
          term:
            id: GO:0002467
            label: germinal center formation
          modifier: DECREASED
      selected_evidence:
        snippet: Our analysis of 14 XLP patients revealed normal B cell development but a marked reduction
          in the number of memory B cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/7
      evidence_path: /pathophysiology/7/evidence/0
      context_paths:
