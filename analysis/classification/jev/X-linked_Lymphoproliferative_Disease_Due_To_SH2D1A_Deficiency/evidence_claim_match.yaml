  9e0bf0b3762efb09af3a88b3eff7da83b9e0ede7c546404e6e74ddc3ffc7bbf3:
    claim:
      about:
        disease:
          name: X-linked Lymphoproliferative Disease Due To SH2D1A Deficiency
          disease_term:
            preferred_term: X-linked lymphoproliferative disease type 1 (SAP deficiency)
            term:
              id: MONDO:0024551
              label: X-linked lymphoproliferative disease due to SH2D1A deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SAP Adaptor Deficiency
        biological_scale: MOLECULAR
        description: Hemizygous SH2D1A deletions, frameshifts, nonsense and missense variants abolish
          or destabilize SAP, a 128-amino-acid protein consisting almost entirely of a single SH2 domain.
          Affected males typically have absent or markedly reduced intracellular SAP protein by flow cytometry.
          This is the initiating molecular lesion of XLP1.
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HEMIZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          genes:
          - preferred_term: SH2D1A
            term:
              id: hgnc:10820
              label: SH2D1A
          description: Hemizygous germline SH2D1A variants in males, including large constitutional deletions,
            small intragenic deletions, nonsense and missense alleles. Missense alleles such as R55L may
            retain detectable protein while remaining functionally deficient.
        molecular_functions:
        - preferred_term: SAP signaling adaptor activity
          term:
            id: GO:0035591
            label: signaling adaptor activity
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: We describe here the presence of small deletions and intragenic mutations that specifically
          disrupt a gene named DSHP in 6 of 10 unrelated patients with XLP.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:9811875
      reference_title: Inactivating mutations in an SH2 domain-encoding gene in X-linked lymphoproliferative
        syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Independent identification of inactivating deletions and intragenic mutations in the
        same gene (named DSHP in this report) in XLP patients.
