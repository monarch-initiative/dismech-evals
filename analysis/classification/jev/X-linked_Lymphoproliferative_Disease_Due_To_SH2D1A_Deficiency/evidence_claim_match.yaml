        snippet: Fever, pharyngitis, lymphadenomegaly, hepatosplenomegaly, atypical lymphocytosis, and
          a spectrum ranging from agammaglobulinaemia to polyclonal hyper-gammaglobulinaemia occurred.
        supports: SUPPORT
