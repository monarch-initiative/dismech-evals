        name: Primary Epstein-Barr Virus Infection
        description: Primary EBV infection is the disease-defining environmental trigger of XLP1. The
          genetic lesion is present from birth, but the fulminant infectious mononucleosis/HLH phenotype
          is precipitated by the first encounter with the virus, which was the trigger in 92% of XLP-1
          HLH episodes in the Pachlopnik Schmid cohort. GeneReviews accordingly lists EBV contact as an
          agent/circumstance to avoid. Note that EBV is not required for every manifestation — dysgammaglobulinemia
          may precede or occur without documented EBV infection — so this is modeled as a trigger of the
          acute arm rather than of the disease as a whole.
        exposure_term:
          preferred_term: exposure to Epstein-Barr virus
          term:
            id: ECTO:3000001
            label: exposure to virus
        effect: Precipitates fulminant infectious mononucleosis and HLH in SAP-deficient males.
      selected_evidence:
        snippet: X-linked lymphoproliferative syndrome (XLP or Duncan disease) is characterized by extreme
          sensitivity to Epstein-Barr virus (EBV), resulting in a complex phenotype manifested by severe
          or fatal infectious mononucleosis, acquired hypogammaglobulinemia and malignant lymphoma.
        supports: SUPPORT
