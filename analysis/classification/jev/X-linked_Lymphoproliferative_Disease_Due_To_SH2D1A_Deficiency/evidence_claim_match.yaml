  ebb8eccafbeaf4ec617591025992c7c009799cff08085aa0ae8a29fef3611388:
    claim:
      about:
        disease:
          name: X-linked Lymphoproliferative Disease Due To SH2D1A Deficiency
          disease_term:
            preferred_term: X-linked lymphoproliferative disease type 1 (SAP deficiency)
            term:
              id: MONDO:0024551
              label: X-linked lymphoproliferative disease due to SH2D1A deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SLAM-Family Receptor Signaling Failure
        biological_scale: MOLECULAR
        description: SAP binds immunoreceptor tyrosine-based switch motifs in the cytoplasmic tails of
          SLAM (CD150), 2B4 (CD244), NTB-A (SLAMF6), CD84 and Ly9, and normally recruits the kinase FynT
          while blocking docking of SH2-containing phosphatases. Without SAP, SHP-1/SHP-2 occupy those
          docking sites, so the receptors deliver inhibitory rather than activating signals. This inversion
          — rather than a simple absence of signal — is the defining molecular feature of XLP1 and explains
          why the immune failure is targeted at SLAM-ligand-bearing B lymphocytes.
        molecular_functions:
        - preferred_term: SAP SH2-domain binding to SLAM-family receptor tails
          term:
            id: GO:0042169
            label: SH2 domain binding
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: acts as an inhibitor by blocking recruitment of the SH2-domain-containing signal-transduction
          molecule SHP-2 to a docking site in the SLAM cytoplasmic region
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:9774102
      reference_title: The X-linked lymphoproliferative-disease gene product SAP regulates signals induced
        through the co-receptor SLAM.
      evidence_source: IN_VITRO
      explanation: Defines SAP's molecular role as competitively excluding SHP-2 from the SLAM cytoplasmic
        tail, the step lost in XLP1.
