        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Absent Invariant NKT Cell Development
        biological_scale: CELLULAR
        description: SAP is required for the development of invariant (type I) NKT cells. Sh2d1a-null
          mice lack NKT cells in thymus and periphery through a hematopoietic-cell-autonomous defect that
          is rescued by restoring SAP expression in bone marrow, and seventeen genetically confirmed XLP1
          patients likewise lacked NKT cells. Absent iNKT cells are a robust, near-universal cellular
          biomarker of SAP deficiency and are thought to contribute to defective antiviral and antitumor
          immunity and to hypogammaglobulinemia.
        cell_types:
        - preferred_term: invariant (type I) NKT cell
          term:
            id: CL:0000921
            label: type I NK T cell
        biological_processes:
        - preferred_term: invariant NKT cell development
          term:
            id: GO:0001865
            label: NK T cell differentiation
          modifier: DECREASED
      selected_evidence:
        snippet: Seventeen individuals with X-linked lymphoproliferative disease (XLP), who harbored germline
          mutations in SH2D1A, also lacked NKT cells.
        supports: SUPPORT
    origin:
