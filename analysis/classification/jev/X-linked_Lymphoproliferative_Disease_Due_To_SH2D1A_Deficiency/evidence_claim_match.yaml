        biological_scale: CELLULAR
        description: In XLP1 NK cells, 2B4 (CD244) not only fails to transduce a triggering signal but
          actively inhibits cytolysis, and the same inversion affects NTB-A. Because CD48 — the 2B4 ligand
          — is densely expressed on EBV-infected B cells, XLP1 NK cells engaging an EBV-positive target
          receive a dominant inhibitory signal and fail to kill it. Antibody-mediated masking of 2B4 and
          NTB-A restores lysis, demonstrating that inhibition rather than absent activation is the operative
          defect. Other NK triggering receptors (CD16, NKp46, NKp44, NKp30) are intrinsically normal but
          are overridden by 2B4 engagement.
