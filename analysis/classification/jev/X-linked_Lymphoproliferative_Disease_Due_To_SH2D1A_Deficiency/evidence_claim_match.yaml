        name: Immunoglobulin Replacement Therapy
        description: 'Intravenous or subcutaneous immunoglobulin replaces the antibody the failed germinal-center
          reaction cannot generate, preventing the recurrent respiratory infection and bronchiectasis
          that untreated dysgammaglobulinemia causes. It is supportive rather than curative: in the Booth
          cohort the majority of untransplanted survivors were maintained on immunoglobulin replacement.'
        therapeutic_modality: PROTEIN_REPLACEMENT
        treatment_term:
          preferred_term: immunoglobulin replacement therapy
          term:
            id: NCIT:C62710
            label: Immunoglobulin Therapy
      selected_evidence:
        snippet: Untransplanted patients have an overall survival of 62.5% with the majority on immunoglobulin
          replacement therapy, but the outcome for those untransplanted after HLH is extremely poor (18.8%).
