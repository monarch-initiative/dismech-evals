      assertion_type: Pathophysiology
      assertion:
        name: Enhanced Activation-Induced Lymphocyte Apoptosis
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: XIAP-deficient T cells are hypersensitive to CD95 (Fas), TRAIL-R and TCR-CD3-driven
          apoptosis, i.e. to activation-induced cell death. Activated effector lymphocytes are therefore
          deleted prematurely during an immune response, and the cells that would normally clear an infected
          target are lost at the moment they are needed. This is the arm of XIAP biology that the IUIS
          classification records as the functional defect of the disease.
        cell_types:
        - preferred_term: T cell
          term:
            id: CL:0000084
            label: T cell
        biological_processes:
        - preferred_term: lymphocyte apoptotic process
          term:
            id: GO:0070227
            label: lymphocyte apoptotic process
          modifier: INCREASED
        - preferred_term: T cell homeostasis
          term:
            id: GO:0043029
            label: T cell homeostasis
          modifier: DECREASED
      selected_evidence:
        snippet: Increased T cells susceptibility to apoptosis to CD95 and enhanced activation-induced
          cell death (AICD)
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
