            description: 'Allogeneic HSCT is the only therapy that removes the underlying defect, replacing
              the XIAP-deficient haematopoietic compartment and, in reported cases, fully restoring intestinal
              homeostasis. Conditioning intensity is the critical variable and XIAP deficiency is an explicit
              exception to standard practice: in the international survey, only one of seven patients
              given busulfan-containing myeloablative conditioning survived, with deaths from transplant-related
              toxicity including venoocclusive disease and pulmonary haemorrhage, plausibly because losing
              XIAP''s antiapoptotic function sensitises tissues to conditioning injury. Reduced-intensity
              conditioning gave 55% survival overall and 86% among those in HLH remission at transplant.
              Myeloablative regimens should not be used; reduced-intensity regimens should be used with
              caution and, where possible, only after HLH remission is achieved.'
            therapeutic_modality: CELL_THERAPY
            treatment_term:
              preferred_term: allogeneic hematopoietic stem cell transplantation
              term:
                id: NCIT:C15431
                label: Hematopoietic Cell Transplantation
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: XIAP Loss of Function
        treatment_effect: RESTORES
        description: Donor haematopoiesis supplies XIAP-competent lymphocytes and monocytes, restoring
          both the caspase-inhibitory and the NOD2-scaffolding functions in the haematopoietic compartment.
      selected_evidence:
        snippet: In 2 patients hematopoietic stem cell transplantation fully restored intestinal homeostasis.
        supports: SUPPORT
