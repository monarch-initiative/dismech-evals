      assertion:
        name: Inflammasome Dysregulation and Sustained IL-18 Excess
        biological_scale: ORGANISM
        mechanism_confidence: PROVISIONAL
        description: Serum IL-18 in XIAP deficiency is elevated an order of magnitude beyond what is seen
          in SAP deficiency, perforin deficiency or EBV-associated HLH, spikes with every HLH episode,
          and - unlike every other pro-inflammatory cytokine measured - stays high in clinical remission.
          IL-18 is generated by caspase-1 within the inflammasome, and because NOD2 can activate caspase-1
          the XIAP-NOD2 axis is the leading candidate route. The mechanism is marked provisional because
          patient PBMCs stimulated with LPS plus ATP did not oversecrete IL-18 relative to controls, so
          neither the cellular source nor the trigger is established.
        cell_types:
        - preferred_term: monocyte
          term:
            id: CL:0000576
            label: monocyte
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
        biological_processes:
        - preferred_term: interleukin-18 production
          term:
            id: GO:0032621
            label: interleukin-18 production
          modifier: INCREASED
        - preferred_term: positive regulation of inflammatory response
          term:
            id: GO:0050729
            label: positive regulation of inflammatory response
          modifier: INCREASED
      selected_evidence:
        snippet: Longitudinal examination of two patients demonstrated marked exacerbation of IL-18 levels
          during every occasion of HLH.
        supports: SUPPORT
