        context:
        - path: /pathophysiology/0
          value:
            name: XIAP Loss of Function
            biological_scale: MOLECULAR
            mechanism_confidence: ESTABLISHED
            description: 'Hemizygous germline XIAP/BIRC4 variants - most often nonsense, frameshift or
              splice alleles that abolish protein expression, and a smaller set of missense alleles clustered
              in the BIR2 and RING domains - eliminate or cripple XIAP protein. XIAP has two separable
              activities that both fail: its N-terminal BIR domains inhibit the apoptotic caspases, and
              its C-terminal RING domain provides the ubiquitin ligase activity required for NOD1/NOD2
              signaling. Loss of the first drives the lymphocyte-apoptosis arm of the disease; loss of
              the second drives the intestinal-inflammation arm.'
            genetic_context:
              gene:
                preferred_term: XIAP
                term:
                  id: hgnc:592
                  label: XIAP
              variant_origin: GERMLINE
              zygosity: HEMIZYGOUS
              functional_impact_category: LOSS_OF_FUNCTION
            molecular_functions:
            - preferred_term: caspase inhibitor activity
              term:
                id: GO:0043027
                label: cysteine-type endopeptidase inhibitor activity involved in apoptotic process
              modifier: DECREASED
            biological_processes:
            - preferred_term: XIAP-mediated ubiquitylation of RIPK2
              term:
                id: GO:0016567
                label: protein ubiquitination
              modifier: DECREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Enhanced Activation-Induced Lymphocyte Apoptosis
        causal_link_type: DIRECT
        description: Without XIAP to restrain the apoptotic caspases, lymphocytes from patients die more
          readily in response to death-receptor and antigen-receptor stimulation.
      selected_evidence:
        snippet: We show that apoptosis of lymphocytes from XIAP-deficient patients is enhanced in response
          to various stimuli including the T-cell antigen receptor (TCR)-CD3 complex, the death receptor
          CD95 (also termed Fas or Apo-1) and the TNF-associated apoptosis-inducing ligand receptor (TRAIL-R).
        supports: SUPPORT
