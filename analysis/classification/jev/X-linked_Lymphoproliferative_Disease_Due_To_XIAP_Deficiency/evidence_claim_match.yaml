        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective NOD2 Signaling in Monocytes and Intestinal Epithelium
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: 'XIAP is the essential ubiquitin ligase of the NOD2 pathway: on sensing the bacterial
          peptidoglycan fragment muramyl dipeptide, NOD2 recruits RIPK2, XIAP ubiquitylates RIPK2, and
          those chains recruit LUBAC to enable full NF-kappaB activation. XLP2 alleles in either the RING
          or the BIR2 domain abolish RIPK2 binding or ubiquitylation, so patient monocytes mount defective
          NOD2-driven cytokine and chemokine responses and patient fibroblasts show a parallel NOD1 defect.
          NOD2 is the strongest known genetic risk factor for Crohn disease and is central to antibacterial
          defence at mucosal surfaces, including in Paneth cells, which places this defect directly on
          the path to the intestinal disease.'
        cell_types:
        - preferred_term: monocyte
          term:
            id: CL:0000576
            label: monocyte
        - preferred_term: paneth cell
          term:
            id: CL:0000510
            label: paneth cell
        - preferred_term: intestinal epithelial cell
          term:
            id: CL:0002563
            label: intestinal epithelial cell
        biological_processes:
        - preferred_term: NOD2 signaling pathway
          term:
            id: GO:0070431
            label: nucleotide-binding oligomerization domain containing 2 signaling pathway
          modifier: DECREASED
        - preferred_term: response to muramyl dipeptide
          term:
            id: GO:0032495
            label: response to muramyl dipeptide
          modifier: DECREASED
        - preferred_term: NOD2-driven NF-kappaB activation
          term:
            id: GO:0043123
            label: positive regulation of canonical NF-kappaB signal transduction
          modifier: DECREASED
        locations:
        - preferred_term: intestine
          term:
            id: UBERON:0000160
            label: intestine
      selected_evidence:
        snippet: We conclude that XIAP and LUBAC constitute essential ubiquitin ligases in NOD2-mediated
          inflammatory signaling and propose that deregulation of NOD2 signaling contributes to XLP-2
          pathogenesis.
        supports: SUPPORT
    origin:
