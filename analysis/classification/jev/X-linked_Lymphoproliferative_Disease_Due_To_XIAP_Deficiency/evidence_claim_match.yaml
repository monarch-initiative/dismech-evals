      assertion:
        name: Invariant NKT Cell Depletion
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        description: 'Invariant natural killer T cells are reduced in XIAP-deficient patients, as they
          are in SAP deficiency. Because iNKT cells are thought to have a key role in the immune response
          to EBV, this is one of the few features XLP1 and XLP2 genuinely share, and it plausibly contributes
          to the failure to contain primary EBV infection. The node is graded provisional because the
          finding is not uniform: the founding Nature report and an independent Japanese cohort both found
          iNKT cells significantly reduced, but the IUIS classification records the count as low or normal,
          so a normal iNKT compartment does not exclude the diagnosis and iNKT depletion cannot be the
          whole explanation for HLH susceptibility.'
        cell_types:
        - preferred_term: invariant (type I) NKT cell
          term:
            id: CL:0000921
            label: type I NK T cell
      selected_evidence:
