          has yet been identified; it accounts for the gap between six named DFNX loci and five established
          genes.
      selected_evidence:
        snippet: To date, six loci (DFNX1-6) and five genes (PRPS1 for DFNX1, POU3F4 for DFNX2, SMPX for
          DFNX4, AIFM1 for DFNX5 and COL4A6 for DFNX6) have been identified for X-linked non-syndromic
          hearing loss.
        supports: SUPPORT
