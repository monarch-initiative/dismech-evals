      assertion:
        name: NDP-related Norrie disease
        description: Norrie disease is an X-linked NDP-related retinopathy that can include sensorineural
          hearing loss. Retinal fibrovascular changes evident at birth and extraocular findings distinguish
          it from a primary nonsyndromic DFNX presentation.
        distinguishing_features:
        - Bilateral elevated retrolental masses and incomplete foveal development strongly favor Norrie
          disease.
        - Cognitive, behavioral, seizure, or peripheral vascular manifestations may accompany the retinal
          and auditory phenotype.
        - In a male proband with suggestive findings, molecular identification of a hemizygous NDP pathogenic
          variant establishes an NDP-related retinopathy.
      selected_evidence:
        snippet: The eye findings of Norrie disease, the first described and best characterized of these
          disorders, are typically bilateral grayish-yellow, glistening, elevated retrolental masses composed
          of immature retinal cells usually visible through clear lenses; foveal development is always
          incomplete.
        supports: SUPPORT
