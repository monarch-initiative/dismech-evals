        context: []
      assertion_type: Inheritance
      assertion:
        name: X-linked inheritance
        inheritance_term:
          preferred_term: X-linked inheritance
          term:
            id: HP:0001417
            label: X-linked inheritance
        description: 'DFNX comprises hearing-loss loci and genes on the X chromosome. Female expression
          is gene specific: PRPS1 heterozygotes range from unaffected to unilateral or bilateral hearing
          loss and occasional subclinical neuropathy, influenced in part by X-inactivation. POU3F4 heterozygotes
          are usually unaffected, although hearing loss has been reported and systematic female imaging
          data are lacking. SMPX-associated hearing loss is often later, milder, and less penetrant in
          females than in males. Female carriers in the reported AIFM1 auditory-neuropathy families did
          not report auditory or sensory neuropathy. The few COL4A6 families do not establish reliable
          female penetrance or expressivity.'
        expressivity: VARIABLE
      selected_evidence:
        snippet: To date, six loci (DFNX1-6) and five genes (PRPS1 for DFNX1, POU3F4 for DFNX2, SMPX for
          DFNX4, AIFM1 for DFNX5 and COL4A6 for DFNX6) have been identified for X-linked non-syndromic
          hearing loss.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30065609
      reference_title: 'X-Linked Sensorineural Hearing Loss: A Literature Review.'
      evidence_source: OTHER
      explanation: The review directly classifies the DFNX loci and genes as X-linked.
