      assertion:
        name: Other inner-ear malformations versus POU3F4 incomplete partition type III
        description: Other incomplete-partition patterns, enlarged vestibular aqueduct, cochlear hypoplasia,
          and cochlear-nerve deficiency can all accompany hearing loss. The specific temporal-bone CT
          pattern and POU3F4 testing distinguish IP-III.
        distinguishing_features:
        - IP-III retains the interscalar septa but lacks the modiolus and has a widened lateral internal
          auditory canal directly communicating with the cochlea.
        - A perilymphatic gusher risk and POU3F4 variant or upstream deletion further favor IP-III.
        - MRI complements CT when cochlear nerve deficiency rather than a bony partition anomaly is suspected.
      selected_evidence:
        snippet: Cochlear malformation was shown to consist of a relatively normal outer coat shape, absence
          of a cochlear modiolus, and a direct inter communication between the IAC and cochlear inner
          cavity.
        supports: SUPPORT
