      reference_title: Lack of collagen α6(IV) chain in mice does not cause severe-to-profound hearing
        loss or cochlear malformation, a distinct phenotype from nonsyndromic hearing loss with COL4A6
        missense mutation.
      evidence_source: MODEL_ORGANISM
      explanation: This abstract-level negative result narrowly refutes simple loss of expression as sufficient
        in the mouse model. It does not test the human alleles or refute broad human gene-disease causality.
