        context: []
      assertion_type: Subtype
      assertion:
        name: DFNX4
        display_name: DFNX4 / SMPX-related X-linked nonsyndromic hearing loss
        classification: molecular
        subtype_term:
          preferred_term: hearing loss, X-linked 4
          term:
            id: MONDO:0010238
            label: hearing loss, X-linked 4
        description: SMPX-related DFNX4 is usually progressive nonsyndromic hearing loss. Truncating SMPX
          variants are associated with DFNX4 auditory phenotypes, while nontruncating variants can be
          associated with non-auditory myopathy phenotypes.
        genes:
        - preferred_term: SMPX
          term:
            id: hgnc:11122
            label: SMPX
      selected_evidence:
        snippet: In a Dutch family with an X-linked postlingual progressive hearing impairment, a critical
          linkage interval was determined to span a region of 12.9 Mb flanked by the markers DXS7108 and
          DXS7110. This interval overlaps with the previously described DFNX4 locus and contains 75 annotated
          genes. Subsequent next-generation sequencing (NGS) detected one variant within the linkage interval,
          a nonsense mutation in SMPX.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/3
      evidence_path: /has_subtypes/3/evidence/0
      context_paths:
      - /name
      - /disease_term
