      assertion:
        name: DFNX6
        display_name: DFNX6 / COL4A6-related X-linked hearing loss
        classification: molecular
        subtype_term:
          preferred_term: hearing loss, X-linked 6
          term:
            id: MONDO:0010484
            label: hearing loss, X-linked 6
        description: DFNX6 is the reported COL4A6-associated X-linked hearing-loss phenotype. ClinGen
          classified the relationship as Limited in February 2022. A family and in-vitro minigene result
          support one splice variant, while another reported missense variant remained a variant of uncertain
          significance. Negative mouse-knockout hearing and cochlear-morphology results conflict with
          simple loss of expression being sufficient in that model; they do not test the reported human
          variants or broadly refute COL4A6 causality.
        genes:
        - preferred_term: COL4A6
          term:
            id: hgnc:2208
            label: COL4A6
      selected_evidence:
        snippet: The p.Gly1091Ala variant is classified as a variant of unknown significance based on
          the variant interpretation guidelines.
        supports: SUPPORT
