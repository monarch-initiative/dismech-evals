      assertion:
        name: Impaired Cytosolic RNA:DNA Hybrid Synthesis
        biological_scale: MOLECULAR
        description: Besides priming DNA replication, POLA1 synthesises RNA:DNA hybrids in the cytosol,
          and these hybrids modulate the interferon response. With less POLA1 their synthesis falls, removing
          a brake on type I interferon induction. The nucleic-acid sensor that responds is not curated
          here; see the knowledge gap below.
        molecular_functions:
        - preferred_term: DNA polymerase-alpha catalytic activity
          term:
            id: GO:0003887
            label: DNA-directed DNA polymerase activity
          modifier: DECREASED
        genes:
        - preferred_term: POLA1
          term:
            id: hgnc:9173
            label: POLA1
      selected_evidence:
        snippet: This enzyme is necessary for the synthesis of RNA:DNA primers during DNA replication
          and, strikingly, we found that POLA1 is also required for the synthesis of cytosolic RNA:DNA,
          which directly modulates interferon activation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
