            NC_000023.10:g.24744696A>G. It alters POLA1 splicing and reduces transcript and protein. It
            is found hemizygous in affected males and heterozygous in carrier females, and has arisen
            de novo at least once.
          variant_type: single nucleotide variant
          genomic_contexts:
          - intron
      selected_evidence:
        snippet: We discovered that XLPDR is caused by an intronic mutation that disrupts the expression
          of POLA1, which encodes the catalytic subunit of DNA polymerase-α.
