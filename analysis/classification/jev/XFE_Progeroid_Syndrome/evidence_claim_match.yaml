              label: XFE progeroid syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Suppression of the Growth Hormone-IGF1 Somatotroph Axis
        biological_scale: ORGANISM
        mechanism_confidence: PROVISIONAL
        description: 'The node that makes this disease theoretically interesting rather than merely rare.
          Liver transcriptomes of XPF-ERCC1-deficient mice correlate highly with those of old wild-type
          mice, and show increased cell death and antioxidant defences together with reduced growth hormone/IGF-1
          signalling. The same shift occurs in wild-type animals under chronic genotoxic stress, under
          caloric restriction, and with normal ageing.

          On this reading the growth failure, cachexia and lipoatrophy of the human disease are not the
          damage but the *response* to it - a survival programme that reallocates resources from growth
          to somatic preservation. That is a strong and unusual claim about a phenotype and it is curated
          as PROVISIONAL: the transcriptomic correlation and the conserved direction of the shift are
          solid, but the causal step from damage to axis suppression is inferred from expression data
          in mouse liver and has not been demonstrated in a patient.'
        biological_processes:
        - preferred_term: insulin-like growth factor receptor signaling pathway
          term:
            id: GO:0048009
            label: insulin-like growth factor receptor signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: Expression data from XPF-ERCC1-deficient mice indicate increased cell death and anti-oxidant
          defences, a shift towards anabolism and reduced growth hormone/insulin-like growth factor 1
          (IGF1) signalling, a known regulator of lifespan.
        supports: SUPPORT
