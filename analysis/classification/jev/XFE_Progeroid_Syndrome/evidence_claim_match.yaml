        limitations: The mouse is an Ercc1 mutant and the human disease is an ERCC4 one. The two proteins
          are obligate partners so the heterodimer is disabled either way, but the model cannot reproduce
          anything specific to the ERCC4 subunit - and the founding human allele's defect is precisely
          subunit-specific, being a mislocalisation of catalytically intact XPF rather than a loss of
          nuclease. Lifespan compression also means the mouse phenotype is read out over months against
          a human course of years.
        readouts:
        - name: Nerve conduction studies at 8 and 20 weeks
          target: Segmental Multi-Organ Degeneration
          direction: DECREASED
          interpretation: Normal at 8 weeks and significantly abnormal at 20, which times the neuropathy
            rather than merely reporting it.
      selected_evidence:
        snippet: We tested the hypothesis that a murine model of XFE progeroid syndrome, caused by reduced
          expression of ERCC1-XPF DNA repair endonuclease, develops peripheral neuropathy.
        supports: SUPPORT
