            term:
              id: MONDO:0012590
              label: XFE progeroid syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ERCC1-XPF Endonuclease Deficiency
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'ERCC1-XPF is a heterodimeric structure-specific endonuclease that cuts DNA at junctions
          between double- and single-stranded regions. It is a core component of nucleotide excision repair
          and is also required for interstrand crosslink repair, for homologous recombination and end-joining
          routes to double-strand break repair, as a backup in base excision repair, and in telomere length
          regulation.

          Which disease an ERCC4 genotype produces turns on the balance of activities it leaves. Fanconi-causing
          alleles strongly disrupt crosslink repair while largely sparing excision repair; xeroderma-causing
          alleles impair excision repair; the progeroid genotype impairs both. This is a rare instance
          where a genotype-phenotype rule is stated mechanistically rather than statistically, and it
          is why this entry exists separately from Xeroderma Pigmentosum rather than as a subtype of it.

          The founding allele adds a twist worth curating: R153P protein retains catalytic activity in
          vitro, and the deficit is one of location - XPF-ERCC1 is abundant in the cytoplasm of the patient''s
          cells rather than concentrated in the nucleus where the DNA is. Microinjecting the mutant complex
          into the nucleus of XPF-deficient cells restored repair. So this is not a dead enzyme; it is
          a functional enzyme in the wrong compartment.'
        molecular_functions:
        - preferred_term: endonuclease activity
          term:
            id: GO:0004519
            label: endonuclease activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: nucleotide-excision repair
          term:
            id: GO:0006289
            label: nucleotide-excision repair
          modifier: DECREASED
        - preferred_term: interstrand cross-link repair
          term:
            id: GO:0036297
            label: interstrand cross-link repair
          modifier: DECREASED
        - preferred_term: double-strand break repair via homologous recombination
          term:
            id: GO:0000724
            label: double-strand break repair via homologous recombination
          modifier: DECREASED
      selected_evidence:
        snippet: In addition, microinjection of XPF(R153P)-ERCC1 into the nucleus of XPF-deficient human
          cells restored nucleotide excision repair of UV-induced DNA damage.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/4
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20221251
      reference_title: Mislocalization of XPF-ERCC1 nuclease contributes to reduced DNA repair in XP-F
        patients.
      evidence_source: IN_VITRO
      explanation: The rescue that proves the enzyme is competent and merely mislocalised, which is what
        makes this a trafficking defect rather than a catalytic one.
