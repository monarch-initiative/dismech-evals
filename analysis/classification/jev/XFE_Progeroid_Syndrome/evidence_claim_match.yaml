      about:
        disease:
          name: XFE Progeroid Syndrome
          disease_term:
            preferred_term: XFE progeroid syndrome
            term:
              id: MONDO:0012590
              label: XFE progeroid syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NF-kappaB-Driven Inflammation and Oxidative Stress
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        description: 'NF-kappaB is activated stochastically across cell types as both progeroid and wild-type
          mice age. What makes this more than a correlation is the intervention: removing one p65 allele,
          or inhibiting the activating kinase IKK pharmacologically, delays the age-related symptoms and
          pathologies of the progeroid mice, reduces oxidative DNA damage, and delays senescence.

          Note the feedback this implies - inhibiting NF-kappaB *reduced oxidative DNA damage*, so the
          inflammatory response is not only downstream of damage but also feeds back onto it. That makes
          this node a loop rather than a link in a chain, and it is the reason it is a plausible therapeutic
          target in a disease whose primary lesion is not druggable.'
        biological_processes:
        - preferred_term: positive regulation of canonical NF-kappaB signal transduction
          term:
            id: GO:0043123
            label: positive regulation of canonical NF-kappaB signal transduction
          modifier: INCREASED
        - preferred_term: inflammatory response
          term:
            id: GO:0006954
            label: inflammatory response
          modifier: INCREASED
      selected_evidence:
        snippet: Genetic depletion of one allele of the p65 subunit of NF-κB or treatment with a pharmacological
          inhibitor of the NF-κB-activating kinase, IKK, delayed the age-related symptoms and pathologies
          of progeroid mice.
        supports: SUPPORT
    origin:
