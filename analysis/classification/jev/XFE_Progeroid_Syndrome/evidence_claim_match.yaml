            hedge: complete loss is embryonic lethal, so partial function is a defining property of every
            genotype that produces this disease rather than a statement about the severity of a particular
            allele.'
      selected_evidence:
        snippet: Pathogenic variants in this gene cause xeroderma pigmentosum, XFE progeroid syndrome,
