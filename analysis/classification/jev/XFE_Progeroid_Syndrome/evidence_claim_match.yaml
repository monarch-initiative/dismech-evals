      assertion_type: Treatment
      assertion:
        name: Dietary Restriction
        therapeutic_modality: BEHAVIORAL
        description: 'The single most effective intervention in the models, and mechanistically coherent
          rather than merely empirical: caloric restriction invokes the same shift from growth to preservation
          that the disease''s own somatotroph suppression represents, so it is the intervention that most
          directly engages the mechanism this entry curates. In DNA repair-deficient progeroid mice it
          roughly doubles lifespan with systemic health benefits.

          Curated as preclinical. It has never been tested in a human with this disease, the patients
          described are already cachectic, and restricting intake in a wasting child is not a straightforward
          translation - which is precisely why the finding is worth recording with its context rather
          than as a recommendation.'
        treatment_term:
          preferred_term: dietary intervention
          term:
            id: NCIT:C15447
            label: Dietary Intervention
      selected_evidence:
        snippet: Dietary restriction (DR, also known as caloric restriction) is a well-established long-term
          intervention recognized for its universal anti-ageing effects.
        supports: SUPPORT
