              label: XFE progeroid syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: ERCC4
        gene_term:
          preferred_term: ERCC4
          term:
            id: hgnc:3436
            label: ERCC4
        relationship_type: CAUSATIVE
        notes: 'Also written XPF and FANCQ. One of the most phenotypically pleiotropic single genes in
          medicine: xeroderma pigmentosum group F, Cockayne syndrome overlap, cerebro-oculo-facio-skeletal
          syndrome, Fanconi anemia group Q, and this disease all come from ERCC4, and the discriminator
          is the balance of repair activities the genotype leaves rather than the position of the variant
          as such.

          Two things a curator should not conclude from the gene. It is not a familial breast/ovarian
          cancer susceptibility gene - that was tested directly in 1573 index cases against 854 controls
          and carrier frequency did not differ. And the rarity of patients is not the rarity of alleles:
          carriers are about one in 288, comparable to FANCA, while FA-Q patients are roughly a hundredfold
          rarer than FA-A, which implies most biallelic combinations never reach birth.'
      selected_evidence:
        snippet: However, mutations in the ERCC1 or ERCC4 genes cause a remarkable array of rare inherited
          human disorders. These include specific forms of xeroderma pigmentosum, Cockayne syndrome, Fanconi
          anemia, XFE progeria and cerebro-oculo-facio-skeletal syndrome.
        supports: SUPPORT
