      assertion_type: Genetic
      assertion:
        name: YWHAG variants
        gene_term:
          preferred_term: YWHAG
          term:
            id: hgnc:12852
            label: YWHAG
        association: Pathogenic mutations
        presence: Positive
        notes: Reported disease-causing alleles include predominantly heterozygous missense variants,
          with ligand-binding-domain variants enriched in severe DEE, and rare truncating haploinsufficiency
          variants associated with milder familial myoclonic/febrile seizure presentations.
        variants:
        - name: Ligand-binding domain missense variants
          description: Missense variants in the phosphopeptide ligand-binding region are enriched among
            patients with the more severe DEE presentation.
          clinical_significance: PATHOGENIC
        - name: Truncating haploinsufficiency variants
