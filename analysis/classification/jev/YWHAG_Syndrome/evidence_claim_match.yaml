          term:
            id: UBERON:0000956
            label: cerebral cortex
      selected_evidence:
        snippet: The widespread alterations in the transcriptome of mutant neurons revealed a biphasic
          dysregulation in the core genes and modulators associated with the ROCK pathway that resulted
          in maturation-dependent changes to cytoskeletal protein stability and calcium phenotypes.
        supports: SUPPORT
