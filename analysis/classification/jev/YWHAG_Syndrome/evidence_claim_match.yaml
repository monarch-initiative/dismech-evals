            term:
              id: MONDO:0033365
              label: developmental and epileptic encephalopathy, 56
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Elevated baseline intracellular calcium
        description: Mutant cortical neurons exhibit an elevated calcium baseline, indicating altered
          calcium homeostasis. In the p.Arg132Cys model, this baseline abnormality changes with maturation,
          is worsened by direct ROCK inhibition with Y27632, and is partially reduced by lovastatin treatment.
        cell_types:
        - preferred_term: cerebral cortex neuron
          term:
            id: CL:0010012
            label: cerebral cortex neuron
        biological_processes:
        - preferred_term: calcium ion homeostasis
          term:
            id: GO:0055074
            label: calcium ion homeostasis
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Direct inhibition of ROCK with Y27632 further increased the calcium baseline compared
          to the isogenic control. Exposure of YWHAG R132C/+ neurons to Trypsin-EDTA revealed underlying
          cytoskeletal instability, which was partially reversed by lovastatin treatment. Further, lovastatin
          partially rescued the elevated calcium baseline, but not the frequency or amplitude of calcium
          spikes.
        supports: SUPPORT
    origin:
