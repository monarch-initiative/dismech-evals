  304a8b7013dcce1deb9892739f9d0f3991774bf0f3e5bcac255c360e1ef42077:
    claim:
      about:
        disease:
          name: YWHAG Syndrome
          disease_term:
            preferred_term: YWHAG syndrome
            term:
              id: MONDO:0033365
              label: developmental and epileptic encephalopathy, 56
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Variant-dependent YWHAG / 14-3-3gamma dysfunction
        description: 'YWHAG encodes the 14-3-3gamma scaffold protein, which coordinates phosphoserine-dependent
          signaling complexes important for neuronal development. Pathogenic missense variants can perturb
          the protein through at least two partially distinct mechanisms: recurrent ligand-binding-domain
          alleles associated with more severe DEE and structural-destabilizing alleles that disrupt the
          conserved internal hydrophobic core. The recurrent p.Arg132Cys ligand-binding-domain variant
          provides the best-studied bridge from human genetics to downstream neuronal mechanism.'
        gene:
          preferred_term: YWHAG
          description: Tyrosine 3-monooxygenase/tryptophan 5-monooxygenase activation protein gamma, encoding
            the 14-3-3gamma adaptor/scaffold protein.
          term:
            id: hgnc:12852
            label: YWHAG
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        - preferred_term: cerebral cortex neuron
          term:
            id: CL:0010012
            label: cerebral cortex neuron
      selected_evidence:
        snippet: A genotype-phenotype correlation emerged, as DEE is more represented in patients with
          missense variants located in the ligand-binding domain than in those with truncating or missense
          variants in other domains
        supports: SUPPORT
    origin:
