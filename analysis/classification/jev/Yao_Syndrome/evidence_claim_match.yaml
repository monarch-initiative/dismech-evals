  6af7f6c17edc064e3e2cc3f406ac2327270d49e49575eca69182ca83aaf74374:
    claim:
      about:
        disease:
          name: Yao Syndrome
          disease_term:
            preferred_term: Yao syndrome
            term:
              id: MONDO:0015019
              label: Yao syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: NOD2
        gene_term:
          preferred_term: NOD2
          term:
            id: hgnc:5331
            label: NOD2
        association: Low-penetrance susceptibility variants
        relationship_type: SUSCEPTIBILITY
        variant_origin: GERMLINE
        features: 'NOD2 (CARD15) on 16q12.1 encodes a cytosolic pattern-recognition receptor for bacterial
          muramyl dipeptide. YAOS is associated with a small set of low-frequency, low-penetrance variants:
          the deep-intronic IVS8+158 (c.2717+158C>T, rs5743289) and the missense R702W (historically p.Arg702Trp;
          MANE NM_001370466.1 reannotates it c.2023C>T p.Arg675Trp), frequently co-inherited in cis, plus
          L1007fs (c.3019dup) and V955I (c.2863G>A). Many patients carry two or more variants, and digenic/oligogenic
          combinations with other autoinflammatory genes are common. These are largely the same variants
          that predispose to Crohn disease, which is part of why the gene-disease relationship is contested.
          relationship_type is SUSCEPTIBILITY rather than CAUSATIVE for that reason.'
        variants:
        - name: IVS8+158
          description: Deep-intronic NOD2 c.2717+158C>T (rs5743289), the most prevalent single YAOS-associated
            variant, alone or compound with R702W. It does not alter intron-8 splicing, and it is common
            in the general population.
        - name: R702W
          description: Missense p.Arg702Trp, a common Crohn-associated allele that co-occurs with IVS8+158
            in a YAOS haplotype and is associated with suppressed MDP-stimulated NF-kappaB activity and
            TNF secretion.
        - name: L1007fs and V955I
          description: Additional YAOS-associated variants (L1007fs c.3019dup; V955I c.2863G>A), usually
            seen in combination with IVS8+158.
        - name: Q902K and other rare variants
          description: Rare missense variants, including Q902K, R541P and Y514H, were identified in Chinese
            patients whose phenotype differed from the Caucasian cohorts. Q902K did not increase NF-kappaB
            reporter activity in a reconstitution assay, so its functional consequence is unresolved.
      selected_evidence:
        snippet: This study underscores the NOD2 genotype association with NAID, which is a genetically
          complex multisystem disorder.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
