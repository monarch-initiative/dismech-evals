          relationship: FAILS_TO_RECAPITULATE
          model_scale: MOLECULAR
          description: The reconstitution assay did not reproduce increased NF-kappaB activation for the
            Q902K variant, so it does not support this node for that allele.
          limitations: Transient overexpression in a non-immune cell line lacks the endogenous regulation,
            myeloid context and co-inherited variants of patient cells, so a negative reporter result
            does not exclude a pathogenic effect in vivo; it does show that Q902K is not a straightforward
            NF-kappaB-activating allele.
      selected_evidence:
        snippet: NOD2 Q902K-transfected cells did not demonstrate an increase in basal and MDP-stimulated
          NF-κB activity when compared to wild-type NOD2
