      assertion_type: Pathophysiology
      assertion:
        name: NOD2 Low-Penetrance Susceptibility Variants
        description: Germline low-frequency, low-penetrance NOD2 variants - chiefly the deep-intronic
          IVS8+158 and the missense R702W, alone or co-inherited, with additional L1007fs and V955I -
          are the genetic substrate of YAOS. They are modeled as susceptibility rather than deterministic
          alleles because they are common in the general population and most carriers never develop disease.
          YAOS-associated coding variants cluster in and around the central nucleotide-binding domain,
          distinct from the LRR-region variants that predispose to Crohn disease.
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        gene:
          preferred_term: NOD2
          term:
            id: hgnc:5331
            label: NOD2
      selected_evidence:
        snippet: Associated NOD2 variants were primarily IVS8(+158) or compound IVS8(+158) and R702W.
        supports: SUPPORT
