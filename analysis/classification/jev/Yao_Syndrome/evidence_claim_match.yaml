      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: yaos_nod2_dysregulated_signaling
        hypothesis_label: NOD2-RIP2-MAPK/IL-6 dysregulated-signaling model
        status: EMERGING
        description: 'The leading mechanistic model holds that YAOS-associated NOD2 variants produce a
          dysregulated state of NOD2-RIP2-MAPK and IL-6 signaling in innate immune cells rather than a
          simple loss or gain of function. Support comes from patient PBMC, synovial and mucosal studies,
          but the model is unproven: genotype effects are heterogeneous (Q902K did not raise NF-kappaB
          reporter activity; IVS8+158/R702W suppresses NF-kappaB and TNF), the studies involve very few
          patients, and no variant has an established deterministic functional consequence.'
      selected_evidence:
        snippet: Our study demonstrates for the first time that NOD2 expression and pathway activation
          are aberrant in YAOS, and specific NOD2 genotypes result in distinct NOD2 expression and cytokine
          profiles.
        supports: SUPPORT
    origin:
