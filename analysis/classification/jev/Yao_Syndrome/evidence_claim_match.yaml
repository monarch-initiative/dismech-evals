          name: Yao Syndrome
          disease_term:
            preferred_term: Yao syndrome
            term:
              id: MONDO:0015019
              label: Yao syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: controversy_yaos_entity_validity
        prompt: Is Yao syndrome a genuine NOD2-associated disease entity, or an association with variants
          too common in the population to establish causation?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - genetic#NOD2
        - pathophysiology#NOD2 Low-Penetrance Susceptibility Variants
        rationale: The defining variants are carried by a large fraction of the general population (roughly
          1 in 5 for IVS8+158, 1 in 12 for R702W in gnomAD), which exceeds any plausible disease prevalence,
          and no adequately powered association study has established the link. A 2026 review argues the
          diagnosis should not be used; a 2025 case-control study against 128,196 All of Us participants
          reports significant but modest enrichment (OR 1.32). This entry therefore models NOD2 as SUSCEPTIBILITY
          and the signaling mechanism as EMERGING rather than asserting causation.
      selected_evidence:
        snippet: As a result, given the current lack of evidence for the existence of Yao syndrome, this
          diagnosis should not be used.
        supports: REFUTE
