        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#
        rationale: All treatment evidence is from retrospective cohorts and case reports with no randomized
          trials, and cohorts disagree (for example anti-TNF response was frequent in a Chinese cohort
          and poor in a Greek one). First-line choice therefore rests on uncontrolled experience.
