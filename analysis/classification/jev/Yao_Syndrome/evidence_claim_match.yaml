        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_yaos_gi_symptom_mechanism
        prompt: Are the near-universal gastrointestinal symptoms of Yao syndrome driven by NOD2-mediated
          mucosal inflammation or by non-inflammatory dysmotility?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Systemic Autoinflammation
        - phenotypes#Chronic gastrointestinal symptoms
        rationale: GI symptoms occur in essentially every patient, yet endoscopy, biopsy and stool studies
          are typically normal while anorectal manometry is abnormal in all tested patients, pointing
          to dyssynergic defecation rather than mucosal inflammation. The causal edge from systemic autoinflammation
          to GI symptoms is therefore recorded as indirect with unknown intermediates.
      selected_evidence:
        snippet: Bloating and constipation may be driven by dyssynergic defecation.
        supports: SUPPORT
    origin:
