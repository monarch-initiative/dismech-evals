        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Childhood Malignant-GCT Chromosomal-Imbalance Pattern
        biological_scale: MOLECULAR
        description: A 51-tumor study of germ cell tumors in children younger than 10 years included 33
          malignant tumors of multiple histologies and sites; it was not a pure-YST cohort. At that childhood
          malignant-GCT level, most tumors lacked adult-type 12p gain and recurrent imbalances included
          distal 1p loss, 1q/20q gain, and 4q/6q deletion. This contextual pattern must not be assigned
          specifically to prepubertal testicular YST or generalized to all pediatric YST.
      selected_evidence:
        snippet: With the exception of one testicular and two ovarian tumors, malignant GCTs in children
          do not show chromosomal gain of 12p, which is characteristic of GCTs in adult patients.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:11528555
      reference_title: Genetic analysis of childhood germ cell tumors with comparative genomic hybridization.
      evidence_source: HUMAN_CLINICAL
      explanation: The 51-tumor pediatric CGH cohort directly separates childhood malignant GCT genetics
        from the adult 12p-gain pathway.
