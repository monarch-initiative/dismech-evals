        biological_scale: MOLECULAR
        description: Postpubertal-type testicular YST belongs to the GCNIS-related/type II germ cell tumor
          family. Isochromosome 12p or other 12p gain is common in that family and is thought to arise
          during progression from GCNIS to invasive tumor; the lesion belongs to the shared clone, not
          uniquely to the YST component.
      selected_evidence:
        snippet: Type II TGCTs are the only GCNIS-related tumours in this classification and include seminomas,
          embryonal carcinoma, choriocarcinoma, yolk-sac tumour and teratoma of postpubertal type.
        supports: SUPPORT
