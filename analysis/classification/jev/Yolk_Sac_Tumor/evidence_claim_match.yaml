      assertion:
        name: Mediastinal GCT and Blood-Cancer Shared-Precursor Branching
        biological_scale: CELLULAR
        description: In the uncommon syndrome of primary mediastinal nonseminomatous germ cell tumor with
          an associated hematologic malignancy, genomic phylogenies support a shared ancestral precursor
          followed by divergent, parallel evolution of the germ-cell tumor and blood cancer. This does
          not establish serial transformation of a mature YST component into leukemia, and the finding
          is scoped to the associated mediastinal syndrome rather than all YST.
      selected_evidence:
        snippet: Our findings argue that this scenario represents a unique clinical syndrome, distinct
          from de novo GCTs or hematologic malignancies, initiated by an ancestral precursor that gives
          rise to the parallel evolution of GCTs and blood cancers in these patients.
        supports: SUPPORT
