      assertion_type: Pathophysiology
      assertion:
        name: Primitive Endodermal Differentiation Program
        biological_scale: CELLULAR
        description: YST is defined by differentiation toward primitive extraembryonic endoderm and related
          mesenchymal programs. This developmental identity explains its reticular-microcystic and other
          endodermal patterns, but does not establish one universal precursor cell for every gonadal,
          extragonadal, CNS, and somatically derived context.
        biological_processes:
        - preferred_term: abnormal extraembryonic endodermal differentiation
          modifier: ABNORMAL
          term:
            id: GO:0030154
            label: cell differentiation
      selected_evidence:
        snippet: Their complex nomenclature and histogenesis stress the fact that they are not a discrete
          entity, but represent a multifaceted group of neoplasms, for which the term primitive endodermal
          tumours would be more appropriate, accounting for their capacity to differentiate into various
          extraembryonal and somatic cell types.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
