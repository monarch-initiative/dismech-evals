      reference: PMID:22008025
      reference_title: Yolk sac tumours revisited. A review of their many faces and names.
      evidence_source: OTHER
      explanation: The pathology review supports primitive-endodermal differentiation while explicitly
        rejecting treatment of all YST settings as one discrete entity.
