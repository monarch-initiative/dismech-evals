          survival after the blood cancer diagnosis was 5 months. This severe mediastinal-GCT syndrome
          is not automatically attributable to a YST component in every mixed tumor.
      selected_evidence:
        snippet: Six hundred thirty-five patients treated at 11 centers in the United States and Europe
          from 1975 through 1996 were evaluated retrospectively. ... A hematologic disorder was observed
          in 17 patients with germ cell tumors. All cases developed among the 287 patients with primary
          mediastinal nonseminomatous germ cell tumors, giving an incidence rate in this group of 2.0%
          (95% confidence interval [CI] = 1.1%-3.1%) per year over a median follow-up time of 3 years.
          ... The median time to onset of hematologic neoplasia was 6 months (range, 0-47 months), and
          the median survival after diagnosis of the hematologic disorder was 5 months (range, 0-16 months)
          (two-sided P<.0001, comparing survival from the time of diagnosis of the germ cell tumor of
          patients with and without hematologic disorders).
