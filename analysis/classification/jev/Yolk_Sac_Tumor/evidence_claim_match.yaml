        biological_scale: MOLECULAR
        description: YST cells synthesize AFP. After resection of an AFP-secreting tumor, serial serum
          AFP decay can report residual active tumor or preclinical recurrence; AFP is not specific to
          YST and tissue staining may be focal.
        gene_products:
        - preferred_term: alpha-fetoprotein
          term:
            id: NCIT:C16278
            label: Alpha-Fetoprotein
      selected_evidence:
        snippet: Positive AFP staining was seen in the vast majority of YSTs (56 of 59 or 95%); however,
          32 (54%) YSTs showed staining in less than 30% tumor cells.
        supports: SUPPORT
