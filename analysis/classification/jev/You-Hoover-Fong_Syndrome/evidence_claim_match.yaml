        description: TELO2/TTT-complex destabilization is associated with intellectual disability through
          unresolved intermediates.
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
      selected_evidence:
        snippet: Our results suggest that these TELO2 missense variants result in loss of function, perturb
