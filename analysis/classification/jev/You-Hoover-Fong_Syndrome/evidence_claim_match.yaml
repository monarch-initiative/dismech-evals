      assertion:
        name: Biallelic pathogenic TELO2 variants
        gene_term:
          preferred_term: TELO2
          term:
            id: hgnc:29099
            label: TELO2
        relationship_type: CAUSATIVE
        notes: Pathogenic genotypes include homozygous and compound-heterozygous alleles. Missense variants
          predominate in the published spectrum. Variant interpretation should incorporate segregation
          and phenotype. Two sisters homozygous for p.Arg609His had a milder presentation, but the same
          allele had previously occurred in a more severely affected compound heterozygote; an allele-severity
          relationship is therefore suggestive, not established.
      selected_evidence:
        snippet: Our results suggest that these TELO2 missense variants result in loss of function, perturb
          TTT complex stability, and cause an autosomal-recessive syndromic form of ID.
        supports: SUPPORT
