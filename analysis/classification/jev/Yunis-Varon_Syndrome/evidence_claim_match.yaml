      assertion:
        name: Death in infancy
        category: Mortality
        phenotype_term:
          preferred_term: Death in infancy
          description: Left unbound. HP:0001522 Death in infancy is the right concept, but it sits in
            the HPO clinical-modifier branch rather than under Phenotypic abnormality, so it is outside
            the PhenotypeTerm dynamic enum and fails term validation when bound.
        description: 'Literature cases frequently died in infancy, usually from respiratory complications.
          Survival is not uniformly short: four of the five FIG4 patients in PMID:39669591 lived beyond
          6 years, a 26-year-old survivor has been reported (PMID:24610892), and survival data beyond
          infancy exist for only six literature individuals. No study links the respiratory deaths to
          a specific upstream mechanism, so this phenotype is not wired into the pathograph.'
      selected_evidence:
        snippet: It is important to note that most of the participants from this study survived beyond
          6 years of life, contrary to cases from the literature who frequently died in infancy, usually
          from respiratory complications (Supplemental Table 3), except for 6 individuals from the literature
          for whom we have data beyond infancy.
        supports: SUPPORT
