        species: Mouse
        genotype: Zfp36l2 targeted allele expressing reduced N-terminally truncated protein (DeltaN-Zfp36l2),
          homozygous
        publication: PMID:15342461
        description: Homozygous females are infertile. On the C57BL/6NTac background they ovulate and
          their eggs are fertilized, but embryos arrest at the two-cell stage. On a 129S6/SvEvTac background
          they do not ovulate and most oocytes stay at the germinal vesicle stage, a difference the authors
          partly attribute to strain differences in ovarian luteinizing hormone receptor mRNA, another
          ZFP36L2 target.
        modeled_mechanisms:
        - target: Embryo Developmental Arrest
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Embryos from mutant oocytes arrest at the two-cell stage.
          limitations: Engineered truncation with reduced expression rather than a patient allele; mouse
            embryos arrest at the two-cell stage, the time of mouse zygotic genome activation, which differs
            from the human timing.
        - target: Oocyte Maturation Arrest
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: Germinal-vesicle arrest on the 129S6/SvEvTac background.
          limitations: Seen on one strain background only and accompanied by anovulation, which has not
            been reported in patients; the authors link it partly to ovarian LH receptor mRNA rather than
            to an oocyte-intrinsic defect.
      selected_evidence:
        snippet: Moreover, we discovered that ZFP36L2 interacts with the 3'UTR of LHR mRNA and that decreased
          expression levels of Zfp36l2 correlates with higher levels of LHR mRNA in synchronized ovaries.
        supports: SUPPORT
