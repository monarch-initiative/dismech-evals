  167d00ca61c17ccf526021145443305cedb6cfc44386d06c5731bf0ec9cc151d:
    claim:
      about:
        disease:
          name: ZFP36L2-related Oocyte Maturation Defect
          disease_term:
            preferred_term: oocyte maturation defect 13
            term:
              id: MONDO:0859330
              label: oocyte maturation defect 13
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic ZFP36L2 Variants Reducing mRNA Decay Activator Function
        role: TRIGGER
        biological_scale: MOLECULAR
        description: In-frame deletions and missense variants lower ZFP36L2 protein in oocytes (attributed
          to instability of the variant mRNA) and weaken binding of ZFP36L2 to the CCR4-NOT deadenylase
          subunit CNOT6L. ZFP36L2 normally binds AU-rich elements in the 3' untranslated region of its
          target mRNAs and recruits CCR4-NOT to deadenylate and degrade them. The genotypes are treated
          as partial rather than complete loss of function because affected women have no reported somatic
          phenotype, and none of the reported genotypes is a predicted null.
        genetic_context:
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          description: Biallelic genotypes made of in-frame deletions or duplications and missense variants,
            several clustered between residues 285 and 310.
        genes:
        - preferred_term: ZFP36L2
          term:
            id: hgnc:1108
            label: ZFP36L2
        molecular_functions:
        - preferred_term: AU-rich element mRNA binding
          term:
            id: GO:0035925
            label: mRNA 3'-UTR AU-rich region binding
          modifier: DECREASED
        - preferred_term: CCR4-NOT complex binding
          term:
            id: GO:1905762
            label: CCR4-NOT complex binding
          modifier: DECREASED
        cell_types:
        - preferred_term: oocyte
          term:
            id: CL:0000023
            label: oocyte
      selected_evidence:
        snippet: In vitro studies showed that the variant caused decreased protein levels of ZFP36L2 in
          oocytes due to mRNA instability and might lead to the loss of its function to degrade maternal
          mRNAs.
        supports: SUPPORT
