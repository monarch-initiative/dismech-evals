  d18901929087e90c0664ef27cf7875ad7e499c8fe765a980ea2860a1a2e41024:
    claim:
      about:
        disease:
          name: ZFP36L2-related Oocyte Maturation Defect
          disease_term:
            preferred_term: oocyte maturation defect 13
            term:
              id: MONDO:0859330
              label: oocyte maturation defect 13
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failed Oocyte H3K4 and H3K9 Methylation
        biological_scale: MOLECULAR
        description: Mainly model-derived. In growing mouse oocytes lacking Zfp36l2, mRNAs for H3K4 and
          H3K9 demethylases are not degraded, and the oocyte fails to accumulate H3K4me3 and H3K9me3.
          Patient ZFP36L2 variants expressed in mouse oocytes also give aberrant H3K4me3 and H3K9me3 levels.
          Histone marks have not been measured in patient oocytes. No GO term is bound because the GO
          histone-methylation process terms are obsolete.
        cell_types:
        - preferred_term: oocyte
          term:
            id: CL:0000023
            label: oocyte
      selected_evidence:
        snippet: Single-cell RNA sequencing revealed that ZFP36L2 downregulates mRNAs encoding transcription
          and chromatin modification regulators, including a large group of mRNAs for histone demethylases
          targeting H3K4 and H3K9, which we show are bound and degraded by ZFP36L2.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29408237
      reference_title: Chromatin Modification and Global Transcriptional Silencing in the Oocyte Mediated
