      assertion_type: Pathophysiology
      assertion:
        name: Failed Global Transcriptional Silencing in Oocytes
        biological_scale: CELLULAR
        description: 'Model-derived. Fully grown mouse oocytes normally silence transcription before the
          oocyte-to-embryo transition, and silencing marks the developmentally competent state. Oocytes
          lacking Zfp36l2 do not silence transcription, and they then mature and fertilize poorly. Silencing
          has not been assessed in patient oocytes. No GO term is bound: OLS searches of GO for "transcriptional
          silencing" and "heterochromatin formation" returned RNA-mediated silencing and heterochromatin-formation
          terms, none describing global transcriptional silencing of the oocyte.'
        cell_types:
        - preferred_term: oocyte
          term:
            id: CL:0000023
            label: oocyte
      selected_evidence:
        snippet: Oocyte-specific loss of ZFP36L2 an RNA-binding protein that promotes AU-rich element-dependent
          mRNA decay prevents global transcriptional silencing and causes oocyte maturation and fertilization
          defects, as well as complete female infertility in the mouse.
        supports: SUPPORT
