            missense alleles; histone marks have not been measured in patient oocytes.
        - target: Failed Global Transcriptional Silencing in Oocytes
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Source of the transcriptional-silencing node.
          limitations: A complete oocyte-specific knockout rather than a patient allele; transcriptional
            silencing has not been assessed in patient oocytes.
      selected_evidence:
        snippet: Following superovulation and mating experiments to examine fertilization, no zygotes
          were recovered from 8 cKO females compared to ninety-five zygotes from 5 control females, demonstrating
