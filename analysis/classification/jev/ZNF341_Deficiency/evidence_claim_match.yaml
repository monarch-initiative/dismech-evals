        description: Ex vivo irradiated leukocytes from four ZNF341-deficient patients repaired DNA damage
          more slowly than controls, and one patient developed a nasal primitive neuroendocrine tumor
          followed by papillary thyroid cancer. The authors propose that the repair defect, together with
          radiation exposure, predisposes to malignancy. The clinical side of this rests on one patient.
      selected_evidence:
