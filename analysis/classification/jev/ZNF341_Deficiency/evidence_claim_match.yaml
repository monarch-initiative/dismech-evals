            term:
              id: MONDO:0032654
              label: hyper-IgE recurrent infection syndrome 3, autosomal recessive
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ZNF341 biallelic loss of function
        description: All 20 patients pooled in the 2023 review were homozygous for predicted loss-of-function
          ZNF341 alleles (nonsense, frameshift, essential splice site); a biallelic missense allele has
          since been reported, so truncation characterises that cohort rather than defining the disease.
          The truncated products lack most of the twelve C2H2 zinc fingers; the p.Gln195* and p.Arg302*
          products are retained in the cytoplasm, and mutant proteins fail to activate the STAT3 promoter.
          ZNF341 is a constitutively nuclear transcription factor expressed in all leukocytes tested and
          in fibroblasts and keratinocytes.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: ZNF341
          term:
            id: hgnc:15992
            label: ZNF341
        molecular_functions:
        - preferred_term: DNA-binding transcription factor activity
          term:
            id: GO:0000981
            label: DNA-binding transcription factor activity, RNA polymerase II-specific
          modifier: DECREASED
      selected_evidence:
        snippet: ZNF341 is a transcription factor that resides in the nucleus, where it binds a specific
          DNA motif present in various genes, including the STAT3 promoter.
        supports: SUPPORT
