      assertion_type: Treatment
      assertion:
        name: Dupilumab
        action_category: THERAPEUTIC
        therapeutic_modality: MONOCLONAL_ANTIBODY
        description: 'Dupilumab, an anti-IL-4-receptor-alpha monoclonal antibody, blocks IL-4 and IL-13
          signalling and is the one therapy reported in a genetically confirmed ZNF341-deficient patient.
          A 48-year-old woman with severe atopic dermatitis (SCORAD 85.5) refractory to ultra-potent topical
          corticosteroids and topical tacrolimus received 600 mg followed by 300 mg subcutaneously every
          two weeks, improved after three injections, stopped topical treatment at three months, and had
          a complete and well-tolerated response at one year, with falling total and allergen-specific
          IgE. This is a single case report in an adult, so it establishes that the Th2 axis is targetable
          in this disorder rather than an efficacy estimate. Paediatric experience now exists: a 2-year-old
          girl with biallelic ZNF341 variants, severe atopic dermatitis over more than 70% of her body
          surface and IgE above 40,000 IU/mL was started at 300 mg every four weeks, escalated at three
          months to 200 mg every two weeks for extensive disease, and improved to mild disease under 10%
          body surface by six months, with her IgE falling to 6935 IU/mL. Treatment was then interrupted
          for four months, during which her dermatitis flared; it settled again on restarting at the same
          initial dose, and she remained stable over the following year. The response therefore appears
          to require continued treatment. Total published experience in this disorder is two patients,
          one adult and one child.'
