              label: hyper-IgE recurrent infection syndrome 3, autosomal recessive
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: STAT3 dominant-negative hyper-IgE syndrome (AD-HIES)
        description: The principal differential and a near-complete clinical phenocopy. It is autosomal
          dominant, usually de novo, and acts by negative dominance rather than loss of function. Pointers
          away from it and toward ZNF341 deficiency are a recessive pedigree with consanguinity, a lower
          NIH HIES score (median 28.5 versus 64), low NK cells, high serum IgG, less frequent connective-tissue,
          skeletal and dental involvement, and no reported vascular complication. None of these is decisive
          without genetic testing.
      selected_evidence:
        snippet: Although generally milder, AR ZNF341 deficiency is a hardly distinguishable clinical
          phenocopy of AD STAT3 deficiency in the absence of genetic testing.
        supports: SUPPORT
