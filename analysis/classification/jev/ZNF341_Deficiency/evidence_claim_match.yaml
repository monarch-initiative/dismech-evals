          neuroendocrine tumour followed by papillary thyroid cancer - arose in a patient in that study.
          The authors read the radiosensitivity as a potential explanation for susceptibility to malignant
          transformation. This supports being deliberate about cumulative diagnostic radiation and about
          cancer surveillance, but the basis is one patient and an ex vivo assay in four, and no surveillance
          protocol, starting age or interval has been published for this disorder.
