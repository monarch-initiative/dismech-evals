            preferred_term: ZNF341 Deficiency
            term:
              id: MONDO:0032654
              label: hyper-IgE recurrent infection syndrome 3, autosomal recessive
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: znf341_stat3_supply
        hypothesis_label: Reduced basal STAT3 and loss of STAT3 autoinduction in lymphocytes
        status: CANONICAL
        description: ZNF341 binds the STAT3 promoter and is required for normal basal STAT3 transcription
          and for the transient autoinduction of STAT3 when naive T cells are co-stimulated through the
          TCR and IL-6 (and B cells through CD40L and IL-21). Because a 50% fall in basal STAT3 is not
          by itself thought to cause HIES (no STAT3 haploinsufficiency phenotype is known), the combination
          of low basal STAT3 with failed autoinduction in lymphocytes is the favoured explanation for
          the STAT3-deficiency phenocopy.
      selected_evidence:
        snippet: However, as there is no clear evidence that STAT3 haploinsufficiency causes HIES, this
          decrease alone is probably insufficient to explain the HIES phenotype observed in the ZNF341-deficient
          patients.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37080116
      reference_title: Inherited human ZNF341 deficiency.
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      explanation: States why reduced basal STAT3 alone is not accepted as sufficient.
