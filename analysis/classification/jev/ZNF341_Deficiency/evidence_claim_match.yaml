        context: []
      assertion_type: Diagnosis
      assertion:
        name: Th17 enumeration by flow cytometry
        description: Reduced circulating IL-17-producing CD4+ T cells are found in most patients and support
          a STAT3-pathway defect, but they do not distinguish ZNF341 deficiency from STAT3 dominant-negative
          disease, in which the same reduction is seen at a comparable frequency. Low NK cell counts,
          uncommon in STAT3 deficiency, are the flow-cytometric finding that points toward ZNF341.
        diagnosis_term:
          preferred_term: Th17 and NK cell flow cytometry
          term:
            id: NCIT:C16585
            label: Flow Cytometry
        results: Reduced Th17 cell proportion; reduced NK cell count
      selected_evidence:
        snippet: Thus, ZNF341 deficiency phenocopies STAT3 deficiency in terms of the immunological phenotype
          of patients, except that NK cell counts are low in a majority of patients with ZNF341 deficiency
          but rarely in those with STAT3 deficiency.
        supports: SUPPORT
