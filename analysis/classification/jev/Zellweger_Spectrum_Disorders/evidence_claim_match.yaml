        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Peroxisomal Membrane Assembly Failure
        biological_scale: CELLULAR
        description: 'PEX3, PEX16 and PEX19 are the three mammalian peroxins dedicated to inserting peroxisomal
          membrane proteins into the peroxisomal membrane, by a PEX19- and PEX3-dependent class I route
          and a PEX19- and PEX16-dependent class II route. Their loss is categorically different from
          a matrix import defect: in the absence of any of the three no peroxisomal structures can be
          identified at all, and peroxisomal membrane proteins are mistargeted or degraded, so there is
          no membrane compartment left for the import machinery to act on.'
        genes:
        - preferred_term: PEX3
          term:
            id: hgnc:8858
