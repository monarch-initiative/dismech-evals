        name: Zellweger Syndrome
        display_name: Zellweger Syndrome (cerebro-hepato-renal syndrome)
        description: The most severe phenotype, presenting in the neonatal period with profound hypotonia,
          intractable seizures, characteristic craniofacial dysmorphism, severe liver disease, and renal
          cortical cysts. Most affected infants die in the first year of life.
      selected_evidence:
        snippet: Infants with severe ZSD are significantly impaired and typically die during the first
          year of life, usually having made no developmental progress.
        supports: SUPPORT
