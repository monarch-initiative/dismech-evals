      assertion_type: Pathophysiology
      assertion:
        name: RING Ubiquitin Ligase Retrotranslocation Failure
        biological_scale: MOLECULAR
        description: PEX2, PEX10 and PEX12 are the three RING finger peroxins of a membrane-embedded ubiquitin
          ligase complex. The complex monoubiquitinates the import receptor after cargo release and forms
          the channel through which the receptor is retrotranslocated back to the cytosol; when recycling
          is compromised the receptor is instead polyubiquitinated and degraded. Biallelic loss of any
          of the three therefore exhausts the receptor pool and stops further import.
        genes:
        - preferred_term: PEX2
          term:
