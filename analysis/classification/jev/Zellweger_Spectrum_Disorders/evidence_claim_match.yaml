            label: peroxisome fission
          modifier: DECREASED
        cellular_components:
        - preferred_term: peroxisome
          term:
            id: GO:0005777
            label: peroxisome
      selected_evidence:
        snippet: The peroxisomal membrane is elongated by Pex11β and then divided by the dynamin-like
          GTPase, DLP1 (also known as DRP1 encoded by DNM1L gene), which also functions as a fission factor
          for mitochondria.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/9
