        context: []
      assertion_type: Subtype
      assertion:
        name: PEX1-ZSD
        display_name: peroxisome biogenesis disorder due to PEX1 defect
        subtype_term:
          preferred_term: peroxisome biogenesis disorder due to PEX1 defect
          term:
            id: MONDO:0100259
            label: peroxisome biogenesis disorder due to PEX1 defect
        description: Zellweger spectrum disorder caused by biallelic PEX1 variants. PEX1 is one of the
          two AAA+ ATPases of the receptor export module, which resets the matrix protein import machinery
          by returning the cargo receptor to the cytosol; losing that step stalls receptor recycling and
          so blocks further rounds of import. PEX1 variants are among the most prevalent PEX gene defects
          reported in this spectrum.
        genes:
        - preferred_term: PEX1
          term:
            id: hgnc:8850
            label: PEX1
      selected_evidence:
        snippet: The ATP-dependent protein complex in charge of resetting this machinery-the Receptor
          Export Module (REM)-comprises two members of the "ATPases Associated with diverse cellular Activities"
          (AAA+) family, PEX1 and PEX6, and a membrane protein that anchors the ATPases to the organelle
          membrane.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/3
      evidence_path: /has_subtypes/3/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31652724
      reference_title: A Mechanistic Perspective on PEX1 and PEX6, Two AAA+ Proteins of the Peroxisomal
