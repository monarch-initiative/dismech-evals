        display_name: Infantile Refsum Disease
        description: The mildest end of the spectrum, with later onset, slower progression, retinitis
          pigmentosa, sensorineural hearing loss, ataxia, and survival into adolescence or adulthood.
          Distinct from adult (PHYH-related) Refsum disease.
      selected_evidence:
        snippet: Individuals with intermediate/milder ZSD do not have congenital malformations, but rather
          progressive peroxisome dysfunction variably manifest as sensory loss (secondary to retinal dystrophy
          and sensorineural hearing loss), neurologic involvement (ataxia, polyneuropathy, and leukodystrophy),
          liver dysfunction, adrenal insufficiency, and renal oxalate stones.
        supports: SUPPORT
