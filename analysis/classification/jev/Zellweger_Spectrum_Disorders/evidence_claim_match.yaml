      assertion_type: Pathophysiology
      assertion:
        name: RING Ubiquitin Ligase Retrotranslocation Failure
        biological_scale: MOLECULAR
        description: PEX2, PEX10 and PEX12 are the three RING finger peroxins of a membrane-embedded ubiquitin
          ligase complex. The complex monoubiquitinates the import receptor after cargo release and forms
          the channel through which the receptor is retrotranslocated back to the cytosol; when recycling
          is compromised the receptor is instead polyubiquitinated and degraded. Biallelic loss of any
          of the three therefore exhausts the receptor pool and stops further import.
        genes:
        - preferred_term: PEX2
          term:
            id: hgnc:9717
            label: PEX2
        - preferred_term: PEX10
          term:
            id: hgnc:8851
            label: PEX10
        - preferred_term: PEX12
          term:
            id: hgnc:8854
            label: PEX12
        biological_processes:
        - preferred_term: protein import into peroxisome matrix, receptor recycling
          term:
            id: GO:0016562
            label: protein import into peroxisome matrix, receptor recycling
          modifier: DECREASED
        molecular_functions:
        - preferred_term: ubiquitin protein ligase activity
          term:
            id: GO:0061630
            label: ubiquitin protein ligase activity
          modifier: DECREASED
      selected_evidence:
        snippet: A recent cryo-electron microscopy (cryo-EM) structure of the complex reveals its function
          as a retro-translocation channel for peroxisomal import receptors.
        supports: SUPPORT
    origin:
