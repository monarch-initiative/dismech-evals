          cause Zlotogora-Ogur syndrome. The four variants reported through 2015 produced truncated proteins
          lacking the transmembrane and intracellular domains. Homozygous W185X causes CLPED1 on Margarita
          Island; heterozygosity was associated with sporadic non-syndromic cleft lip/palate in northern
          Venezuela. The cited evidence does not establish W185X as a founder variant. The proposal that
          viral resistance maintains this allele is an untested heterozygote-advantage hypothesis.

          '
        inheritance:
        - name: Autosomal recessive
        gene_term:
