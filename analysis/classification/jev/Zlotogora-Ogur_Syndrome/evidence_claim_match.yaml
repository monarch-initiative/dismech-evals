      assertion:
        name: Impaired Palate Shelf Elevation and Fusion
        biological_scale: TISSUE
        description: 'Mouse experiments show that the nectin-afadin axis is required for palate shelf
          elevation and fusion. Palatal epithelial loss of afadin induces high-penetrance cleft palate;
          loss of either Nectin1 or Nectin4 produces mild palate-closure defects at low penetrance, and
          combined loss produces severe cleft palate. Expression of human NECTIN1 W185X in mice causes
          cleft palate with greater penetrance than Nectin1 loss, suggesting a dominant interfering mechanism
          in that model.

          '
        cell_types:
        - preferred_term: ectodermal cell
          term:
            id: CL:0000221
            label: ectodermal cell
        biological_processes:
        - preferred_term: roof of mouth development
          term:
            id: GO:0060021
            label: roof of mouth development
        locations:
        - preferred_term: roof of mouth
          term:
            id: UBERON:0007375
            label: roof of mouth
      selected_evidence:
        snippet: Here, we use in utero lentiviral-mediated genetic approaches in mice to provide the first
          direct evidence that the nectin-afadin axis is essential for proper palate shelf elevation and
          fusion
        supports: SUPPORT
