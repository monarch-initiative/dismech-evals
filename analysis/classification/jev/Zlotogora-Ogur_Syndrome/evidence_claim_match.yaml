          mice, suggesting dominant interference, whereas human syndromic disease requires biallelic pathogenic
          variants. The mouse result supports a role for the nectin-afadin axis but does not establish
          the allelic mechanism in human palate or ectodermal appendages.
        attaches_to:
        - pathophysiology#Impaired Palate Shelf Elevation and Fusion
      selected_evidence:
