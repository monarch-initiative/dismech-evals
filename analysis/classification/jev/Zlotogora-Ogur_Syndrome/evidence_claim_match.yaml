  ce58645f7460174afe2207d8840e707b164939ab5163f632830ea17329493b28:
    claim:
      about:
        disease:
          name: Zlotogora-Ogur Syndrome
          disease_term:
            preferred_term: cleft lip/palate-ectodermal dysplasia syndrome
            term:
              id: MONDO:0009151
              label: cleft lip/palate-ectodermal dysplasia syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: PVRL1 (NECTIN1) mutations
        features: 'Autosomal recessive loss-of-function mutations in PVRL1 (now NECTIN1), encoding nectin-1,
          cause Zlotogora-Ogur syndrome. The four variants reported through 2015 produced truncated proteins
          lacking the transmembrane and intracellular domains. Homozygous W185X causes CLPED1 on Margarita
          Island; heterozygosity was associated with sporadic non-syndromic cleft lip/palate in northern
          Venezuela. The cited evidence does not establish W185X as a founder variant. The proposal that
          viral resistance maintains this allele is an untested heterozygote-advantage hypothesis.

          '
        inheritance:
        - name: Autosomal recessive
        gene_term:
          preferred_term: NECTIN1
          term:
            id: hgnc:9706
            label: NECTIN1
        variants:
        - name: W185X (c.554G>A)
          description: Nonsense mutation creating a premature stop codon at position 185. Homozygosity
            causes CLPED1 on Margarita Island; heterozygosity is associated with non-syndromic cleft lip/palate
            in northern Venezuela.
        - name: Frameshift at Trp185
          description: Single-base deletion at codon 185 (Trp185) causing a frameshift, identified in
            an Israeli family and predicted to truncate nectin-1.
        - name: Frameshift at Gly323
          description: Single-base duplication at codon 323 (Gly323) causing a frameshift, identified
            in a Brazilian family and predicted to truncate nectin-1.
        - name: p.Arg134* (c.400C>T)
          description: Novel homozygous nonsense mutation identified in a Japanese patient. Results in
            truncated nectin-1 lacking transmembrane and intracellular domains.
      selected_evidence:
        snippet: we describe positional cloning of the gene responsible for an autosomal recessive CL/P-ectodermal
          dysplasia (ED) syndrome (CLPED1; previously ED4; ref. 2), which we identify as PVRL1, encoding
          nectin-1, an immunoglobulin (Ig)-related transmembrane cell-cell adhesion molecule that is part
          of the NAP cell adhesion system
        supports: SUPPORT
