          term:
            id: hgnc:9706
            label: NECTIN1
        variants:
        - name: W185X (c.554G>A)
          description: Nonsense mutation creating a premature stop codon at position 185. Homozygosity
            causes CLPED1 on Margarita Island; heterozygosity is associated with non-syndromic cleft lip/palate
            in northern Venezuela.
        - name: Frameshift at Trp185
          description: Single-base deletion at codon 185 (Trp185) causing a frameshift, identified in
            an Israeli family and predicted to truncate nectin-1.
        - name: Frameshift at Gly323
