        biological_scale: MOLECULAR
        description: 'PVRL1 (NECTIN1) encodes nectin-1, an immunoglobulin-related transmembrane cell-cell
          adhesion molecule that is part of the NAP cell adhesion system. Nectin-1 is important for the
          initial step in adherens-junction and tight-junction formation. The four PVRL1 variants reported
          through 2015 produced truncated proteins lacking the transmembrane and intracellular domains
          required to initiate nectin-1-mediated adhesion. In the related PVRL4-associated ectodermal
          dysplasia-syndactyly syndrome, mutant nectin-4 loses its ability to bind nectin-1 and alters
          junction-complex localization in hair follicles. This is cross-nectinopathy evidence, not direct
          evidence from NECTIN1-deficient appendages.

          '
        cell_types:
