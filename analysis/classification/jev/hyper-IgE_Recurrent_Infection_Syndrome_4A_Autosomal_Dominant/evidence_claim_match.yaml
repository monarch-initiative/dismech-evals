          disease_term:
            preferred_term: hyper-IgE recurrent infection syndrome 4A, autosomal dominant
            term:
              id: MONDO:0800131
              label: hyper-IgE recurrent infection syndrome 4A, autosomal dominant
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: gp130 (IL6ST) Dominant-Negative Dysfunction
        biological_scale: MOLECULAR
        description: Heterozygous truncating IL6ST variants encode a gp130 receptor that keeps its extracellular
          and transmembrane domains but loses the distal cytoplasmic tail (the recycling motif and the
          four STAT3-recruiting tyrosines). The mutant receptor accumulates at the cell surface and poisons
          signalling complexes formed with wild-type gp130 - a dominant-negative, not a haploinsufficiency,
          mechanism.
        genes:
        - preferred_term: IL6ST
          term:
            id: hgnc:6021
            label: IL6ST
        genetic_context:
          functional_impact_category: DOMINANT_NEGATIVE
        molecular_functions:
        - preferred_term: gp130 cytokine receptor activity
          modifier: DECREASED
          term:
            id: GO:0004896
            label: cytokine receptor activity
      selected_evidence:
        snippet: Upon overexpression, the mutant proteins accumulate at the cell surface and are loss
          of function and DN for cellular responses to IL-6, IL-11, LIF, and OSM.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
