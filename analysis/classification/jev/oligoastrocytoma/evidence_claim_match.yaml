        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Molecular Reclassification
        description: Integrated diagnosis uses IDH mutation and 1p/19q codeletion to translate most historical
          oligoastrocytoma diagnoses into current adult-type diffuse glioma categories. IDH-mutant tumors
          without whole-arm 1p/19q codeletion are generally classified as astrocytoma, IDH-mutant, while
          IDH-mutant tumors with whole-arm 1p/19q codeletion are classified as oligodendroglioma.
        biological_processes:
        - preferred_term: chromosome organization
          modifier: ABNORMAL
          term:
            id: GO:0051276
            label: chromosome organization
      selected_evidence:
        snippet: The gathered data were transformed into the 2021 World Health Organization classification
          of CNS tumors using the IDH- and 1p/19q-mutation status.
        supports: SUPPORT
    origin:
