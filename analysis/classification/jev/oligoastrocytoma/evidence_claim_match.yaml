          diffuse glioma biology and mutant IDH inhibition by vorasidenib.
        biological_processes:
        - preferred_term: metabolic process
          modifier: ABNORMAL
          term:
            id: GO:0008152
            label: metabolic process
      selected_evidence:
        snippet: cancer-associated IDH1 mutations result in a new ability of the enzyme to catalyse the
          NADPH-dependent reduction of alpha-ketoglutarate to R(-)-2-hydroxyglutarate (2HG).
        supports: SUPPORT
