        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_iih_secretory_transport_and_outflow_translation
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Do the distinct secretory and drainage changes in rodent models occur in the same human
          IIH subgroups?
        attaches_to:
        - pathophysiology#Choroid plexus CSF hypersecretion
        - pathophysiology#Impaired cerebrospinal fluid outflow
        rationale: 'Rodent findings differ by strain, diet, hormonal perturbation, and assay: one high-fat
          paradigm increases secretion, another increases outflow resistance, and obese Zucker rats compensate
          for testosterone-induced secretion. Human androgen excess and drug-induced ICP reduction are
          insufficient to resolve the dominant human pathway. MRI water exchange and aqueductal flow must
          be validated against net secretion before being treated as direct production measurements.'
      selected_evidence:
        snippet: Using high-resolution 3D balanced steady-state free precession MRI in rats, we demonstrate
          robust and spatially widespread D2O-induced CSF signal loss that is selectively suppressed by
          acetazolamide, a carbonic anhydrase inhibitor known to suppress CSF production by the choroid
          plexus.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/4
      evidence_path: /discussions/4/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41279197
      reference_title: Indirect Deuterium Displacement Exchange Imaging for Noninvasive High-Resolution
        CSF Production Mapping.
      evidence_source: MODEL_ORGANISM
      explanation: 'Shows what the validation this gap demands looks like: a noninvasive production readout
        anchored to pharmacological suppression of secretion rather than assumed from water exchange.
        It is a rat study and a preprint that has not been peer reviewed, so it makes the human measurement
        a translation problem rather than an unsolved methodological one, and it does not itself measure
        anything in IIH.'
