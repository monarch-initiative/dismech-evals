        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: glymphatic_isf_dyshomeostasis
        hypothesis_label: Glymphatic and Interstitial Fluid Dyshomeostasis Model
        status: ALTERNATIVE
        description: A competing model places the primary fluid disturbance in interstitial fluid clearance
          rather than in CSF secretion. Obesity-associated metabolic dysfunction is proposed to impair
          glymphatic clearance, interstitial fluid then accumulates, brain volume rises, and the swollen
          parenchyma compresses the dural venous sinuses from outside, with the resulting venous hypertension
          feeding back on glymphatic drainage. It accommodates the rat paradigm in which high-fat feeding
          raises ICP with the CSF secretion rate unchanged, but it is argued from narrative synthesis
          and cross-sectional imaging surrogates, and glymphatic function in patients has so far been
          assessed only through an imaging index rather than measured directly.
        notes: Recorded as ALTERNATIVE rather than EMERGING because the mechanism rests on narrative synthesis
          and correlational imaging surrogates, with no interventional study and no direct clearance measurement
          in IIH. The hypothesis assessment sidecar dispositions the unifying glymphatic claim as QUALIFIED
          and asks that it be preserved as an explicit hypothesis rather than a canonical causal chain,
          which is the form used here. No pathophysiology node asserts impaired glymphatic clearance,
          so no causal edge opts into this group; separating it from the secretory model needs paired
          secretion-rate and clearance measurement in the same patients.
      selected_evidence:
        snippet: We propose a unified disease model where obesity-mediated metabolic dysfunction results
          in impaired glymphatic clearance with consequential accumulation of brain ISF with resultant
          increased brain volume.
        supports: SUPPORT
    origin:
