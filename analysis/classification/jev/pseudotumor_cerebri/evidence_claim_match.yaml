  125e19f282cc60b03037b61dc4087ac85e0373f5ee751a8d52c1ae711634133f:
    claim:
      about:
        disease:
          name: pseudotumor cerebri
          disease_term:
            preferred_term: pseudotumor cerebri
            term:
              id: MONDO:0009468
              label: pseudotumor cerebri
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_iih_obesity_venous_csf_hierarchy
        prompt: How do obesity/metabolic-hormonal drivers, venous sinus pressure and stenosis, and CSF
          production/absorption interact causally in IIH, and which of these is the initiating event versus
          an amplifying feedback consequence?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Metabolic risk background
        - pathophysiology#Choroid plexus CSF hypersecretion
        - pathophysiology#Venous sinus stenosis
        - pathophysiology#Dysregulated cerebrospinal fluid dynamics
        rationale: IIH is defined by raised intracranial pressure without a mass lesion, yet the causal
          ordering among its candidate mechanisms remains unresolved. Multiple pathways have been proposed
          as the underlying cause - choroid plexus CSF overproduction, impaired CSF outflow/absorption,
          elevated venous sinus pressure with transverse sinus stenosis, glymphatic dysfunction, and obesity-associated
          hormonal alterations - but no single theory explains the entire clinical picture. The metabolic-hormonal
          arm is an attractive upstream driver because pharmacological modulation lowers intracranial
          pressure, yet the AZD4017 trial missed its primary endpoint and the human evidence linking specific
          hormonal axes to choroid plexus secretion is still maturing. Venous sinus stenosis is present
          in most patients and stenting helps a subset, but stenosis frequently reverses once pressure
          is lowered, so it may amplify rather than initiate the disease via a positive feedback loop.
          There is even emerging argument that CSF overproduction is unlikely to be the primary driver
          and that carbonic-anhydrase inhibition targets a consequence rather than the cause. Disentangling
          which node is initiating versus secondary across obese, non-obese, and atypical patients is
          the central unresolved question and would reorder the entire pathophysiology causal graph and
          its therapeutic targets.
        proposed_experiments:
        - experiment_id: exp_iih_mechanism_perturbation_ordering
          experiment_design: HUMAN_OBSERVATIONAL
          name: Interventional perturbation cohort to order metabolic, venous, and CSF mechanisms
          description: Enroll newly diagnosed IIH patients (obese and non-obese strata) and apply mechanism-specific
            perturbations with simultaneous multi-axis monitoring.
          experiment_type:
            preferred_term: prospective interventional mechanistic cohort study
          readouts:
          - name: Metabolic-hormonal response and intracranial pressure
            target: pathophysiology#Metabolic risk background
            description: 'Quantify circulating metabolic and hormonal markers and body composition alongside
              intracranial pressure during a metabolic-hormonal intervention.

              '
            assays:
            - preferred_term: serum hormone quantification
            - preferred_term: lumbar puncture opening pressure measurement
            direction: NEGATIVE
          - name: CSF secretion response to carbonic anhydrase inhibition
            target: pathophysiology#Choroid plexus CSF hypersecretion
            description: 'Measure intracranial pressure and CSF dynamics before and after carbonic anhydrase
              inhibition.

              '
            assays:
            - preferred_term: cerebrospinal fluid dynamics assessment
            direction: NEGATIVE
          - name: Trans-stenosis gradient and pressure coupling
            target: pathophysiology#Venous sinus stenosis
            description: 'Measure the transverse-sinus trans-stenosis pressure gradient before and after
              intracranial pressure is lowered, and before and after stenting.

              '
            assays:
            - preferred_term: catheter cerebral venography pressure gradient measurement
            direction: POSITIVE
          decision_criterion: A pathway is supported as a modifiable mediator if its perturbation reproducibly
            changes the expected direct readout and ICP after accounting for weight loss, venous pressure,
            and outflow compensation. Improvement alone does not identify the initiating lesion; causal
            ordering additionally requires temporally resolved measurements before disease onset or a
            justified causal mediation design.
          would_support:
          - pathophysiology#Metabolic risk background
          - pathophysiology#Choroid plexus CSF hypersecretion
          - pathophysiology#Venous sinus stenosis
      selected_evidence:
        snippet: Several mechanisms have been proposed as the underlying cause of IIH, such as an overproduction
          of cerebrospinal fluid (CSF), outflow obstruction, elevated pressure in the venous sinuses and
          more recently a dysfunction in the glymphatic pathway as well as hormonal alterations.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33631966
      reference_title: Diagnosis and treatment of idiopathic intracranial hypertension.
      evidence_source: OTHER
      explanation: Directly enumerates the competing candidate mechanisms whose causal ordering is unresolved.
