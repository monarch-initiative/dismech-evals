    evidence_metadata:
      reference: PMID:40937960
      reference_title: 'Efficacy and Safety of GLP-1 and Dual GIP/GLP-1 Receptor Agonists in Idiopathic
        Intracranial Hypertension: A Systematic Review and Meta-Analysis.'
      evidence_source: HUMAN_CLINICAL
      explanation: Across 1550 patients pooled from one randomized trial, one non-randomized case-control
        study and two registries, incretin treatment was associated with lower papilledema and visual-disturbance
        risk without a detectable body mass index effect, which is the pattern a direct action on secretory
        transport predicts. A pooled null for one covariate is not a mediation analysis, the registries
        dominate the sample, and the pooled agents include dual GIP/GLP-1 receptor agonists rather than
        exenatide alone, so this weakens the weight-loss explanation without establishing the secretory
        one.
