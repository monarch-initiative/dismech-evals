      assertion_type: Discussion
      assertion:
        discussion_id: gap_iih_topiramate_mechanism
        prompt: Does topiramate lower intracranial pressure in idiopathic intracranial hypertension by
          reducing choroid plexus CSF secretion, through weight loss, or by another action?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#Topiramate
        - pathophysiology#Choroid plexus CSF hypersecretion
        rationale: 'The edge already marks carbonic anhydrase inhibition as a proposed action that the
          cited trial did not isolate. The evidence for each step is uneven. Topiramate inhibits carbonic
          anhydrase, and carbonic anhydrase inhibition lowers CSF secretion in animals. CSF secretion
          has never been measured in patients taking topiramate, so whether it falls, and whether that
          fall produces the clinical benefit, are both untested.

          Two findings weaken the secretion route specifically. In a randomized crossover trial in patients,
          topiramate lowered intracranial pressure only marginally and not significantly, although that
          trial was not powered to compare drugs. In rats, topiramate lowered intracranial pressure where
          acetazolamide, a carbonic anhydrase inhibitor used for the same purpose, did not, which points
          to an action beyond carbonic anhydrase inhibition. Weight loss and migraine control are competing
          routes that the clinical studies do not separate.

          Research report: research/drug_mechanism/pseudotumor_cerebri-drug-mechanism-topiramate-deep-research-openscientist.md.'
      selected_evidence:
        snippet: Acetazolamide, furosemide, spironolactone, and topiramate marginally reduced ICP. While
          their effects were not significant, this study was not powered to detect a difference between
          drugs.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/6
      evidence_path: /discussions/6/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39853738
      reference_title: A randomized sequential cross-over trial evaluating five purportedly ICP-lowering
        drugs in idiopathic intracranial hypertension.
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      explanation: In patients, topiramate's effect on intracranial pressure was marginal and not significant.
        The authors note the trial was not powered to compare drugs, so this weakens rather than refutes
        a pressure-lowering action.
