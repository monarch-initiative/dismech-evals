        hypothesis_label: Primary Venous Sinus Obstruction Model
        status: ALTERNATIVE
        description: A venous contribution can arise from intrinsic transverse-sigmoid narrowing or pressure-dependent
          extrinsic compression. A significant gradient can sustain venous hypertension and impaired CSF
          outflow, with ICP-dependent narrowing closing a feedback loop. Stenting responses support a
          modifiable hemodynamic contributor in selected patients but do not establish that venous obstruction
          initiates every case.
      selected_evidence:
        snippet: Venous sinus stenosis, typically at the junction of the transverse and sigmoid sinus,
          is increasingly recognized as a contributor to the pathophysiology of idiopathic intracranial
          hypertension (IIH), whether it be the intrinsic type that does not reverse with normalization
          of intracranial pressure or the extrinsic type, which does.
        supports: SUPPORT
