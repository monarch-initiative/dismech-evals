      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: choroid_plexus_csf_hypersecretion
        hypothesis_label: Choroid Plexus CSF Hypersecretion (Metabolic-Hormonal) Model
        status: EMERGING
        description: Metabolic and hormonal abnormalities may contribute to raised ICP through choroid
          plexus secretion in a subset of IIH. Human androgen excess and rodent perturbations support
          plausibility, but direct human secretion measurements and causal ordering remain unresolved.
          GLP-1 receptor agonism suppresses secretory transport in preclinical systems and lowers ICP
          in a small randomized trial; endogenous GLP-1 deficiency has not been established. The AZD4017
          trial did not meet its primary between-group endpoint. Impaired outflow, intrinsic venous lesions,
          and pressure-dependent venous feedback may act in parallel or dominate in other patients.
        notes: 'Retain EMERGING. OpenScientist correctly argues against promoting a single primary hypersecretion
          model, but overstates several supporting claims: chronic testosterone activated NKCC1 rather
          than Na+/K+-ATPase in PMID:37328884, intrinsic stenosis proportions come from a selected stenting
          cohort, and pharmacological response does not establish the untreated initiating lesion. The
          assessment sidecar records these and other source-level qualifications.'
      selected_evidence:
        snippet: Women with IIH showed a pattern of androgen excess distinct to that observed in PCOS
          and simple obesity, with increased serum testosterone and increased CSF testosterone and androstenedione.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30753168
      reference_title: A unique androgen excess signature in idiopathic intracranial hypertension is linked
